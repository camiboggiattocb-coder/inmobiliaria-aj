<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestión Inmobiliaria</title>
<style>
  :root {
    --ink: #1a2332;
    --ink-soft: #4a5568;
    --paper: #f4f5f7;
    --surface: #ffffff;
    --line: #e2e6ec;
    --line-strong: #cbd3df;
    --brand: #1f4e6b;
    --brand-deep: #163a50;
    --brand-soft: #e8f0f5;
    --accent: #c9821e;
    --accent-soft: #fbf0dd;
    --green: #2e7d4f;
    --green-soft: #e3f1e8;
    --red: #c0392b;
    --red-soft: #fbe9e7;
    --amber: #b8860b;
    --amber-soft: #fdf3d8;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(22,58,80,.08), 0 1px 2px rgba(22,58,80,.04);
    --shadow-lg: 0 8px 28px rgba(22,58,80,.16);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.5; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  /* Layout */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 230px; background: var(--brand-deep); color: #dfe8ee; flex-shrink: 0;
    display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 30;
  }
  .brand { padding: 18px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.1); text-align: center; }
  .brand-logo { background: #f4f1ea; border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
  .brand-logo img { width: 100%; max-width: 150px; height: auto; display: block; border-radius: 6px; }
  .brand h1 { font-size: 13.5px; font-weight: 600; color: #cddae3; letter-spacing: .3px; line-height: 1.3; }
  .brand span { font-size: 11px; color: #8fb0c4; text-transform: uppercase; letter-spacing: 1px; }
  .nav { padding: 12px 0; flex: 1; overflow-y: auto; }
  .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: #6f93a8; padding: 14px 20px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 9px 20px; color: #c4d4de;
    border: none; background: none; width: 100%; text-align: left; font-size: 13.5px; transition: all .15s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,.09); color: #fff; border-left-color: var(--accent); font-weight: 600; }
  .nav-item .ic { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
  .nav-foot { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.1); font-size: 12px; color: #8fb0c4; }
  .user-badge { display: flex; align-items: center; gap: 9px; }
  .user-badge .av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }

  .main { flex: 1; margin-left: 230px; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 28px;
    height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20;
  }
  .topbar .crumb { font-size: 13px; color: var(--ink-soft); }
  .topbar .crumb b { color: var(--ink); font-weight: 600; }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .content { padding: 26px 28px 60px; max-width: 1280px; width: 100%; }

  /* Role switch */
  .role-switch { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .role-switch select { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); }

  /* Page head */
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
  .page-head h2 { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -.3px; }
  .page-head p { color: var(--ink-soft); margin-top: 3px; font-size: 13.5px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; transition: all .15s; }
  .btn:hover { background: #f8f9fb; border-color: var(--brand); }
  .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn-primary:hover { background: var(--brand-deep); color: #fff; }
  .btn-sm { padding: 6px 11px; font-size: 12px; }
  .btn .ic { width: 15px; height: 15px; }

  /* Cards & grid */
  .grid { display: grid; gap: 16px; }
  .stat-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .stat { padding: 18px 20px; }
  .stat .lbl { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
  .stat .val { font-size: 28px; font-weight: 700; color: var(--ink); margin-top: 6px; letter-spacing: -.5px; }
  .stat .sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .stat .val.brand { color: var(--brand); }

  /* Section */
  .section { margin-top: 26px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
  .section-head h3 { font-size: 16px; font-weight: 700; color: var(--ink); }

  /* Table */
  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #f7f9fb; text-align: left; padding: 11px 16px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-soft); font-weight: 700; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody td { padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  tbody tr.sold { background: #fdecea; }
  tbody tr.sold:hover { background: #fbe0dc; }
  tbody tr.sold td:first-child { box-shadow: inset 3px 0 0 var(--red); }
  .code-tag { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
  .t-strong { font-weight: 600; color: var(--ink); }
  .t-muted { color: var(--ink-soft); font-size: 12.5px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .badge.green { background: var(--green-soft); color: var(--green); }
  .badge.red { background: var(--red-soft); color: var(--red); }
  .badge.amber { background: var(--amber-soft); color: var(--amber); }
  .badge.blue { background: var(--brand-soft); color: var(--brand); }
  .badge.gray { background: #eef1f4; color: var(--ink-soft); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill { display: inline-flex; padding: 2px 9px; border-radius: 5px; font-size: 11px; font-weight: 600; background: #eef1f4; color: var(--ink-soft); }
  .pill.sale { background: var(--brand-soft); color: var(--brand); }
  .pill.rent { background: var(--accent-soft); color: var(--accent); }

  /* Empty state */
  .empty { text-align: center; padding: 54px 20px; color: var(--ink-soft); }
  .empty .ic { width: 44px; height: 44px; margin: 0 auto 14px; opacity: .4; }
  .empty h4 { font-size: 16px; color: var(--ink); margin-bottom: 6px; font-weight: 600; }
  .empty p { font-size: 13.5px; max-width: 380px; margin: 0 auto 16px; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .tab { padding: 10px 18px; border: none; background: none; font-size: 14px; color: var(--ink-soft); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(22,40,55,.45); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 16px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 620px; box-shadow: var(--shadow-lg); animation: pop .18s ease; }
  .modal.wide { max-width: 920px; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { font-size: 17px; font-weight: 700; }
  .modal-body { padding: 22px 24px; max-height: 60vh; overflow-y: auto; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
  .x-btn { background: none; border: none; font-size: 22px; color: var(--ink-soft); line-height: 1; padding: 0 4px; }

  /* Forms */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-row.one { grid-template-columns: 1fr; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .field .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }

  /* Drive link */
  .drive-link { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); font-weight: 600; font-size: 13px; text-decoration: none; }
  .drive-link:hover { text-decoration: underline; }

  /* Alarm list */
  .alarm { display: flex; gap: 13px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .alarm:last-child { border-bottom: none; }
  .alarm-ic { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .alarm-ic.red { background: var(--red-soft); color: var(--red); }
  .alarm-ic.amber { background: var(--amber-soft); color: var(--amber); }
  .alarm-ic.blue { background: var(--brand-soft); color: var(--brand); }
  .alarm-body { flex: 1; }
  .alarm-body .t { font-weight: 600; font-size: 13.5px; }
  .alarm-body .d { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .alarm-time { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

  /* Detail */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; }
  .detail-item .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-soft); font-weight: 600; }
  .detail-item .v { font-size: 14.5px; color: var(--ink); margin-top: 3px; }

  .hidden { display: none !important; }
  .row-actions { display: flex; gap: 6px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-soft); }
  .icon-btn:hover { border-color: var(--brand); color: var(--brand); }
  .icon-btn .ic { width: 15px; height: 15px; }

  .notice { background: var(--accent-soft); border: 1px solid #f0d8a8; border-radius: 8px; padding: 13px 16px; font-size: 13px; color: #7a5610; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 20px; }
  .notice .ic { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

  @media (max-width: 860px) {
    .sidebar { transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-toggle { display: inline-flex !important; }
    .form-row { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
  }
  .menu-toggle { display: none; }

  /* --- Agregados v2 --- */
  .checkbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .checkbox-grid label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--ink); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .checkbox-grid label:hover { border-color: var(--brand); background: #f8f9fb; }
  .checkbox-grid input { width: auto; margin: 0; }
  .form-section { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; background: #fafbfc; }
  .form-section > h4 { font-size: 13px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 13px; display: flex; align-items: center; gap: 7px; }
  .form-section > h4 .ic { width: 15px; height: 15px; }
  .breakdown { background: var(--brand-soft); border-radius: 8px; padding: 14px 16px; margin-top: 6px; }
  .breakdown .line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13.5px; }
  .breakdown .line.total { border-top: 1px solid var(--line-strong); margin-top: 6px; padding-top: 9px; font-weight: 700; font-size: 16px; color: var(--brand); }
  .file-drop { border: 1.5px dashed var(--line-strong); border-radius: 8px; padding: 16px; text-align: center; color: var(--ink-soft); font-size: 13px; cursor: pointer; transition: all .15s; }
  .file-drop:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .file-drop.has-file { border-style: solid; border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 600; }
  .file-row { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .timeline { list-style: none; }
  .timeline li { padding: 7px 0 7px 18px; border-left: 2px solid var(--line-strong); position: relative; font-size: 13px; }
  .timeline li::before { content: ''; position: absolute; left: -5px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
  .seg button { padding: 8px 14px; border: none; background: var(--surface); font-size: 13px; color: var(--ink-soft); }
  .seg button.active { background: var(--brand); color: #fff; font-weight: 600; }
</style>

/* ---------- Datos (se cargan desde Firebase al iniciar) ----------
   En esta versión los datos NO están acá: se leen de Firestore.
   DB funciona como caché local que se sincroniza con la nube. */
const DB = {
  properties: [],
  leads: [],
  contracts: [],
  nextId: { properties:1, leads:1, contracts:1 },
  nextCodigo: 1,
};

const STATE = { role:"admin", page:"dashboard", usuario:null };

/* ---------- Configuración de roles ---------- */
const ROLES = {
  admin:   { name:"Acceso total",      sub:"Todos los módulos",       av:"A", pages:["dashboard","properties","sales","rentals","contracts","alarms","users"], edit:true },
  sales:   { name:"Solo ventas",        sub:"Módulo de Ventas",        av:"V", pages:["sales"],            edit:true },
  rentals: { name:"Solo alquileres",    sub:"Alquileres y contratos",  av:"AL", pages:["rentals","contracts","alarms"], edit:true },
  viewer:  { name:"Visor (colega)",     sub:"Solo lectura · Ventas",   av:"C", pages:["sales"],            edit:false },
};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const fmt = (n, cur="ARS") => {
  if (n == null || isNaN(n)) return "—";
  const s = new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(n);
  return (cur==="USD"?"US$ ":"$ ") + s;
};
const fdate = d => { if(!d) return "—"; const [y,m,day]=d.split("-"); return `${day}/${m}/${y}`; };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const addMonths = (d, n) => { const dt = new Date(d); dt.setMonth(dt.getMonth()+n); return dt.toISOString().slice(0,10); };
const today = "2026-06-17";
const prop = id => DB.properties.find(p=>p.id===id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isVivienda = t => t==="Casa" || t==="Departamento";
const esVendida = p => p.enVenta && p.estadoOp === "Vendida";
const can = () => ROLES[STATE.role].edit;

/* ---------- Motor de alarmas ---------- */
function computeAlarms() {
  const out = [];
  DB.contracts.forEach(c => {
    const p = prop(c.propId);
    if (c.proxActualiz) {
      const dd = daysBetween(today, c.proxActualiz);
      if (dd <= 30) out.push({ level: dd<0?"red":"amber", icon:I.money,
        title:`Actualización de alquiler — ${p?.titulo||"Propiedad"}`,
        desc:`Ajuste por ${c.indice} ${dd<0?"vencido":"a aplicar"} el ${fdate(c.proxActualiz)}`,
        when: dd<0?`Hace ${-dd} días`:`En ${dd} días`, cat:"rentals" });
    }
    if (c.fin) {
      const dd = daysBetween(today, c.fin);
      if (dd <= 90 && dd >= 0) out.push({ level: dd<30?"red":"amber", icon:I.cal,
        title:`Vencimiento de contrato — ${p?.titulo||"Propiedad"}`,
        desc:`El contrato de ${c.inquilino} finaliza el ${fdate(c.fin)}`,
        when:`En ${dd} días`, cat:"rentals" });
    }
    (c.cuotas||[]).forEach(q => {
      if (!q.pagado) {
        const dd = daysBetween(q.mes+"-10", today);
        if (dd > 0) out.push({ level:"red", icon:I.warn,
          title:`Cuota impaga — ${p?.titulo||"Propiedad"}`,
          desc:`${c.inquilino}: cuota ${q.mes} vencida hace ${dd} días.`,
          when:`Venció hace ${dd} días`, cat:"rentals" });
      }
    });
  });
  // Termotanque: solo en propiedades en alquiler (para recordarle al inquilino)
  DB.properties.forEach(p => {
    if (p.enAlquiler && p.aguaCaliente === "Termotanque" && p.ultCambioVarilla) {
      const prox = addMonths(p.ultCambioVarilla, 8);
      const dd = daysBetween(today, prox);
      if (dd <= 21) out.push({ level: dd<0?"red":"amber", icon:I.flame,
        title:`Cambio de varilla (termotanque) — ${p.titulo}`,
        desc:`Mantenimiento cada 8 meses. ${dd<0?"Vencido el":"A realizar el"} ${fdate(prox)}. Último cambio: ${fdate(p.ultCambioVarilla)}.`,
        when: dd<0?`Hace ${-dd} días`:`En ${dd} días`, cat:"rentals",
        action:`Mant.registrarVarilla(${p.id})` });
    }
  });
  DB.leads.forEach(l => {
    if (l.proxima) {
      const dd = daysBetween(today, l.proxima);
      if (dd <= 2) { const p = prop(l.propId);
        out.push({ level: dd<0?"red":"blue", icon:I.users,
          title:`Seguimiento de interesado — ${l.nombre}`,
          desc:`${p?.titulo||""} · ${l.estado}. Próximo contacto ${fdate(l.proxima)}`,
          when: dd<0?`Atrasado ${-dd} días`:(dd===0?"Hoy":`En ${dd} días`), cat:"sales" });
      }
    }
  });
  const order = {red:0,amber:1,blue:2};
  return out.sort((a,b)=>order[a.level]-order[b.level]);
}
/* ---------- Navegación ---------- */
const NAV = [

/* ============================================================
   APP
   ============================================================ */
const App = {
  // En la versión Firebase el rol lo fija el usuario logueado (no hay selector).
  initFirebase(rol){
    STATE.role = rol;
    const cfg = ROLES[rol] || ROLES.viewer;
    // datos del usuario en la barra superior
    const tn = document.getElementById('topUserName');
    const tr = document.getElementById('topUserRole');

    if (tr) tr.textContent = cfg.name;

    $("#userAv").textContent = (STATE.usuario?.nombre || cfg.name).charAt(0).toUpperCase();

    $("#userRole").textContent = cfg.name;
    const allowed = cfg.pages;
    this.go(allowed[0]);
  },

  // setRole se mantiene por compatibilidad interna, sin selector
  setRole(r){
    STATE.role = r;
    const cfg = ROLES[r];
    const allowed = cfg.pages;
    this.go(allowed.includes(STATE.page) ? STATE.page : allowed[0]);
  },

  renderNav(){
    const allowed = ROLES[STATE.role].pages;
    let lastWasSep = true; let html = "";
    NAV.forEach(n=>{
      if (n.sep){ html += `<div class="nav-label">${n.sep}</div>`; return; }
      if (!allowed.includes(n.id)) return;
      html += `<button class="nav-item ${STATE.page===n.id?'active':''}" onclick="App.go('${n.id}')">${n.icon}<span>${n.label}</span></button>`;
    });
    $("#nav").innerHTML = html;
  },

  go(page){
    STATE.page = page;
    if (!ROLES[STATE.role].pages.includes(page)) page = ROLES[STATE.role].pages[0], STATE.page = page;
    this.renderNav();
    const item = NAV.find(n=>n.id===page);
    $("#crumb").innerHTML = `<b>${item?item.label:""}</b>`;
    document.getElementById('sidebar').classList.remove('open');
    const fn = "render_"+page;
    $("#content").innerHTML = this[fn] ? this[fn]() : "<p>En construcción</p>";
  },

  /* ---------- DASHBOARD ---------- */
  render_dashboard(){
    const ventas = DB.properties.filter(p=>p.enVenta);
    const alquileres = DB.properties.filter(p=>p.enAlquiler);
    const vigentes = DB.contracts.filter(c=>c.estado==="Vigente");
    const alarms = computeAlarms();
    const leadsActivos = DB.leads.filter(l=>l.estado!=="Descartado").length;
    return `
      <div class="page-head">
        <div><h2>Panel principal</h2><p>Resumen general de la operación · ${fdate(today)}</p></div>
        <button class="btn btn-primary" onclick="Prop.form()">${I.plus} Nueva propiedad</button>
      </div>
      <div class="grid stat-grid">
        <div class="card stat"><div class="lbl">En venta</div><div class="val brand">${ventas.length}</div><div class="sub">propiedades publicadas</div></div>
        <div class="card stat"><div class="lbl">En alquiler</div><div class="val brand">${alquileres.length}</div><div class="sub">${vigentes.length} con contrato vigente</div></div>
        <div class="card stat"><div class="lbl">Interesados activos</div><div class="val">${leadsActivos}</div><div class="sub">en seguimiento</div></div>
        <div class="card stat"><div class="lbl">Alarmas</div><div class="val" style="color:${alarms.length?'var(--red)':'var(--green)'}">${alarms.length}</div><div class="sub">requieren atención</div></div>
      </div>
      <div class="section">
        <div class="section-head"><h3>Alarmas y vencimientos próximos</h3>
          <button class="btn btn-sm" onclick="App.go('alarms')">Ver todas</button></div>
        <div class="card">
          ${alarms.length ? alarms.slice(0,6).map(a=>App.alarmRow(a)).join("")
          : `<div class="empty"><div class="ic">${I.bell}</div><h4>Todo al día</h4><p>No hay alarmas activas.</p></div>`}
        </div>
      </div>`;
  },

  alarmRow(a){
    return `<div class="alarm">
      <div class="alarm-ic ${a.level}">${a.icon}</div>
      <div class="alarm-body"><div class="t">${a.title}</div><div class="d">${a.desc}</div>
        ${a.action?`<button class="btn btn-sm" style="margin-top:8px" onclick="${a.action}">${I.tools} Registrar cambio realizado</button>`:""}
      </div>
      <div class="alarm-time">${a.when}</div>
    </div>`;
  },

  /* ---------- MAESTRO DE PROPIEDADES ---------- */
  render_properties(){
    const rows = DB.properties;
    return `
      <div class="page-head">
        <div><h2>Maestro de propiedades</h2><p>Base única. Una misma propiedad puede estar en venta y en alquiler.</p></div>
        <button class="btn btn-primary" onclick="Prop.form()">${I.plus} Nueva propiedad</button>
      </div>
      ${rows.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Código</th><th>Propiedad</th><th>Tipo</th><th>Superficie</th><th>Operación</th><th>Drive</th><th>Visible col.</th><th></th></tr></thead>
        <tbody>
          ${rows.map(p=>`
            <tr class="${esVendida(p)?'sold':''}">
              <td><span class="code-tag">${esc(p.codigo||"—")}</span></td>
              <td><div class="t-strong">${esc(p.titulo)}</div><div class="t-muted">${esc(p.direccion)}, ${esc(p.localidad)}</div></td>
              <td>${esc(p.tipo)}</td>
              <td>${p.supCub||"—"} m²<div class="t-muted">${p.supTot||"—"} m² tot.</div></td>
              <td>${p.enVenta?`<span class="pill sale">Venta</span> `:''}${p.enAlquiler?'<span class="pill rent">Alquiler</span>':''}${!p.enVenta&&!p.enAlquiler?'<span class="pill">Sin publicar</span>':''}${esVendida(p)?'<span class="badge red" style="margin-left:4px"><span class="dot"></span>Vendida</span>':''}</td>
              <td><a class="drive-link" href="${esc(p.drive)}" target="_blank">${I.drive} Abrir</a></td>
              <td>${p.visibleColegas?'<span class="badge green"><span class="dot"></span>Sí</span>':'<span class="badge gray">No</span>'}</td>
              <td><div class="row-actions">
                <button class="icon-btn" title="Ver" onclick="Prop.view(${p.id})">${I.eye}</button>
                <button class="icon-btn" title="Editar" onclick="Prop.form(${p.id})">${I.edit}</button>
                ${(STATE.role==="admin")?`<button class="icon-btn" title="Eliminar" onclick="Prop.eliminar(${p.id})">${I.trash}</button>`:""}
              </div></td>
            </tr>`).join("")}
        </tbody>
      </table></div>` : App.emptyState("No hay propiedades cargadas","Empezá cargando la primera propiedad.","Cargar propiedad","Prop.form()")}
    `;

  /* ---------- VENTAS ---------- */
  render_sales(){
    const isViewer = STATE.role==="viewer";
    let ventas = DB.properties.filter(p=>p.enVenta);
    if (isViewer) ventas = ventas.filter(p=>p.visibleColegas);

      <div class="page-head">
        <div><h2>Ventas</h2><p>${isViewer?"Propiedades disponibles para ofrecer. Solo lectura.":"Propiedades en venta, valores e interesados."}</p></div>
        ${(!isViewer && can())?`<button class="btn btn-primary" onclick="Prop.form(null,'venta')">${I.plus} Nueva propiedad en venta</button>`:""}
      </div>`;
    const notice = isViewer?`<div class="notice">${I.eye}<div>Vista <b>Visor (colega)</b>: solo lectura, solo propiedades habilitadas, sin propietario, comisión ni interesados.</div></div>`:"";
    if (!ventas.length) return head+notice+App.emptyState("Sin propiedades en venta", isViewer?"No hay propiedades habilitadas para mostrar.":"Marcá una propiedad como 'en venta'.", (isViewer||!can())?null:"Nueva propiedad", "Prop.form(null,'venta')");
    return head+notice+`
      <div class="table-wrap"><table>
        <thead><tr>${isViewer?"":"<th>Código</th>"}<th>Propiedad</th><th>Valor</th>
          ${isViewer?"":"<th>Propietario</th><th>Comisión</th><th>Estado</th><th>Interesados</th><th>Publicada</th>"}
          <th>Financiación</th><th>Drive</th><th></th></tr></thead>
        <tbody>
          ${ventas.map(p=>{
            const leads = DB.leads.filter(l=>l.propId===p.id);
            const ant = p.fechaPub?daysBetween(p.fechaPub,today):null;
            const vc = k => !isViewer || App.visorVe(p,k); // admin ve todo; visor según config
            const finBadges = vc('financiacion') ? `${p.aptaCredito?'<span class="badge blue" style="margin-right:4px">Apta crédito</span>':''}${p.aceptaFinanciacion?'<span class="badge green">Financia</span>':''}${(!p.aptaCredito&&!p.aceptaFinanciacion)?'<span class="t-muted">—</span>':''}` : '<span class="t-muted">—</span>';
            const ubic = isViewer ? esc(p.localidad||"—") : esc(p.direccion);
            const comMonto = (p.comision && p.valorVenta) ? fmt(Math.round(p.valorVenta*p.comision/100), p.monedaVenta) : null;
            return `<tr class="${esVendida(p)?'sold':''}">

      <div class="table-wrap"><table>
        <thead><tr><th>Propiedad / Inquilino</th><th>Vigencia</th><th>Valor</th><th>Actualización</th><th>Estado</th><th>Cobros</th><th></th></tr></thead>
        <tbody>
          ${DB.contracts.map(c=>{
            const p = prop(c.propId);
            const pend = (c.cuotas||[]).filter(q=>!q.pagado).length;

              <td><div class="t-strong">${esc(p?.titulo||"—")}</div><div class="t-muted">${esc(c.inquilino)}</div></td>

              <td>${App.contractBadge(c.estado)}</td>

};
/* ============================================================
   PROPIEDADES
   ============================================================ */
const Prop = {
  form(id, foco){
    const p = id ? prop(id) : {};
    const v = (k,d="") => p[k]!=null ? p[k] : d;
    const sel = (k,val) => v(k)===val ? "selected" : "";

    Modal.open(id?"Editar propiedad":"Nueva propiedad", `

        <h4>${I.home} Datos generales</h4>

        </div>

          <div class="field"><label>Año / antigüedad</label><input id="f_anio" type="number" value="${esc(v('anio'))}"></div>

        </div>
      </div>

      <!-- VIVIENDA (solo casa/depto) -->
      <div class="form-section" id="sec_vivienda">

          <div class="field"><label>Ambientes</label><input id="f_ambientes" type="number" value="${esc(v('ambientes'))}"></div>

        <div class="form-row">
          <div class="field"><label>Baños</label><input id="f_banos" type="number" value="${esc(v('banos'))}"></div>
          <div class="field"><label>Cochera / garage</label><select id="f_cochera">
            ${["No tiene","Cochera","Garage"].map(o=>`<option ${sel('cochera',o)}>${o}</option>`).join("")}
          </select></div>
        </div>
        <div class="field" style="margin-bottom:12px"><label>Comodidades</label>

            <label><input type="checkbox" id="f_patio" ${ck('patio')}> Patio / jardín</label>
            <label><input type="checkbox" id="f_living" ${ck('living')}> Living-comedor</label>
            <label><input type="checkbox" id="f_cocina" ${ck('cocina')}> Cocina</label>
            <label><input type="checkbox" id="f_lavadero" ${ck('lavadero')}> Lavadero</label>
            <label><input type="checkbox" id="f_balcon" ${ck('balcon')}> Balcón</label>
            <label><input type="checkbox" id="f_amoblado" ${ck('amoblado')}> Amoblado</label>

      <div class="form-section" id="sec_campo">

        </div>

          <div class="field"><label>Actividad</label><select id="f_actividad">

          <div class="field"><label>Observaciones del campo</label><textarea id="f_obsCampo" rows="2" placeholder="Detalles del terreno, aguadas, alambrados, mejoras, etc.">${esc(v('obsCampo'))}</textarea></div>
        </div>
        <div class="form-row one">
          <div class="field"><label>Forma de venta</label><textarea id="f_formaVenta" rows="2" placeholder="Ej: contado, permuta por cereal, financiada, etc.">${esc(v('formaVenta'))}</textarea></div>

          <div class="field"><label>Sistema de agua caliente</label><select id="f_aguaCaliente" onchange="Prop.toggleAgua()">

        <div class="field" style="margin-top:6px"><label style="font-size:14px"><input type="checkbox" id="f_visible" ${ck('visibleColegas')} style="width:auto;margin-right:7px" onchange="Prop.toggleVisor()"> <b>Visible para colegas</b> (perfil Visor)</label></div>

          <div class="hint" style="margin-bottom:12px; color:#3a5a6e">Estas casillas controlan lo que ve el Visor. <b>Vienen todas tildadas</b>: destildá la que no quieras mostrar. Lo destildado le aparece como "A consultar" o directamente no se muestra. La dirección exacta, el propietario, la comisión y los interesados <b>nunca</b> se muestran (el colega ve solo la localidad).</div>
          <div class="checkbox-grid" style="background:var(--surface); padding:10px; border-radius:6px">
            ${[["valor","Valor de venta"],["superficie","Superficie"],["ambientes","Ambientes / dorm. / baños"],["anio","Año / antigüedad"],["estado","Estado"],["servicios","Servicios"],["financiacion","Financiación y apta crédito"]].map(([k,lbl])=>{
              const vc = v('visorCampos', null);
              const checked = (vc==null || vc[k]) ? "checked" : "";
              return `<label><input type="checkbox" class="f_visorcampo" value="${k}" ${checked}> ${lbl}</label>`;
            }).join("")}
          </div>
        </div>
      </div>

      <!-- OPERACIÓN -->
      <div class="form-section">
        <h4>${I.sale} Tipo de operación</h4>
        <div class="form-row">
          <div class="field"><label>¿En venta?</label><select id="f_enVenta" onchange="Prop.toggleOp()"><option value="1" ${p.enVenta?'selected':''}>Sí</option><option value="0" ${!p.enVenta?'selected':''}>No</option></select></div>
          <div class="field"><label>¿En alquiler?</label><select id="f_enAlquiler" onchange="Prop.toggleOp()"><option value="1" ${p.enAlquiler?'selected':''}>Sí</option><option value="0" ${!p.enAlquiler?'selected':''}>No</option></select></div>

      <div class="form-section" id="sec_venta">

        <div class="form-row">
          <div class="field"><label>Precio de venta</label><input id="f_valorVenta" type="number" value="${esc(v('valorVenta'))}" oninput="Prop.calcComision()"></div>
          <div class="field"><label>Moneda</label><select id="f_monedaVenta" onchange="Prop.calcComision()"><option ${sel('monedaVenta','USD')}>USD</option><option ${sel('monedaVenta','ARS')}>ARS</option></select></div>
        </div>
        <div class="form-row one">
          <div class="field"><label>Observación del precio</label><input id="f_obsPrecio" value="${esc(v('obsPrecio'))}" placeholder="Ej: precio a convenir, no incluye gastos, USD billete, etc."></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Propietario</label><input id="f_propietario" value="${esc(v('propietario'))}"></div>

            ${["Monotributo","Resp. Inscripto","Exento","Consumidor final"].map(o=>`<option ${sel('condFiscal',o)}>${o}</option>`).join("")}

        </div>
        <div class="form-row">
          <div class="field"><label>Comisión pactada (%)</label><input id="f_comision" type="number" step="0.1" value="${esc(v('comision'))}" oninput="Prop.calcComision()"></div>
          <div class="field"><label>Comisión estimada (calculada)</label><input id="f_comisionCalc" disabled style="background:var(--brand-soft);font-weight:600;color:var(--brand)"></div>

          <div class="field"><label>Estado de la operación</label><select id="f_estadoOp">

          </select></div>
          <div class="field"><label>Fecha de publicación</label><input id="f_fechaPub" type="date" value="${esc(v('fechaPub',today))}"></div>

          <div class="checkbox-grid" style="grid-template-columns:1fr 1fr">
            <label><input type="checkbox" id="f_aptaCredito" ${ck('aptaCredito')}> Apta crédito hipotecario</label>
            <label><input type="checkbox" id="f_aceptaFinanciacion" ${ck('aceptaFinanciacion')} onchange="Prop.toggleFin()"> Acepta financiación</label>
          </div>
        </div>
        <div class="form-row one" id="sec_fin">
          <div class="field"><label>Detalle de la financiación</label>
            <textarea id="f_tipoFinanciacion" rows="2" placeholder="Ej: 50% al boleto y saldo en 12 cuotas; acepta permuta por auto; etc.">${esc(v('tipoFinanciacion'))}</textarea>

          </div>
        </div>
      </div>

      <!-- DATOS DE ALQUILER -->
      <div class="form-section" id="sec_alquiler">
        <h4>${I.rent} Datos de alquiler</h4>
        <div class="form-row">
          <div class="field"><label>Valor mensual</label><input id="f_valorAlquiler" type="number" value="${esc(v('valorAlquiler'))}"></div>
          <div class="field"><label>Moneda</label><select id="f_monedaAlquiler"><option ${sel('monedaAlquiler','ARS')}>ARS</option><option ${sel('monedaAlquiler','USD')}>USD</option></select></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Propietario</label><input id="f_propietarioAlq" value="${esc(v('propietarioAlq'))}"></div>
          <div class="field"><label>Actualiza cada (meses)</label><input id="f_actualizaCada" type="number" value="${esc(v('actualizaCada',3))}"></div>

          ${["ICL","IPC","Otro"].map(o=>`<option ${sel('indice',o)}>${o}</option>`).join("")}
        </select></div></div>
      </div>
    `, `<button class="btn" onclick="Modal.close()">Cancelar</button><button class="btn btn-primary" onclick="Prop.save(${id||'null'})">${id?'Guardar cambios':'Crear propiedad'}</button>`);

    // estado inicial de los bloques condicionales
    if (foco==='venta') document.getElementById('f_enVenta').value="1";
    if (foco==='alquiler') document.getElementById('f_enAlquiler').value="1";
    Prop.toggleTipo(); Prop.toggleAgua(); Prop.toggleOp(); Prop.toggleVisor(); Prop.calcComision();
  },

  toggleTipo(){
    const t = document.getElementById('f_tipo').value;
    document.getElementById('sec_vivienda').style.display = isVivienda(t) ? "" : "none";
    const sc = document.getElementById('sec_campo');
    if (sc) sc.style.display = (t==="Campo") ? "" : "none";
    // Campos generales que no aplican a Campo ni Terreno
    const esCampo = (t==="Campo"), esTerreno = (t==="Terreno");
    const supCub = document.getElementById('fld_supCub');
    const supTot = document.getElementById('fld_supTot');
    const anioEstado = document.getElementById('row_anioEstado');
    // Sup. cubierta: no va en Campo ni Terreno
    if (supCub) supCub.style.display = (esCampo||esTerreno) ? "none" : "";
    // Sup. total: no va en Campo; en Terreno SÍ va (se mide en m²)
    if (supTot) supTot.style.display = esCampo ? "none" : "";
    // Año y estado: no van en Campo ni Terreno
    if (anioEstado) anioEstado.style.display = (esCampo||esTerreno) ? "none" : "";
    Prop.toggleAguaSec();
  },
  calcComision(){
    const precio = parseFloat(document.getElementById('f_valorVenta')?.value)||0;
    const pct = parseFloat(document.getElementById('f_comision')?.value)||0;
    const mon = document.getElementById('f_monedaVenta')?.value||"USD";
    const out = document.getElementById('f_comisionCalc');
    if (out) out.value = (precio>0 && pct>0) ? fmt(Math.round(precio*pct/100), mon) : "—";
  },
  eliminar(id){
    if (STATE.role!=="admin") { alert("Solo el perfil Acceso total puede eliminar propiedades."); return; }
    const p = prop(id);
    const tieneContrato = DB.contracts.some(c=>c.propId===id);
    let msg = `¿Eliminar la propiedad ${p.codigo} — "${p.titulo}"? Esta acción no se puede deshacer.`;
    if (tieneContrato) msg += "\n\nATENCIÓN: esta propiedad tiene un contrato de alquiler asociado, que también se eliminará.";
    if (!confirm(msg)) return;
    // borrar en la nube (propiedad, sus leads y contratos)
    DB.leads.filter(l=>l.propId===id).forEach(l=>persistDelete('leads', l.id));
    DB.contracts.filter(c=>c.propId===id).forEach(c=>persistDelete('contracts', c.id));
    persistDelete('properties', id);
    DB.properties = DB.properties.filter(x=>x.id!==id);
    DB.leads = DB.leads.filter(l=>l.propId!==id);
    DB.contracts = DB.contracts.filter(c=>c.propId!==id);
    App.go(STATE.page);
  },
  marcarVendida(id){
    const p = prop(id);
    if (!confirm(`¿Marcar "${p.titulo}" como VENDIDA? Quedará resaltada en rojo.`)) return;
    p.estadoOp = "Vendida";
    persist('properties', p);
    App.go(STATE.page);
  },
  toggleAguaSec(){
    // El bloque de agua caliente solo aplica a viviendas que estén en alquiler
    const t = document.getElementById('f_tipo').value;
    const enAlq = document.getElementById('f_enAlquiler').value==="1";
    const mostrar = isVivienda(t) && enAlq;
    document.getElementById('sec_agua').style.display = mostrar ? "" : "none";
    if (mostrar) Prop.toggleAgua();
  },
  toggleAgua(){
    const a = document.getElementById('f_aguaCaliente').value;
    document.getElementById('sec_varilla').style.display = (a==="Termotanque") ? "" : "none";
  },
  toggleOp(){
    document.getElementById('sec_venta').style.display = document.getElementById('f_enVenta').value==="1" ? "" : "none";
    document.getElementById('sec_alquiler').style.display = document.getElementById('f_enAlquiler').value==="1" ? "" : "none";
    Prop.toggleAguaSec();
    Prop.toggleFin();
  },
  toggleFin(){
    const cb = document.getElementById('f_aceptaFinanciacion');
    const sec = document.getElementById('sec_fin');
    if (cb && sec) sec.style.display = cb.checked ? "" : "none";
  },
  toggleVisor(){
    const cb = document.getElementById('f_visible');
    const sec = document.getElementById('sec_visor');
    if (cb && sec) sec.style.display = cb.checked ? "" : "none";
  },

  save(id){
    const g = k => { const el=document.getElementById('f_'+k); return el?el.value:""; };
    const gc = k => { const el=document.getElementById('f_'+k); return el?el.checked:false; };
    const num = k => { const x=parseFloat(g(k)); return isNaN(x)?null:x; };
    const tipo = g('tipo');
    const enVenta = g('enVenta')==="1", enAlquiler = g('enAlquiler')==="1";
    const servicios = Array.from(document.querySelectorAll('.f_serv:checked')).map(e=>e.value);

    const esCampo = (tipo==="Campo"), esTerreno = (tipo==="Terreno");
    const data = {
      titulo:g('titulo'), tipo, localidad:g('localidad'), direccion:g('direccion'),
      supCub: (esCampo||esTerreno) ? null : num('supCub'),
      supTot: esCampo ? null : num('supTot'),
      anio: (esCampo||esTerreno) ? null : num('anio'),
      estado: (esCampo||esTerreno) ? "" : g('estado'),
      servicios, drive:g('drive'), visibleColegas:gc('visible'),
      visorCampos: (function(){
        const keys=["valor","superficie","ambientes","anio","estado","servicios","financiacion"];
        const sel=Array.from(document.querySelectorAll('.f_visorcampo:checked')).map(e=>e.value);
        const obj={}; keys.forEach(k=>obj[k]=sel.includes(k)); return obj;
      })(),
      enVenta, enAlquiler,
    };
    if (isVivienda(tipo)) {
      Object.assign(data, {
        ambientes:num('ambientes'), dorm:num('dorm'), banos:num('banos'), cochera:g('cochera'),
        patio:gc('patio'), living:gc('living'), cocina:gc('cocina'), lavadero:gc('lavadero'),
        balcon:gc('balcon'), amoblado:gc('amoblado'),
      });
      // El agua caliente / termotanque solo aplica a viviendas en alquiler
      if (enAlquiler) {
        data.aguaCaliente = g('aguaCaliente');
        data.ultCambioVarilla = g('aguaCaliente')==="Termotanque" ? (g('ultCambioVarilla')||null) : null;
        if (!id) data.historialVarilla = data.ultCambioVarilla ? [data.ultCambioVarilla] : [];
      } else {
        data.aguaCaliente = null;
        data.ultCambioVarilla = null;
      }
    }
    if (tipo==="Campo") {
      Object.assign(data, {
        tipoSuelo:g('tipoSuelo'), hectareas:num('hectareas'), actividad:g('actividad'),
        edificacion: g('edificacion')==="1", obsCampo:g('obsCampo'), formaVenta:g('formaVenta'),
      });
    }
    if (enVenta) Object.assign(data, {
      valorVenta:num('valorVenta'), monedaVenta:g('monedaVenta'), obsPrecio:g('obsPrecio'), propietario:g('propietario'),
      condFiscal:g('condFiscal'), comision:num('comision'), estadoOp:g('estadoOp'), fechaPub:g('fechaPub'),
      aptaCredito:gc('aptaCredito'), aceptaFinanciacion:gc('aceptaFinanciacion'),
      tipoFinanciacion: gc('aceptaFinanciacion') ? g('tipoFinanciacion') : "",
    });
    if (enAlquiler) Object.assign(data, {
      valorAlquiler:num('valorAlquiler'), monedaAlquiler:g('monedaAlquiler'), propietarioAlq:g('propietarioAlq'),
      actualizaCada:num('actualizaCada'), indice:g('indice'),
    });
    if (!data.titulo) { alert("Poné al menos un título para la propiedad."); return; }

    if (id) {
      const ex = prop(id);
      // preservar historial de varilla existente
      if (data.historialVarilla===undefined) data.historialVarilla = ex.historialVarilla||[];
      // historial de precios de venta: registrar si cambió el valor
      let hist = ex.histPrecios || [];
      if (enVenta && data.valorVenta!=null && (ex.valorVenta!==data.valorVenta || ex.monedaVenta!==data.monedaVenta)) {
        hist = hist.concat([{ fecha:today, valor:data.valorVenta, moneda:data.monedaVenta }]);
      }
      data.histPrecios = hist;
      Object.assign(ex, data);
      persist('properties', ex);
    } else {
      data.id = DB.nextId.properties++;
      data.codigo = "PROP-" + String(DB.nextCodigo++).padStart(4,"0");
      if (enVenta && data.valorVenta!=null) data.histPrecios = [{ fecha:data.fechaPub||today, valor:data.valorVenta, moneda:data.monedaVenta }];
      DB.properties.push(data);
      persist('properties', data);
      persistMeta();
    }
    Modal.close();
    App.go(STATE.page);
    if (!id) setTimeout(()=>alert(`Propiedad creada con código ${data.codigo}.\nUsá este código para nombrar la carpeta en Drive y encontrarla rápido.`),100);
  },

  view(id){
    const p = prop(id);
    const isViewer = STATE.role==="viewer";
    const ve = k => !isViewer || App.visorVe(p,k); // admin ve todo; visor según config
    const item = (k,val)=>`<div class="detail-item"><div class="k">${k}</div><div class="v">${val}</div></div>`;
    let g = [];
    if (!isViewer) g.push(item("Código", `<span class="code-tag">${esc(p.codigo||"—")}</span>`));
    g.push(item("Tipo",esc(p.tipo)));
    g.push(item("Localidad",esc(p.localidad)));
    if (!isViewer) g.push(item("Dirección",esc(p.direccion)));   // dirección exacta nunca al visor
    if (ve('superficie')) g.push(item("Superficie",`${p.supCub||"—"} m² cub. / ${p.supTot||"—"} m² tot.`));
    if (ve('anio')) g.push(item("Año",p.anio||"—"));
    if (ve('estado')) g.push(item("Estado",esc(p.estado||"—")));
    if (isVivienda(p.tipo) && ve('ambientes')) {
      g.push(item("Ambientes",p.ambientes??"—"));
      g.push(item("Dormitorios",p.dorm??"—"));
      g.push(item("Baños",p.banos??"—"));
      g.push(item("Cochera",esc(p.cochera||"—")));
    }
    if (isVivienda(p.tipo)) {
      const comod = [p.patio&&"Patio/jardín",p.living&&"Living",p.cocina&&"Cocina",p.lavadero&&"Lavadero",p.balcon&&"Balcón",p.amoblado&&"Amoblado"].filter(Boolean).join(", ")||"—";
      g.push(item("Comodidades",comod));
      if (p.enAlquiler && !isViewer) g.push(item("Agua caliente",esc(p.aguaCaliente||"—")));
    }
    if (p.tipo==="Campo") {
      g.push(item("Tipo de suelo",esc(p.tipoSuelo||"—")));
      g.push(item("Hectáreas",p.hectareas??"—"));
      g.push(item("Actividad",esc(p.actividad||"—")));
      g.push(item("Edificación",p.edificacion?"Sí":"No"));
    }
    let html = `<div class="detail-grid">${g.join("")}</div>`;
    if (p.tipo==="Campo") {
      if (p.obsCampo) html += `<div class="section"><div class="detail-item"><div class="k">Observaciones del campo</div><div class="v">${esc(p.obsCampo)}</div></div></div>`;
      if (p.formaVenta && !isViewer) html += `<div class="section"><div class="detail-item"><div class="k">Forma de venta</div><div class="v">${esc(p.formaVenta)}</div></div></div>`;
    }
    if ((p.servicios||[]).length && ve('servicios')) html += `<div class="section"><div class="detail-item"><div class="k">Servicios</div><div class="v">${p.servicios.map(s=>esc(s)).join(" · ")}</div></div></div>`;

    // Termotanque (solo propiedades en alquiler)
    if (p.enAlquiler && p.aguaCaliente==="Termotanque" && p.ultCambioVarilla) {
      const prox = addMonths(p.ultCambioVarilla,8);
      html += `<div class="section"><div class="section-head"><h3>Mantenimiento del termotanque</h3></div>
        <div class="card" style="padding:16px">
          <div class="detail-grid">
            ${item("Último cambio de varilla",fdate(p.ultCambioVarilla))}
            ${item("Próximo cambio (8 meses)",fdate(prox))}
          </div>
          ${(p.historialVarilla&&p.historialVarilla.length)?`<div style="margin-top:14px"><div class="k" style="font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:8px">Historial de cambios</div><ul class="timeline">${p.historialVarilla.map(f=>`<li>${fdate(f)}</li>`).join("")}</ul></div>`:""}
          ${can()?`<button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="Mant.registrarVarilla(${p.id})">${I.tools} Registrar cambio realizado hoy</button>`:""}
        </div></div>`;
    }
    if (p.enVenta) {
      const ventaItems = [];
      if (ve('valor')) {
        ventaItems.push(item("Valor", fmt(p.valorVenta,p.monedaVenta) + (p.obsPrecio?`<div class="t-muted" style="font-weight:400">${esc(p.obsPrecio)}</div>`:"")));
      } else if (isViewer) ventaItems.push(item("Valor", '<span class="t-muted">A consultar</span>'));
      if (!isViewer) ventaItems.push(item("Propietario",esc(p.propietario||"—")));
      if (!isViewer) {
        const comMonto = (p.comision && p.valorVenta) ? fmt(Math.round(p.valorVenta*p.comision/100), p.monedaVenta) : null;
        ventaItems.push(item("Comisión",(p.comision||"—")+"%" + (comMonto?`<div class="t-muted" style="font-weight:400">≈ ${comMonto}</div>`:"")));
      }
      ventaItems.push(item("Estado", esVendida(p)?'<span class="badge red"><span class="dot"></span>Vendida</span>':App.opBadge(p.estadoOp)));
      if (ve('financiacion')) {
        ventaItems.push(item("Apta crédito", p.aptaCredito?'<span class="badge green"><span class="dot"></span>Sí</span>':'<span class="badge gray">No</span>'));
        ventaItems.push(item("Acepta financiación", p.aceptaFinanciacion?'<span class="badge green"><span class="dot"></span>Sí</span>':'<span class="badge gray">No</span>'));
      }
      html += `<div class="section"><div class="section-head"><h3>Venta</h3></div><div class="detail-grid">
        ${ventaItems.join("")}</div>
        ${(ve('financiacion') && p.aceptaFinanciacion && p.tipoFinanciacion)?`<div class="detail-item" style="margin-top:14px"><div class="k">Detalle de financiación</div><div class="v">${esc(p.tipoFinanciacion)}</div></div>`:""}
        ${(!isViewer && p.histPrecios && p.histPrecios.length>1)?`<div style="margin-top:14px"><div class="k" style="font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:8px">Historial de precios</div><ul class="timeline">${p.histPrecios.slice().reverse().map(h=>`<li>${fdate(h.fecha)} — ${fmt(h.valor,h.moneda)}</li>`).join("")}</ul></div>`:""}
      </div>`;
    }
    if (p.enAlquiler) html += `<div class="section"><div class="section-head"><h3>Alquiler</h3></div><div class="detail-grid">
      ${item("Valor mensual",fmt(p.valorAlquiler,p.monedaAlquiler))}
      ${item("Actualización",`cada ${p.actualizaCada} meses · ${esc(p.indice||"—")}`)}</div></div>`;
    html += `<div class="section"><a class="btn btn-primary" href="${esc(p.drive)}" target="_blank">${I.drive} Abrir carpeta de Drive</a></div>`;
    Modal.open(p.titulo, html);
  },
};

/* ---------- Mantenimiento termotanque ---------- */
const Mant = {
  registrarVarilla(id){
    const p = prop(id);
    p.ultCambioVarilla = today;
    p.historialVarilla = p.historialVarilla || [];
    p.historialVarilla.unshift(today);
    persist('properties', p);
    Modal.close();
    App.go(STATE.page);
    setTimeout(()=>alert(`Cambio de varilla registrado el ${fdate(today)}.\nPróximo aviso: ${fdate(addMonths(today,8))}.`),100);
  }
};

/* ============================================================
   INTERESADOS
   ============================================================ */
const Lead = {
  list(propId){
    const p = prop(propId);
    const leads = DB.leads.filter(l=>l.propId===propId);
    const body = leads.length?leads.map(l=>`
      <div class="card" style="padding:14px 16px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div><div class="t-strong">${esc(l.nombre)}</div><div class="t-muted">${esc(l.contacto)} · origen: ${esc(l.origen)}</div></div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="badge ${Lead.color(l.estado)}"><span class="dot"></span>${esc(l.estado)}</span>
            ${can()?`<button class="icon-btn" title="Editar" onclick="Lead.form(${propId},${l.id})">${I.edit}</button>`:""}
          </div>
        </div>
        <div style="margin-top:8px;font-size:13px;color:var(--ink-soft)">${esc(l.nota||"")}</div>
        <div style="margin-top:8px;font-size:12px;color:var(--ink-soft)">Último contacto: ${fdate(l.fecha)} · Próxima acción: ${fdate(l.proxima)}</div>
      </div>`).join(""):`<div class="empty" style="padding:30px"><h4>Sin interesados</h4><p>Todavía no hay interesados registrados.</p></div>`;
    Modal.open(`Interesados — ${p?.titulo||""}`, body,
      `<button class="btn" onclick="Modal.close()">Cerrar</button>${can()?`<button class="btn btn-primary" onclick="Lead.form(${propId})">${I.plus} Registrar interesado</button>`:""}`);
  },
  form(propId, leadId){
    const l = leadId ? DB.leads.find(x=>x.id===leadId) : {};
    const v = (k,d="") => l[k]!=null ? l[k] : d;
    const opt = (arr,cur) => arr.map(o=>`<option ${cur===o?'selected':''}>${o}</option>`).join("");
    Modal.open(leadId?"Editar interesado":"Registrar interesado", `
      <div class="form-row"><div class="field"><label>Nombre</label><input id="l_nombre" value="${esc(v('nombre'))}"></div>
        <div class="field"><label>Contacto</label><input id="l_contacto" value="${esc(v('contacto'))}" placeholder="Teléfono o email"></div></div>
      <div class="form-row"><div class="field"><label>Origen</label><select id="l_origen">${opt(["Cartel","Referido","Portal web","Redes","Llamado","Otro"], v('origen'))}</select></div>
        <div class="field"><label>Estado</label><select id="l_estado">${opt(["Nuevo","Contactado","Visita agendada","Negociando","Descartado"], v('estado'))}</select></div></div>
      <div class="form-row"><div class="field"><label>Fecha de contacto</label><input id="l_fecha" type="date" value="${esc(v('fecha',today))}"></div>
        <div class="field"><label>Próxima acción</label><input id="l_proxima" type="date" value="${esc(v('proxima'))}"></div></div>
      <div class="form-row one"><div class="field"><label>Nota / seguimiento / observaciones</label><textarea id="l_nota" rows="3">${esc(v('nota'))}</textarea></div></div>
    `, `<button class="btn" onclick="Lead.list(${propId})">Volver</button><button class="btn btn-primary" onclick="Lead.save(${propId},${leadId||'null'})">${leadId?'Guardar cambios':'Guardar'}</button>`);
  },
  save(propId, leadId){
    const g = k=>document.getElementById('l_'+k).value;
    if (!g('nombre')) { alert("Poné el nombre del interesado."); return; }
    if (leadId) {
      const l = DB.leads.find(x=>x.id===leadId);
      Object.assign(l, { nombre:g('nombre'), contacto:g('contacto'), origen:g('origen'),
        estado:g('estado'), fecha:g('fecha'), proxima:g('proxima'), nota:g('nota') });
      persist('leads', l);
    } else {
      const nuevo = { id:DB.nextId.leads++, propId, nombre:g('nombre'), contacto:g('contacto'),
        origen:g('origen'), estado:g('estado'), fecha:g('fecha'), proxima:g('proxima'), nota:g('nota') };
      DB.leads.push(nuevo);
      persist('leads', nuevo);
      persistMeta();
    }
    Lead.list(propId);
  },
  color(s){ return {"Nuevo":"blue","Contactado":"amber","Visita agendada":"amber","Negociando":"green","Descartado":"gray"}[s]||"gray"; }
};

/* ============================================================
   CONTRATOS Y COBROS
   ============================================================ */
