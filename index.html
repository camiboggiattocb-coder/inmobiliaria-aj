          <div class="field"><label>¿En venta?</label><select id="f_enVenta" onchange="Prop.toggleOp()"><option value="1" ${p.enVenta?'selected':''}>Sí</option><option value="0" ${!p.enVenta?'selected':''}>No</option></select></div>
          <div class="field"><label>¿En alquiler?</label><select id="f_enAlquiler" onchange="Prop.toggleOp()"><option value="1" ${p.enAlquiler?'selected':''}>Sí</option><option value="0" ${!p.enAlquiler?'selected':''}>No</option></select></div>
        </div>
      </div>

      <!-- DATOS DE VENTA -->
      <div class="form-section" id="sec_venta">
        <h4>${I.money} Datos de venta</h4>
        <div class="form-row">
          <div class="field"><label>Precio de venta</label><input id="f_valorVenta" type="number" value="${esc(v('valorVenta'))}" oninput="Prop.calcComision()"></div>
          <div class="field"><label>Moneda</label><select id="f_monedaVenta" onchange="Prop.calcComision()"><option ${sel('monedaVenta','USD')}>USD</option><option ${sel('monedaVenta','ARS')}>ARS</option></select></div>
        </div>
        <div class="form-row one">
          <div class="field"><label>Observación del precio</label><input id="f_obsPrecio" value="${esc(v('obsPrecio'))}" placeholder="Ej: precio a convenir, no incluye gastos, USD billete, etc."></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Propietario</label><input id="f_propietario" value="${esc(v('propietario'))}"></div>
          <div class="field"><label>Condición fiscal</label><select id="f_condFiscal">
            ${["Monotributo","Resp. Inscripto","Exento","Consumidor final"].map(o=>`<option ${sel('condFiscal',o)}>${o}</option>`).join("")}
          </select></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Comisión pactada (%)</label><input id="f_comision" type="number" step="0.1" value="${esc(v('comision'))}" oninput="Prop.calcComision()"></div>
          <div class="field"><label>Comisión estimada (calculada)</label><input id="f_comisionCalc" disabled style="background:var(--brand-soft);font-weight:600;color:var(--brand)"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Estado de la operación</label><select id="f_estadoOp">
            ${["Disponible","Reservada","Con seña","Vendida"].map(o=>`<option ${sel('estadoOp',o)}>${o}</option>`).join("")}
          </select></div>
          <div class="field"><label>Fecha de publicación</label>${dateInput('f_fechaPub', v('fechaPub',today))}</div>
        </div>
        <div class="field" style="margin-bottom:12px"><label>Financiación</label>
          <div class="checkbox-grid" style="grid-template-columns:1fr 1fr">
            <label><input type="checkbox" id="f_aptaCredito" ${ck('aptaCredito')}> Apta crédito hipotecario</label>
            <label><input type="checkbox" id="f_aceptaFinanciacion" ${ck('aceptaFinanciacion')} onchange="Prop.toggleFin()"> Acepta financiación</label>
          </div>
        </div>
        <div class="form-row one" id="sec_fin">
          <div class="field"><label>Detalle de la financiación</label>
            <textarea id="f_tipoFinanciacion" rows="2" placeholder="Ej: 50% al boleto y saldo en 12 cuotas; acepta permuta por auto; etc.">${esc(v('tipoFinanciacion'))}</textarea>
            <div class="hint">Texto libre: describí cómo se financia esta propiedad.</div>
          </div>
        </div>
      </div>

      <!-- DATOS DE ALQUILER -->
      <div class="form-section" id="sec_alquiler">
        <h4>${I.rent} Datos de alquiler</h4>
        <div class="form-row">
          <div class="field"><label>Valor mensual</label><input id="f_valorAlquiler" type="number" value="${esc(v('valorAlquiler'))}"></div>
          <div class="field"><label>Moneda</label><select id="f_monedaAlquiler"><option ${sel('monedaAlquiler','ARS')}>ARS</option><option ${sel('monedaAlquiler','USD')}>USD</option></select></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Propietario</label><input id="f_propietarioAlq" value="${esc(v('propietarioAlq'))}"></div>
          <div class="field"><label>Actualiza cada (meses)</label><input id="f_actualizaCada" type="number" value="${esc(v('actualizaCada',3))}"></div>
        </div>
        <div class="form-row one"><div class="field"><label>Índice de actualización</label><select id="f_indice">
          ${["ICL","IPC","Otro"].map(o=>`<option ${sel('indice',o)}>${o}</option>`).join("")}
        </select></div></div>
      </div>
    `, `<button class="btn" onclick="Modal.close()">Cancelar</button><button class="btn btn-primary" onclick="Prop.save(${id||'null'})">${id?'Guardar cambios':'Crear propiedad'}</button>`);

    // estado inicial de los bloques condicionales
    if (foco==='venta') document.getElementById('f_enVenta').value="1";
    if (foco==='alquiler') document.getElementById('f_enAlquiler').value="1";
    Prop.toggleTipo(); Prop.toggleAgua(); Prop.toggleOp(); Prop.toggleVisor(); Prop.calcComision(); Prop.toggleAmoblado();
  },

  toggleTipo(){
    const t = document.getElementById('f_tipo').value;
    document.getElementById('sec_vivienda').style.display = isVivienda(t) ? "" : "none";
    const sc = document.getElementById('sec_campo');
    if (sc) sc.style.display = (t==="Campo") ? "" : "none";
    // Campos generales que no aplican a Campo ni Terreno
    const esCampo = (t==="Campo"), esTerreno = (t==="Terreno");
    const supCub = document.getElementById('fld_supCub');
    const supTot = document.getElementById('fld_supTot');
    const anioEstado = document.getElementById('row_anioEstado');
    // Sup. cubierta: no va en Campo ni Terreno
    if (supCub) supCub.style.display = (esCampo||esTerreno) ? "none" : "";
    // Sup. total: no va en Campo; en Terreno SÍ va (se mide en m²)
    if (supTot) supTot.style.display = esCampo ? "none" : "";
    // Año y estado: no van en Campo ni Terreno
    if (anioEstado) anioEstado.style.display = (esCampo||esTerreno) ? "none" : "";
    Prop.toggleAguaSec();
    Prop.toggleAmoblado();
  },
  toggleAmoblado(){
    const cb = document.getElementById('f_amoblado');
    const sec = document.getElementById('sec_amoblado');
    const secViv = document.getElementById('sec_vivienda');
    if (!cb || !sec) return;
    // solo se muestra si es vivienda Y está tildado amoblado
    const esViv = secViv && secViv.style.display !== "none";
    sec.style.display = (esViv && cb.checked) ? "" : "none";
  },
  calcComision(){
    const precio = parseFloat(document.getElementById('f_valorVenta')?.value)||0;
    const pct = parseFloat(document.getElementById('f_comision')?.value)||0;
    const mon = document.getElementById('f_monedaVenta')?.value||"USD";
    const out = document.getElementById('f_comisionCalc');
    if (out) out.value = (precio>0 && pct>0) ? fmt(Math.round(precio*pct/100), mon) : "—";
  },
  eliminar(id){
    if (STATE.role!=="admin") { alert("Solo el perfil Acceso total puede eliminar propiedades."); return; }
    const p = prop(id);
    const tieneContrato = DB.contracts.some(c=>c.propId===id);
    let msg = `¿Eliminar la propiedad ${p.codigo} — "${p.titulo}"? Esta acción no se puede deshacer.`;
    if (tieneContrato) msg += "\n\nATENCIÓN: esta propiedad tiene un contrato de alquiler asociado, que también se eliminará.";
    if (!confirm(msg)) return;
    // borrar en la nube (propiedad, sus leads y contratos)
    DB.leads.filter(l=>l.propId===id).forEach(l=>persistDelete('leads', l.id));
    DB.contracts.filter(c=>c.propId===id).forEach(c=>persistDelete('contracts', c.id));
    persistDelete('properties', id);
    DB.properties = DB.properties.filter(x=>x.id!==id);
    DB.leads = DB.leads.filter(l=>l.propId!==id);
    DB.contracts = DB.contracts.filter(c=>c.propId!==id);
    App.go(STATE.page);
  },
  marcarVendida(id){
    const p = prop(id);
    const precioPub = p.valorVenta || 0;
    const comPct = p.comision || 0;
    Modal.open(`Cerrar venta — ${esc(p.titulo)}`, `
      <div class="notice">${I.check}<div>Registrá los datos reales del cierre. La comisión se recalcula sobre el valor de venta final.</div></div>
      <div class="detail-grid" style="margin-bottom:16px">
        <div class="detail-item"><div class="k">Valor publicado</div><div class="v">${precioPub?fmt(precioPub,p.monedaVenta):"—"}</div></div>
        <div class="detail-item"><div class="k">Comisión pactada</div><div class="v">${comPct?comPct+"%":"—"}</div></div>
      </div>
      <div class="form-section">
        <h4>${I.money} Datos del cierre</h4>
        <div class="form-row">
          <div class="field"><label>Valor real de venta</label>
            <input id="cv_valor" type="number" value="${precioPub||""}" oninput="Prop.recalcCierre(${id})">
            <div class="hint">El monto en el que se cerró finalmente la operación.</div></div>
          <div class="field"><label>Moneda</label>
            <select id="cv_moneda">
              <option value="USD" ${p.monedaVenta==="USD"?"selected":""}>USD</option>
              <option value="ARS" ${p.monedaVenta!=="USD"?"selected":""}>ARS</option>
            </select></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Fecha de venta</label>${dateInput('cv_fecha', today)}</div>
          <div class="field"><label>Comprador</label><input id="cv_comprador" placeholder="Nombre del comprador"></div>
        </div>
        <div class="breakdown" style="margin-top:6px">
          <div class="breakdown-row" style="font-weight:600"><span>Comisión de la inmobiliaria (${comPct}%)</span><span id="cv_comision">${precioPub?fmt(Math.round(precioPub*comPct/100),p.monedaVenta):"—"}</span></div>
          <div class="hint" id="cv_dif"></div>
        </div>
      </div>
    `, `<button class="btn" onclick="Modal.close()">Cancelar</button>
        <button class="btn btn-primary" onclick="Prop.confirmarVenta(${id})">${I.check} Confirmar venta</button>`);
    Prop.recalcCierre(id);
  },

  recalcCierre(id){
    const p = prop(id);
    const valor = parseFloat(document.getElementById('cv_valor').value)||0;
    const moneda = document.getElementById('cv_moneda').value;
    const comPct = p.comision || 0;
    const comision = Math.round(valor * comPct/100);
    document.getElementById('cv_comision').textContent = valor?fmt(comision,moneda):"—";
    // diferencia con el valor publicado
    const pub = p.valorVenta || 0;
    const difBox = document.getElementById('cv_dif');
    if (pub && valor && p.monedaVenta===moneda) {
      const dif = valor - pub;
      if (dif===0) difBox.textContent = "Se cerró al valor publicado.";
      else if (dif>0) difBox.textContent = `Se cerró ${fmt(dif,moneda)} por encima del publicado.`;
      else difBox.textContent = `Se cerró ${fmt(-dif,moneda)} por debajo del publicado.`;
    } else difBox.textContent = "";
  },

  confirmarVenta(id){
    const p = prop(id);
    const valor = parseFloat(document.getElementById('cv_valor').value)||0;
    const moneda = document.getElementById('cv_moneda').value;
    const fecha = Fechas.get('cv_fecha') || today;
    const comprador = document.getElementById('cv_comprador').value.trim();
    if (valor<=0) { alert("Ingresá el valor real de venta."); return; }
    p.estadoOp = "Vendida";
    p.fechaVenta = fecha;
    p.valorCierre = valor;
    p.monedaCierre = moneda;
    p.comprador = comprador;
    p.comisionCierre = Math.round(valor * (p.comision||0)/100);
    persist('properties', p);
    Modal.close();
    App.go(STATE.page);
    setTimeout(()=>alert(`Venta registrada.\nValor de cierre: ${fmt(valor,moneda)}\nComisión: ${fmt(p.comisionCierre,moneda)}`),100);
  },
  toggleAguaSec(){
    // El bloque de agua caliente solo aplica a viviendas que estén en alquiler
    const t = document.getElementById('f_tipo').value;
    const enAlq = document.getElementById('f_enAlquiler').value==="1";
    const mostrar = isVivienda(t) && enAlq;
    document.getElementById('sec_agua').style.display = mostrar ? "" : "none";
    if (mostrar) Prop.toggleAgua();
  },
  toggleAgua(){
    const a = document.getElementById('f_aguaCaliente').value;
    document.getElementById('sec_varilla').style.display = (a==="Termotanque") ? "" : "none";
  },
  toggleOp(){
    document.getElementById('sec_venta').style.display = document.getElementById('f_enVenta').value==="1" ? "" : "none";
    document.getElementById('sec_alquiler').style.display = document.getElementById('f_enAlquiler').value==="1" ? "" : "none";
    Prop.toggleAguaSec();
    Prop.toggleFin();
  },
  toggleFin(){
    const cb = document.getElementById('f_aceptaFinanciacion');
    const sec = document.getElementById('sec_fin');
    if (cb && sec) sec.style.display = cb.checked ? "" : "none";
  },
  toggleVisor(){
    const cb = document.getElementById('f_visible');
    const sec = document.getElementById('sec_visor');
    if (cb && sec) sec.style.display = cb.checked ? "" : "none";
  },

  save(id){
    const g = k => { const el=document.getElementById('f_'+k); return el?el.value:""; };
    const gf = k => Fechas.get('f_'+k);   // lee un campo de fecha como aaaa-mm-dd
    const gc = k => { const el=document.getElementById('f_'+k); return el?el.checked:false; };
    const num = k => { const x=parseFloat(g(k)); return isNaN(x)?null:x; };
    const tipo = g('tipo');
    const enVenta = g('enVenta')==="1", enAlquiler = g('enAlquiler')==="1";
    const servicios = Array.from(document.querySelectorAll('.f_serv:checked')).map(e=>e.value);

    const esCampo = (tipo==="Campo"), esTerreno = (tipo==="Terreno");
    const data = {
      titulo:g('titulo'), tipo, localidad:g('localidad'), direccion:g('direccion'),
      supCub: (esCampo||esTerreno) ? null : num('supCub'),
      supTot: esCampo ? null : num('supTot'),
      anio: (esCampo||esTerreno) ? null : num('anio'),
      estado: (esCampo||esTerreno) ? "" : g('estado'),
      servicios, drive:g('drive'), visibleColegas:gc('visible'),
      visorCampos: (function(){
        const keys=["valor","superficie","ambientes","anio","estado","servicios","financiacion"];
        const sel=Array.from(document.querySelectorAll('.f_visorcampo:checked')).map(e=>e.value);
        const obj={}; keys.forEach(k=>obj[k]=sel.includes(k)); return obj;
      })(),
      enVenta, enAlquiler,
    };
    if (isVivienda(tipo)) {
      Object.assign(data, {
        ambientes:num('ambientes'), dorm:num('dorm'), banos:num('banos'), cochera:g('cochera'),
        patio:gc('patio'), living:gc('living'), cocina:gc('cocina'), lavadero:gc('lavadero'),
        balcon:gc('balcon'), piscina:gc('piscina'), amoblado:gc('amoblado'),
        obsAmoblado: gc('amoblado') ? g('obsAmoblado') : "",
      });
      // El agua caliente / termotanque solo aplica a viviendas en alquiler
      if (enAlquiler) {
        data.aguaCaliente = g('aguaCaliente');
        data.ultCambioVarilla = g('aguaCaliente')==="Termotanque" ? (gf('ultCambioVarilla')||null) : null;
        if (!id) data.historialVarilla = data.ultCambioVarilla ? [data.ultCambioVarilla] : [];
      } else {
        data.aguaCaliente = null;
        data.ultCambioVarilla = null;
      }
    }
    if (tipo==="Campo") {
      Object.assign(data, {
        tipoSuelo:g('tipoSuelo'), hectareas:num('hectareas'), actividad:g('actividad'),
        edificacion: g('edificacion')==="1", obsCampo:g('obsCampo'), formaVenta:g('formaVenta'),
      });
    }
    if (enVenta) Object.assign(data, {
      valorVenta:num('valorVenta'), monedaVenta:g('monedaVenta'), obsPrecio:g('obsPrecio'), propietario:g('propietario'),
      condFiscal:g('condFiscal'), comision:num('comision'), estadoOp:g('estadoOp'), fechaPub:gf('fechaPub'),
      aptaCredito:gc('aptaCredito'), aceptaFinanciacion:gc('aceptaFinanciacion'),
      tipoFinanciacion: gc('aceptaFinanciacion') ? g('tipoFinanciacion') : "",
    });
    if (enAlquiler) Object.assign(data, {
      valorAlquiler:num('valorAlquiler'), monedaAlquiler:g('monedaAlquiler'), propietarioAlq:g('propietarioAlq'),
      actualizaCada:num('actualizaCada'), indice:g('indice'),
    });
    if (!data.titulo) { alert("Poné al menos un título para la propiedad."); return; }

    if (id) {
      const ex = prop(id);
      // preservar historial de varilla existente
      if (data.historialVarilla===undefined) data.historialVarilla = ex.historialVarilla||[];
      // historial de precios de venta: registrar si cambió el valor
      let hist = ex.histPrecios || [];
      if (enVenta && data.valorVenta!=null && (ex.valorVenta!==data.valorVenta || ex.monedaVenta!==data.monedaVenta)) {
        hist = hist.concat([{ fecha:today, valor:data.valorVenta, moneda:data.monedaVenta }]);
      }
      data.histPrecios = hist;
      Object.assign(ex, data);
      persist('properties', ex);
    } else {
      data.id = DB.nextId.properties++;
      data.codigo = "PROP-" + String(DB.nextCodigo++).padStart(4,"0");
      if (enVenta && data.valorVenta!=null) data.histPrecios = [{ fecha:data.fechaPub||today, valor:data.valorVenta, moneda:data.monedaVenta }];
      DB.properties.push(data);
      persist('properties', data);
      persistMeta();
    }
    Modal.close();
    App.go(STATE.page);
    if (!id) setTimeout(()=>alert(`Propiedad creada con código ${data.codigo}.\nUsá este código para nombrar la carpeta en Drive y encontrarla rápido.`),100);
  },

  view(id){
    const p = prop(id);
    const isViewer = STATE.role==="viewer";
    const ve = k => !isViewer || App.visorVe(p,k); // admin ve todo; visor según config
    const item = (k,val)=>`<div class="detail-item"><div class="k">${k}</div><div class="v">${val}</div></div>`;
    let g = [];
    if (!isViewer) g.push(item("Código", `<span class="code-tag">${esc(p.codigo||"—")}</span>`));
    g.push(item("Tipo",esc(p.tipo)));
    g.push(item("Localidad",esc(p.localidad)));
    if (!isViewer) g.push(item("Dirección",esc(p.direccion)));   // dirección exacta nunca al visor
    if (ve('superficie')) g.push(item("Superficie",`${p.supCub||"—"} m² cub. / ${p.supTot||"—"} m² tot.`));
    if (ve('anio')) g.push(item("Año",p.anio||"—"));
    if (ve('estado')) g.push(item("Estado",esc(p.estado||"—")));
    if (isVivienda(p.tipo) && ve('ambientes')) {
      g.push(item("Ambientes",p.ambientes??"—"));
      g.push(item("Dormitorios",p.dorm??"—"));
      g.push(item("Baños",p.banos??"—"));
      g.push(item("Cochera",esc(p.cochera||"—")));
    }
    if (isVivienda(p.tipo)) {
      const comod = [p.patio&&"Patio/jardín",p.living&&"Living",p.cocina&&"Cocina",p.lavadero&&"Lavadero",p.balcon&&"Balcón",p.piscina&&"Piscina",p.amoblado&&"Amoblado"].filter(Boolean).join(", ")||"—";
      g.push(item("Comodidades",comod));
      if (p.amoblado && p.obsAmoblado) g.push(item("Equipamiento", esc(p.obsAmoblado)));
      if (p.enAlquiler && !isViewer) g.push(item("Agua caliente",esc(p.aguaCaliente||"—")));
    }
    if (p.tipo==="Campo") {
      g.push(item("Tipo de suelo",esc(p.tipoSuelo||"—")));
      g.push(item("Hectáreas",p.hectareas??"—"));
      g.push(item("Actividad",esc(p.actividad||"—")));
      g.push(item("Edificación",p.edificacion?"Sí":"No"));
    }
    let html = `<div class="detail-grid">${g.join("")}</div>`;
    if (p.tipo==="Campo") {
      if (p.obsCampo) html += `<div class="section"><div class="detail-item"><div class="k">Observaciones del campo</div><div class="v">${esc(p.obsCampo)}</div></div></div>`;
      if (p.formaVenta && !isViewer) html += `<div class="section"><div class="detail-item"><div class="k">Forma de venta</div><div class="v">${esc(p.formaVenta)}</div></div></div>`;
    }
    if ((p.servicios||[]).length && ve('servicios')) html += `<div class="section"><div class="detail-item"><div class="k">Servicios</div><div class="v">${p.servicios.map(s=>esc(s)).join(" · ")}</div></div></div>`;

    // Termotanque (solo propiedades en alquiler)
    if (p.enAlquiler && p.aguaCaliente==="Termotanque" && p.ultCambioVarilla) {
      const prox = addMonths(p.ultCambioVarilla,8);
      html += `<div class="section"><div class="section-head"><h3>Mantenimiento del termotanque</h3></div>
        <div class="card" style="padding:16px">
          <div class="detail-grid">
            ${item("Último cambio de varilla",fdate(p.ultCambioVarilla))}
            ${item("Próximo cambio (8 meses)",fdate(prox))}
          </div>
          ${(p.historialVarilla&&p.historialVarilla.length)?`<div style="margin-top:14px"><div class="k" style="font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:8px">Historial de cambios</div><ul class="timeline">${p.historialVarilla.map(f=>`<li>${fdate(f)}</li>`).join("")}</ul></div>`:""}
          ${can()?`<button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="Mant.registrarVarilla(${p.id})">${I.tools} Registrar cambio realizado hoy</button>`:""}
        </div></div>`;
    }
    if (p.enVenta) {
      const ventaItems = [];
      if (ve('valor')) {
        ventaItems.push(item("Valor", fmt(p.valorVenta,p.monedaVenta) + (p.obsPrecio?`<div class="t-muted" style="font-weight:400">${esc(p.obsPrecio)}</div>`:"")));
      } else if (isViewer) ventaItems.push(item("Valor", '<span class="t-muted">A consultar</span>'));
      if (!isViewer) ventaItems.push(item("Propietario",esc(p.propietario||"—")));
      if (!isViewer) {
        const comMonto = (p.comision && p.valorVenta) ? fmt(Math.round(p.valorVenta*p.comision/100), p.monedaVenta) : null;
        ventaItems.push(item("Comisión",(p.comision||"—")+"%" + (comMonto?`<div class="t-muted" style="font-weight:400">≈ ${comMonto}</div>`:"")));
      }
      ventaItems.push(item("Estado", esVendida(p)?'<span class="badge red"><span class="dot"></span>Vendida</span>':App.opBadge(p.estadoOp)));
      if (ve('financiacion')) {
        ventaItems.push(item("Apta crédito", p.aptaCredito?'<span class="badge green"><span class="dot"></span>Sí</span>':'<span class="badge gray">No</span>'));
        ventaItems.push(item("Acepta financiación", p.aceptaFinanciacion?'<span class="badge green"><span class="dot"></span>Sí</span>':'<span class="badge gray">No</span>'));
      }
      html += `<div class="section"><div class="section-head"><h3>Venta</h3></div><div class="detail-grid">
        ${ventaItems.join("")}</div>
        ${(ve('financiacion') && p.aceptaFinanciacion && p.tipoFinanciacion)?`<div class="detail-item" style="margin-top:14px"><div class="k">Detalle de financiación</div><div class="v">${esc(p.tipoFinanciacion)}</div></div>`:""}
        ${(!isViewer && p.histPrecios && p.histPrecios.length>1)?`<div style="margin-top:14px"><div class="k" style="font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:8px">Historial de precios</div><ul class="timeline">${p.histPrecios.slice().reverse().map(h=>`<li>${fdate(h.fecha)} — ${fmt(h.valor,h.moneda)}</li>`).join("")}</ul></div>`:""}
      </div>`;
      // datos del cierre de venta (si ya se vendió)
      if (!isViewer && esVendida(p) && p.valorCierre!=null) {
        html += `<div class="section"><div class="section-head"><h3>Cierre de la venta</h3></div><div class="detail-grid">
          ${item("Valor de cierre", fmt(p.valorCierre, p.monedaCierre||p.monedaVenta))}
          ${item("Comisión cobrada", fmt(p.comisionCierre||0, p.monedaCierre||p.monedaVenta))}
          ${item("Fecha de venta", fdate(p.fechaVenta))}
          ${p.comprador?item("Comprador", esc(p.comprador)):""}
        </div></div>`;
      }
    }
    if (p.enAlquiler) { const cAlq = DB.contracts.find(c=>c.propId===p.id && contratoActivo(c)) || DB.contracts.find(c=>c.propId===p.id);
      html += `<div class="section"><div class="section-head"><h3>Alquiler</h3></div><div class="detail-grid">
      ${item("Valor mensual",fmt(p.valorAlquiler,p.monedaAlquiler))}
      ${item("Actualización",`cada ${(cAlq&&cAlq.actualizaCada)||p.actualizaCada||"—"} meses · ${esc((cAlq&&cAlq.indice)||p.indice||"—")}`)}</div></div>`;
      // ---- Reparaciones ----
      const reps = p.reparaciones || [];
      const pend = reps.filter(x=>!x.fechaRep).length;
      const gastado = reps.filter(x=>x.fechaRep).reduce((s,x)=>s+(x.costo||0),0);
      html += `<div class="section"><div class="section-head"><h3>Reparaciones</h3>
          ${can()?`<button class="btn btn-sm" onclick="Repar.list(${p.id})">${I.tool} Ver / cargar</button>`:""}</div>
        <div class="detail-grid">
          ${item("Registradas", String(reps.length))}
          ${item("Pendientes", pend?`<span class="badge red"><span class="dot"></span>${pend}</span>`:'<span class="badge green"><span class="dot"></span>Ninguna</span>')}
          ${item("Gasto acumulado", gastado?fmt(gastado,"ARS"):"—")}
        </div></div>`;
    }
    html += `<div class="section">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn btn-primary" href="${esc(p.drive)}" target="_blank">${I.drive} Abrir carpeta de Drive</a>
        ${(USAR_STORAGE && p.enVenta)?`<button class="btn" onclick="Docs.list(${p.id})">${I.file} Documentos (${(p.docs||[]).length})</button>`:""}
      </div>
      <div class="hint" style="margin-top:8px">${USAR_STORAGE
        ? "Las fotos y planos están en Drive. Los documentos se adjuntan al sistema."
        : `Ahí están las fotos, los planos y los documentos${p.codigo?` (carpeta ${esc(p.codigo)})`:""}.`}</div>
    </div>`;
    Modal.open(p.titulo, html);
  },
};

/* ============================================================
   REPARACIONES (propiedades en alquiler)
   Registro de arreglos: qué se rompió, cuándo, quién lo reparó,
   cuánto costó, quién lo paga y el respaldo en Drive.
   Mientras no tenga fecha de reparación, queda PENDIENTE y
   aparece en Alarmas.
   ============================================================ */
const Repar = {
  list(propId){
    const p = prop(propId);
    const reps = (p.reparaciones||[]).slice().sort((a,b)=> (b.fechaRot||"") < (a.fechaRot||"") ? -1 : 1);
    const puedeEditar = can();
    const pendientes = reps.filter(x=>!x.fechaRep);
    const hechas = reps.filter(x=>x.fechaRep);
    const gastoTotal = hechas.reduce((s,x)=>s+(x.costo||0),0);
    const gastoProp = hechas.filter(x=>x.pagaQuien==="Propietario").reduce((s,x)=>s+(x.costo||0),0);
    const gastoInq  = hechas.filter(x=>x.pagaQuien==="Inquilino").reduce((s,x)=>s+(x.costo||0),0);

    const fila = (r,i) => {
      const pendiente = !r.fechaRep;
      const dias = r.fechaRot ? daysBetween(r.fechaRot, today) : null;
      return `<div class="card" style="padding:14px 16px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="t-strong">${esc(r.detalle||"Reparación")}</span>
              ${pendiente
                ? `<span class="badge red"><span class="dot"></span>Pendiente${dias!=null&&dias>0?` · ${dias} ${dias===1?'día':'días'}`:""}</span>`
                : '<span class="badge green"><span class="dot"></span>Reparada</span>'}
            </div>
            <div class="t-muted" style="margin-top:4px">
              Rotura: ${fdate(r.fechaRot)}${r.fechaRep?` · Reparada: ${fdate(r.fechaRep)}`:""}
            </div>
            <div class="t-muted">
              ${r.contratado?`${esc(r.contratado)} · `:""}${r.costo?fmt(r.costo,"ARS"):"Sin costo cargado"}${r.pagaQuien?` · Paga: ${esc(r.pagaQuien)}`:""}
            </div>
            ${r.drive?`<div style="margin-top:6px"><a class="drive-link" href="${esc(r.drive)}" target="_blank">${I.drive} Fotos y documentos</a></div>`:""}
          </div>
          ${puedeEditar?`<div class="row-actions">
            <button class="icon-btn" title="Editar" onclick="Repar.form(${propId},${i})">${I.edit}</button>
            <button class="icon-btn" title="Eliminar" onclick="Repar.eliminar(${propId},${i})">${I.trash}</button>
          </div>`:""}
        </div>
      </div>`;
    };

    const body = `
      ${reps.length?`
        <div class="stats" style="margin-bottom:16px">
          <div class="stat"><div class="lbl">Pendientes</div><div class="val" style="color:${pendientes.length?'var(--red)':'var(--green)'}">${pendientes.length}</div><div class="sub">${pendientes.length?'sin resolver':'todo al día'}</div></div>
          <div class="stat"><div class="lbl">Gasto total</div><div class="val">${gastoTotal?fmt(gastoTotal,"ARS"):"—"}</div><div class="sub">${hechas.length} ${hechas.length===1?'reparación':'reparaciones'}</div></div>
          <div class="stat"><div class="lbl">Paga propietario</div><div class="val">${gastoProp?fmt(gastoProp,"ARS"):"—"}</div><div class="sub">Inquilino: ${gastoInq?fmt(gastoInq,"ARS"):"—"}</div></div>
        </div>`:""}

      ${pendientes.length?`<div class="k" style="font-size:11.5px;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:8px">Pendientes</div>
        ${reps.map((r,i)=>!r.fechaRep?fila(r,i):"").join("")}`:""}

      ${hechas.length?`<div class="k" style="font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:16px 0 8px">Reparadas</div>
        ${reps.map((r,i)=>r.fechaRep?fila(r,i):"").join("")}`:""}

      ${!reps.length?`<div class="empty" style="padding:30px"><div class="ic">${I.tool}</div><h4>Sin reparaciones</h4><p>Todavía no se registraron reparaciones en esta propiedad.</p></div>`:""}
    `;
    Modal.open(`Reparaciones — ${esc(p.titulo)}`, body,
      `<button class="btn" onclick="Prop.view(${propId})">Volver</button>${puedeEditar?`<button class="btn btn-primary" onclick="Repar.form(${propId})">${I.plus} Nueva reparación</button>`:""}`);
  },

  form(propId, idx){
    const p = prop(propId);
    const editando = idx != null;
    const r = editando ? p.reparaciones[idx] : { fechaRot:today, fechaRep:"", detalle:"", contratado:"", costo:"", pagaQuien:"Propietario", drive:"" };
    Modal.open(editando?"Editar reparación":"Nueva reparación", `
      <div class="notice">${I.info}<div>Si todavía no se reparó, dejá vacía la fecha de reparación: va a quedar como <b>pendiente</b> y aparecer en Alarmas hasta que se resuelva.</div></div>
      <div class="form-row one">
        <div class="field"><label>¿Qué se rompió?</label>
          <input id="rp_detalle" value="${esc(r.detalle||"")}" placeholder="Ej: pérdida de agua en el baño">
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label>Fecha de rotura</label>${dateInput('rp_fechaRot', r.fechaRot||today)}
          <div class="hint">Cuándo se rompió o se avisó.</div></div>
        <div class="field"><label>Fecha de reparación</label>${dateInput('rp_fechaRep', r.fechaRep||"")}
          <div class="hint">Dejala vacía si sigue pendiente.</div></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Contratado para reparar</label>
          <input id="rp_contratado" value="${esc(r.contratado||"")}" placeholder="Ej: Juan Pérez (plomero)"></div>
        <div class="field"><label>Costo (pesos)</label>
          <input id="rp_costo" type="number" value="${r.costo||""}" placeholder="0"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>¿Quién lo paga?</label>
          <select id="rp_pagaQuien">
            ${["Propietario","Inquilino","A definir"].map(o=>`<option ${r.pagaQuien===o?'selected':''}>${o}</option>`).join("")}
          </select></div>
        <div class="field"><label>Carpeta de Drive (respaldo)</label>
          <input id="rp_drive" value="${esc(r.drive||"")}" placeholder="https://drive.google.com/...">
          <div class="hint">Fotos y documentos de la rotura y el arreglo.</div></div>
      </div>
    `, `<button class="btn" onclick="Repar.list(${propId})">Cancelar</button>
        <button class="btn btn-primary" onclick="Repar.guardar(${propId},${editando?idx:'null'})">${editando?'Guardar cambios':'Registrar'}</button>`);
  },

  guardar(propId, idx){
    const p = prop(propId);
    const g = k => document.getElementById('rp_'+k)?.value || "";
    const detalle = g('detalle').trim();
    const fechaRot = Fechas.get('rp_fechaRot');
    const fechaRep = Fechas.get('rp_fechaRep');
    if (!detalle) { alert("Escribí qué se rompió."); return; }
    if (!fechaRot) { alert("Poné la fecha de rotura."); return; }
    if (fechaRep && fechaRep < fechaRot) { alert("La fecha de reparación no puede ser anterior a la de rotura."); return; }

    const dato = {
      detalle,
      fechaRot,
      fechaRep: fechaRep || "",
      contratado: g('contratado').trim(),
      costo: parseFloat(g('costo'))||0,
      pagaQuien: g('pagaQuien'),
      drive: g('drive').trim(),
    };
    p.reparaciones = p.reparaciones || [];
    if (idx != null) p.reparaciones[idx] = dato;
    else p.reparaciones.push(dato);
    persist('properties', p);
    Repar.list(propId);
  },

  eliminar(propId, idx){
    const p = prop(propId);
    const r = p.reparaciones[idx];
    if (!confirm(`¿Eliminar la reparación "${r.detalle}"? Esta acción no se puede deshacer.`)) return;
    p.reparaciones.splice(idx,1);
    persist('properties', p);
    Repar.list(propId);
  },
};

            <div style="font-size:12.5px">
              <b style="color:${col}">Acción pendiente · ${txt}</b>
              <div class="t-muted">${fdate(l.proxima)}${l.proxNota?` — ${esc(l.proxNota)}`:""}</div>

          </div>`;
        })() : `<div style="margin-top:6px;font-size:12px;color:var(--ink-soft)">Sin acciones pendientes</div>`}
      </div>`).join(""):`<div class="empty" style="padding:30px"><h4>Sin interesados</h4><p>Todavía no hay interesados registrados.</p></div>`;

  },

      <div class="form-row"><div class="field"><label>Fecha de contacto</label>${dateInput('l_fecha', v('fecha',today))}</div>
        <div class="field"><label>Próxima acción (fecha)</label>${dateInput('l_proxima', v('proxima'))}
          <div class="hint">Aparece en Alarmas hasta que la marques como hecha.</div></div></div>
      <div class="form-row one"><div class="field"><label>¿Qué hay que hacer?</label><input id="l_proxNota" value="${esc(v('proxNota'))}" placeholder="Ej: llamarlo para coordinar la visita"></div></div>
      <div class="form-row one"><div class="field"><label>Nota / observaciones</label><textarea id="l_nota" rows="3">${esc(v('nota'))}</textarea></div></div>
      ${(leadId && l.historial && l.historial.length)?`
        <div class="form-section">
          <h4>${I.cal} Historial de contactos</h4>
          <ul class="timeline">
            ${l.historial.map(h=>`<li><b>${fdate(h.fecha)}</b> — ${esc(h.resultado||h.accion||"Contacto")}${h.estadoHasta&&h.estadoDesde!==h.estadoHasta?` <span class="t-muted">(${esc(h.estadoDesde)} → ${esc(h.estadoHasta)})</span>`:""}</li>`).join("")}

    const gf = k=>Fechas.get('l_'+k);   // fechas como aaaa-mm-dd
    if (!g('nombre')) { alert("Poné el nombre del interesado."); return; }
    if (leadId) {
      const l = DB.leads.find(x=>x.id===leadId);
      const proxCambio = l.proxima !== (gf('proxima')||null);
      Object.assign(l, { nombre:g('nombre'), contacto:g('contacto'), origen:g('origen'),

      // si se agenda una acción nueva (o se cambia la fecha), vuelve a quedar pendiente
      if (proxCambio && gf('proxima')) l.accionHecha = false;
      if (!gf('proxima')) l.accionHecha = true;
      persist('leads', l);
    } else {
      const nuevo = { id:DB.nextId.leads++, propId, nombre:g('nombre'), contacto:g('contacto'),
        origen:g('origen'), estado:g('estado'), fecha:gf('fecha'), proxima:gf('proxima')||null,
        proxNota:g('proxNota'), nota:g('nota'), accionHecha:false, historial:[], creado:today };
      DB.leads.push(nuevo);
      persist('leads', nuevo);
      persistMeta();
    }
    Lead.list(propId);
  },
  color(s){ return {"Nuevo":"blue","Contactado":"amber","Visita agendada":"amber","Negociando":"green","Descartado":"gray"}[s]||"gray"; }
};

/* ============================================================
   CONTRATOS Y COBROS
   ============================================================ */
const Contract = {
  // Calcula la fecha de fin a partir del inicio + duración en meses.
  // El fin queda editable: si la persona lo cambia a mano, se respeta.
  calcFin(){
    const ini = Fechas.get('c_inicio');
    const dur = parseInt(document.getElementById('c_duracion')?.value)||0;
    const finInput = document.getElementById('c_fin');
    if (!ini || dur<=0 || !finInput) return;
    // el fin es el día anterior a cumplir los N meses (ej: 01/01/2026 + 24m => 31/12/2027)
    const finCalc = addMonths(ini, dur);
    const d = new Date(finCalc+"T12:00:00");
    d.setDate(d.getDate()-1);
    const iso = isoDate(d);
    finInput.value = isoADmy(iso);                          // el campo de texto muestra dd/mm/aaaa
    const cal = document.getElementById('c_fin__cal'); if (cal) cal.value = iso;  // y el almanaque queda sincronizado
  },

  async eliminar(id){
    if (STATE.role!=="admin") { alert("Solo el perfil Acceso total puede eliminar contratos."); return; }
    const c = DB.contracts.find(c=>c.id===id);
    if (!c) return;
    const p = prop(c.propId);
    const nCuotas = (c.cuotas||[]).length;
    const nDocs = (c.docs||[]).length;
    let msg = `¿Eliminar el contrato de ${c.inquilino}${p?` (${p.titulo})`:""}?\n\nEsta acción no se puede deshacer.`;
    if (nCuotas) msg += `\n\nSe van a borrar también ${nCuotas} ${nCuotas===1?'cuota registrada':'cuotas registradas'} con sus cobros.`;
    if (nDocs) msg += `\nY ${nDocs} ${nDocs===1?'documento adjunto':'documentos adjuntos'}.`;
    if (!confirm(msg)) return;
    // borrar los documentos de la nube (solo si Storage está activo)
    if (USAR_STORAGE && fbStorage) {
      for (const d of (c.docs||[])) {
        if (d.ruta) { try { await fbStorage.ref(d.ruta).delete(); } catch(e){ /* si ya no está, seguimos */ } }
      }
    }
    await persistDelete('contracts', id);
    DB.contracts = DB.contracts.filter(x=>x.id!==id);
    App.go('contracts');
  },
  form(id, propId){
    const alqProps = DB.properties.filter(p=>p.enAlquiler);
    if (!alqProps.length) { alert("Primero marcá alguna propiedad como 'en alquiler'."); return; }
    const c = id ? DB.contracts.find(c=>c.id===id) : {};
    const v = (k,d="") => c[k]!=null ? c[k] : d;
    const selPropId = id ? c.propId : propId;
    const optSel = (cur,val) => cur===val ? "selected" : "";
    Modal.open(id?"Editar contrato":"Nuevo contrato", `
      <div class="form-row one"><div class="field"><label>Propiedad</label><select id="c_prop" ${id?'disabled':''}>
        ${alqProps.map(p=>`<option value="${p.id}" ${selPropId===p.id?'selected':''}>${esc(p.titulo)}</option>`).join("")}</select>
        ${id?'<div class="hint">La propiedad no se cambia en un contrato existente.</div>':''}</div></div>
      <div class="form-row"><div class="field"><label>Inquilino</label><input id="c_inquilino" value="${esc(v('inquilino'))}"></div>
        <div class="field"><label>Garante 1</label><input id="c_garante" value="${esc(v('garante'))}"></div></div>
      <div class="form-row one"><div class="field"><label>Garante 2 (opcional)</label><input id="c_garante2" value="${esc(v('garante2'))}"></div></div>
      <div class="form-row">
        <div class="field"><label>Inicio</label>${dateInput('c_inicio', v('inicio'), {onchange:'Contract.calcFin()'})}</div>
        <div class="field"><label>Duración (meses)</label><input id="c_duracion" type="number" min="1" value="${esc(v('duracion',24))}" onchange="Contract.calcFin()" oninput="Contract.calcFin()">
          <div class="hint">Al cargarla, la fecha de fin se calcula sola.</div></div>
      </div>
      <div class="form-row one">
        <div class="field"><label>Fin</label>${dateInput('c_fin', v('fin'))}
          <div class="hint">Se calcula automáticamente, pero podés modificarla a mano si hace falta.</div></div>
      </div>
      <div class="form-row"><div class="field"><label>Valor mensual</label><input id="c_valor" type="number" value="${esc(v('valor'))}"></div>
        <div class="field"><label>Moneda</label><select id="c_moneda"><option ${optSel(v('moneda','ARS'),'ARS')}>ARS</option><option ${optSel(v('moneda'),'USD')}>USD</option></select></div></div>
      <div class="form-row"><div class="field"><label>Actualiza cada (meses)</label><input id="c_cada" type="number" value="${esc(v('actualizaCada',3))}"></div>
        <div class="field"><label>Índice</label><select id="c_indice">${["ICL","IPC","Otro"].map(o=>`<option ${optSel(v('indice'),o)}>${o}</option>`).join("")}</select></div></div>
      <div class="form-row"><div class="field"><label>Comisión (monto total)</label><input id="c_deposito" type="number" value="${esc(v('deposito'))}">
          <div class="hint">Equivale a un mes de alquiler. El cobro (en una o varias cuotas) se registra dentro del contrato.</div></div>
        <div class="field"><label>Tipo de garantía</label><select id="c_garantia">${["Recibo de sueldo","Garantía propietaria","Seguro de caución"].map(o=>`<option ${optSel(v('garantia'),o)}>${o}</option>`).join("")}</select></div></div>
      ${id?`<div class="form-row"><div class="field"><label>Próxima actualización</label>${dateInput('c_prox', v('proxActualiz'))}</div>
        <div class="field"><label>Estado del contrato</label><select id="c_estado">${["Automático","Finalizado","Rescindido"].map(o=>`<option ${optSel(v('estado'),o)}>${o}</option>`).join("")}</select>
          <div class="hint">Dejalo en "Automático": el sistema pone "A comenzar", "Vigente" o "Finalizado" según las fechas. Usá los otros solo para cerrar un contrato antes de tiempo.</div></div></div>`:''}
      ${USAR_STORAGE
        ? (id?`<div class="form-section" style="margin-top:4px">
            <h4>${I.file} Documentos</h4>
            <div class="hint" style="margin-bottom:10px">El contrato firmado y los demás documentos se adjuntan desde la ficha del contrato, y quedan guardados en la nube.</div>
            <button class="btn btn-sm" onclick="Docs.listContrato(${id})">${I.file} Ver / adjuntar documentos</button>
          </div>`:`<div class="notice">${I.info}<div>Una vez creado el contrato, vas a poder adjuntarle el contrato firmado y otros documentos.</div></div>`)
        : `<div class="notice">${I.drive}<div>El contrato firmado y los demás documentos se guardan en la <b>carpeta de Drive de la propiedad</b>, junto con las fotos.</div></div>`}
    `, `<button class="btn" onclick="${id?`Contract.view(${id})`:'Modal.close()'}">Cancelar</button><button class="btn btn-primary" onclick="Contract.save(${id||'null'})">${id?'Guardar cambios':'Crear contrato'}</button>`);
  },
  save(id){
    const g = k=>{ const el=document.getElementById('c_'+k); return el?el.value:""; };
    const gf = k=>Fechas.get('c_'+k);   // fechas como aaaa-mm-dd
    if (!g('inquilino')) { alert("Poné el nombre del inquilino."); return; }
    if (id) {
      const c = DB.contracts.find(c=>c.id===id);
      Object.assign(c, {
        inquilino:g('inquilino'), garante:g('garante'), garante2:g('garante2'), inicio:gf('inicio'), fin:gf('fin'),
        duracion:parseInt(g('duracion'))||null,
        valor:parseFloat(g('valor'))||0, moneda:g('moneda'), actualizaCada:parseInt(g('cada'))||3,
        indice:g('indice'), deposito:parseFloat(g('deposito'))||0, garantia:g('garantia'),
        proxActualiz:gf('prox')||c.proxActualiz,
        estado: (g('estado')==="Automático" ? null : g('estado')) || null,
      });
      persist('contracts', c);
      // mantener la propiedad alineada con el contrato (frecuencia, índice, valor)
      const pC = prop(c.propId);
      if (pC) { pC.actualizaCada = c.actualizaCada; pC.indice = c.indice; pC.valorAlquiler = c.valor; persist('properties', pC); }
      Contract.view(id);
    } else {
      const propId = parseInt(g('prop'));
      const nuevo = {
        id:DB.nextId.contracts++, propId, inquilino:g('inquilino'), garante:g('garante'), garante2:g('garante2'),
        inicio:gf('inicio'), fin:gf('fin'), duracion:parseInt(g('duracion'))||null,
        valor:parseFloat(g('valor'))||0, moneda:g('moneda'),
        actualizaCada:parseInt(g('cada'))||3, indice:g('indice'), deposito:parseFloat(g('deposito'))||0,
        garantia:g('garantia'), proxActualiz: gf('inicio')?addMonths(gf('inicio'),parseInt(g('cada'))||3):null,
        estado:null, cuotas:[], docs:[],
        depositoPagos:[], histValores: gf('inicio')?[{desde:gf('inicio'), valor:parseFloat(g('valor'))||0}]:[]
      };
      DB.contracts.push(nuevo);
      persist('contracts', nuevo);
      // alinear la propiedad con el contrato recién creado
      const pN = prop(propId);
      if (pN) { pN.actualizaCada = nuevo.actualizaCada; pN.indice = nuevo.indice; pN.valorAlquiler = nuevo.valor; persist('properties', pN); }
      persistMeta();
      Modal.close(); App.go('contracts');
    }
  },

  view(id){
    const c = DB.contracts.find(c=>c.id===id);
    const p = prop(c.propId);
    const item = (k,v)=>`<div class="detail-item"><div class="k">${k}</div><div class="v">${v}</div></div>`;
    const depPagado = (c.depositoPagos||[]).reduce((s,x)=>s+x.monto,0);
    const depFalta = (c.deposito||0) - depPagado;
    const body = `
      ${can()?`<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px">
        <button class="btn btn-sm" onclick="Contract.form(${c.id})">${I.edit} Editar contrato</button>
        ${(STATE.role==="admin")?`<button class="btn btn-sm" onclick="Contract.eliminar(${c.id})">${I.trash} Eliminar</button>`:""}
      </div>`:""}
      <div class="detail-grid">
        ${item("Propiedad",esc(p?.titulo||"—"))}${item("Inquilino",esc(c.inquilino))}
        ${item("Garante 1",esc(c.garante||"—"))}${item("Garante 2",esc(c.garante2||"—"))}
        ${item("Vigencia",`${fdate(c.inicio)} al ${fdate(c.fin)}`)}
        ${item("Valor actual",`${fmt(c.valor,c.moneda)} ${can()?`<button class="btn btn-sm" style="margin-left:8px;padding:3px 9px" onclick="Actualiz.form(${c.id})">${I.money} Actualizar</button>`:""}`)}
        ${item("Actualización",`cada ${c.actualizaCada}m · ${esc(c.indice)} · próx. ${fdate(c.proxActualiz)}`)}
        ${item("Garantía",esc(c.garantia||"—"))}
        ${item("Estado",App.contractBadge(estadoContrato(c)))}
        ${USAR_STORAGE
          ? item("Documentos", (()=>{ const n=(c.docs||[]).length; return `<button class="btn btn-sm" onclick="Docs.listContrato(${c.id})">${I.file} ${n} ${n===1?'documento':'documentos'}</button>`; })())
          : item("Documentos", (()=>{ const p=prop(c.propId); return p&&p.drive ? `<a class="drive-link" href="${esc(p.drive)}" target="_blank">${I.drive} Ver en Drive</a>` : '<span class="t-muted">En la carpeta de Drive</span>'; })())}
      </div>
      ${(c.histValores&&c.histValores.length)?`
        <div class="section">
          <div class="section-head">
            <h3>Historial de valores del alquiler</h3>
            ${can()?`<div style="display:flex;gap:6px">
              <button class="btn btn-sm" onclick="Actualiz.recalcularDesdeHistorial(${c.id})" title="Recalcular la próxima actualización a partir del último valor">${I.money} Recalcular próxima</button>
              <button class="btn btn-sm" onclick="HistVal.form(${c.id})">${I.plus} Agregar registro</button>
            </div>`:""}
          </div>
          <div class="card">
            ${c.histValores.map((h,i)=>`
              <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap">
                <div>
                  <div class="t-strong">${fmt(h.valor,c.moneda)}</div>
                  <div class="t-muted">Rige desde el ${fdate(h.desde)}</div>
                </div>
                ${can()?`<div class="row-actions">
                  <button class="icon-btn" title="Editar" onclick="HistVal.form(${c.id},${i})">${I.edit}</button>
                  <button class="icon-btn" title="Eliminar" onclick="HistVal.eliminar(${c.id},${i})">${I.trash}</button>
                </div>`:""}
              </div>`).join("")}
          </div>
          <div class="hint" style="margin-top:8px">El valor vigente del contrato es el del registro más reciente. Si corregís una fecha o un monto, revisá que el valor actual del contrato sea el correcto.</div>
        </div>`
      : (can()?`<div class="section">
          <div class="section-head"><h3>Historial de valores del alquiler</h3>
            <button class="btn btn-sm" onclick="HistVal.form(${c.id})">${I.plus} Agregar registro</button></div>
          <div class="hint">Todavía no hay actualizaciones registradas.</div>
        </div>`:"")}

      <div class="section"><div class="section-head"><h3>Comisión</h3>
        ${can()?`<button class="btn btn-sm" onclick="Deposito.form(${c.id})">${I.plus} Registrar pago</button>`:""}</div>
        <div class="card" style="padding:16px">
          <div class="detail-grid">
            ${item("Monto total", fmt(c.deposito,c.moneda))}
            ${item("Pagado", `${fmt(depPagado,c.moneda)} ${depFalta<=0?'<span class="badge green"><span class="dot"></span>Completo</span>':`<span class="badge amber"><span class="dot"></span>Falta ${fmt(depFalta,c.moneda)}</span>`}`)}
          </div>
          ${(c.depositoPagos&&c.depositoPagos.length)?`<div style="margin-top:14px"><div class="k" style="font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:8px">Pagos registrados</div><ul class="timeline">${c.depositoPagos.map(x=>`<li>${fdate(x.fecha)} — ${fmt(x.monto,c.moneda)}</li>`).join("")}</ul></div>`:'<div class="hint" style="margin-top:10px">Sin pagos de la comisión registrados.</div>'}
        </div>
      </div>

      <div class="section"><div class="section-head"><h3>Cobros y cuotas</h3>
        ${can()?`<div class="row-actions"><button class="btn btn-sm" onclick="Cobro.addCuota(${c.id})">${I.plus} Mes actual</button><button class="btn btn-sm" onclick="Cobro.addCuota(${c.id},true)">${I.cal} Mes futuro</button></div>`:""}</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Mes</th><th>Alquiler</th><th>Estado</th><th>Pago</th><th>Ajuste</th><th>Mora</th><th>Total</th><th></th></tr></thead>
          <tbody>
            ${(c.cuotas||[]).map((q,i)=>{
              let estadoCuota, moraCalc=q.moraTotal||0, ajuste=q.ajuste||0, total=q.monto+ajuste+(q.moraTotal||0);
              if (q.pagado) {
                const anticipado = daysBetween(today, q.mes+"-01") > 0;
                estadoCuota = (q.moraTotal>0)?'<span class="badge amber"><span class="dot"></span>Pagada c/mora</span>':(anticipado?'<span class="badge blue"><span class="dot"></span>Anticipado</span>':'<span class="badge green"><span class="dot"></span>Pagada</span>');
              } else {
                const dd = daysBetween(q.mes+"-10", today);
                estadoCuota = dd>0?`<span class="badge red"><span class="dot"></span>Vencida (${dd}d)</span>`:'<span class="badge gray">Pendiente</span>';
                total = q.monto;
              }
              return `<tr><td class="t-strong">${q.mes}</td><td>${fmt(q.monto,c.moneda)}</td><td>${estadoCuota}</td>
                <td>${q.pagado?fdate(q.fechaPago):"—"}</td>
                <td>${(q.pagado&&ajuste)?`<span title="${esc(q.ajusteNota||'')}" style="cursor:help;border-bottom:1px dotted var(--ink-soft)">${ajuste>0?'+':''}${fmt(ajuste,c.moneda)}</span>`:"—"}</td>
                <td>${moraCalc>0?fmt(moraCalc,c.moneda):"—"}</td>
                <td class="t-strong">${fmt(total,c.moneda)}</td>
                <td><div class="row-actions">
                  ${(!q.pagado&&can())?`<button class="btn btn-sm btn-primary" onclick="Cobro.form(${c.id},${i})">Cobrar</button>`:""}
                  ${can()?`<button class="icon-btn" title="Editar mes" onclick="Cobro.editCuota(${c.id},${i})">${I.edit}</button>`:""}
                  ${can()?`<button class="icon-btn" title="Eliminar mes" onclick="Cobro.delCuota(${c.id},${i})">${I.trash}</button>`:""}
                </div></td></tr>`;
            }).join("")||`<tr><td colspan="8" class="t-muted" style="text-align:center;padding:20px">Sin cuotas. Agregá el primer mes.</td></tr>`}
          </tbody>
        </table></div>
        <div class="hint" style="margin-top:8px">La mora se habilita cuando la fecha de pago supera el día 10. El ajuste (positivo o negativo, con aclaración) no modifica el alquiler base. Pasá el cursor sobre un ajuste para ver el motivo.</div>
      </div>`;
    Modal.open(`Contrato — ${esc(c.inquilino)}`, body,
      `${can()?`<button class="btn" onclick="Contract.form(${c.id})">${I.edit} Editar contrato</button>`:""}<button class="btn" onclick="Modal.close()">Cerrar</button>`, true);
  }
};

/* ---------- Cobro de cuota ---------- */
const Cobro = {
  addCuota(contractId, futuro){
    const c = DB.contracts.find(c=>c.id===contractId);
    const last = (c.cuotas||[]).slice(-1)[0];
    let mes;
    if (futuro) {
      // siguiente mes posterior a la última cuota (o al mes actual)
      const base = last ? last.mes+"-01" : today.slice(0,7)+"-01";
      mes = addMonths(base,1).slice(0,7);
    } else if (last) {
      mes = addMonths(last.mes+"-01",1).slice(0,7);
    } else {
      mes = today.slice(0,7);
    }
    c.cuotas.push({ mes, monto:c.valor, pagado:false, fechaPago:null, moraPct:0, moraFija:0, moraTotal:0, ajuste:0, ajusteNota:"" });
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  },
  form(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    const esFuturo = daysBetween(today, q.mes+"-01") > 0;
    const yaPagado = q.pagado;
    Modal.open(`${yaPagado?'Editar cobro':'Registrar cobro'} — ${q.mes}`, `
      ${yaPagado?`<div class="notice">${I.info}<div>Este mes ya figura <b>cobrado</b>. Podés corregir el monto, la fecha, el ajuste o la mora; o reabrirlo con el botón "Marcar como impago".</div></div>`:""}
      ${(esFuturo&&!yaPagado)?`<div class="notice">${I.info}<div>Estás registrando un <b>cobro anticipado</b>: este mes todavía no comenzó. No se aplicará mora salvo que la fecha lo amerite.</div></div>`:""}
      <div class="form-row">
        <div class="field"><label>Mes</label><input value="${q.mes}" disabled></div>
        <div class="field"><label>Valor del alquiler de este mes</label><input id="co_monto" type="number" value="${q.monto}" oninput="Cobro.recalc(${contractId},${idx})">
          <div class="hint">Podés ajustar el alquiler de este mes puntual si hace falta.</div></div>
      </div>
      <div class="form-row one">
        <div class="field"><label>Fecha real de pago</label>${dateInput('co_fecha', yaPagado&&q.fechaPago?q.fechaPago:today, {onchange:`Cobro.recalc(${contractId},${idx})`})}
          <div class="hint" id="co_aviso"></div></div>
      </div>
      <div class="form-section">
        <h4>${I.money} Ajuste del mes (opcional)</h4>
        <div class="form-row">
          <div class="field"><label>Monto del ajuste (${c.moneda})</label><input id="co_ajuste" type="number" value="${q.ajuste||0}" oninput="Cobro.recalc(${contractId},${idx})">
            <div class="hint">Negativo para descontar (ej. –15000), positivo para sumar.</div></div>
          <div class="field"><label>Aclaración del ajuste</label><input id="co_ajusteNota" value="${esc(q.ajusteNota||'')}" placeholder="Ej: compensación arreglo luz garage"></div>
        </div>
      </div>
      <div class="form-section" id="co_moraSec">
        <h4>${I.warn} Interés por mora</h4>
        <div class="form-row">
          <div class="field"><label>Porcentaje sobre alquiler (%)</label><input id="co_pct" type="number" step="0.1" value="${q.moraPct||0}" oninput="Cobro.recalc(${contractId},${idx})"></div>
          <div class="field"><label>Monto fijo (${c.moneda})</label><input id="co_fija" type="number" value="${q.moraFija||0}" oninput="Cobro.recalc(${contractId},${idx})"></div>
        </div>
        <div class="hint">Se pueden usar ambos a la vez: el % se calcula sobre el alquiler y se suma al monto fijo.</div>
      </div>
      <div class="breakdown" id="co_break"></div>
    `, `<button class="btn" onclick="Contract.view(${contractId})">Volver</button>
        ${yaPagado?`<button class="btn" onclick="Cobro.reabrir(${contractId},${idx})">Marcar como impago</button>`:""}
        <button class="btn btn-primary" onclick="Cobro.save(${contractId},${idx})">${yaPagado?'Guardar cambios':'Confirmar cobro'}</button>`);
    Cobro.recalc(contractId, idx);
  },
  recalc(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    const monto = parseFloat(document.getElementById('co_monto').value)||0;
    const fecha = Fechas.get('co_fecha');
    const dd = daysBetween(q.mes+"-10", fecha);
    const conMora = dd>0;
    document.getElementById('co_moraSec').style.display = conMora ? "" : "none";
    const aviso = document.getElementById('co_aviso');
    if (conMora) aviso.innerHTML = `<span style="color:var(--red)">Pago ${dd} días después del día 10 → corresponde mora.</span>`;
    else aviso.innerHTML = `<span style="color:var(--green)">Pago en término o anticipado (hasta el día 10). Sin mora.</span>`;
    const ajuste = parseFloat(document.getElementById('co_ajuste').value)||0;
    const pct = conMora ? (parseFloat(document.getElementById('co_pct').value)||0) : 0;
    const fija = conMora ? (parseFloat(document.getElementById('co_fija').value)||0) : 0;
    const moraPct = Math.round(monto * pct/100);
    const moraTotal = moraPct + fija;
    const total = monto + ajuste + moraTotal;
    document.getElementById('co_break').innerHTML = `
      <div class="line"><span>Alquiler ${q.mes}</span><span>${fmt(monto,c.moneda)}</span></div>
      ${ajuste?`<div class="line"><span>Ajuste${document.getElementById('co_ajusteNota').value?' ('+esc(document.getElementById('co_ajusteNota').value)+')':''}</span><span>${ajuste>0?'+':''}${fmt(ajuste,c.moneda)}</span></div>`:""}
      ${conMora?`<div class="line"><span>Mora ${pct}% s/alquiler</span><span>${fmt(moraPct,c.moneda)}</span></div>
      <div class="line"><span>Mora monto fijo</span><span>${fmt(fija,c.moneda)}</span></div>`:""}
      <div class="line total"><span>Total a cobrar</span><span>${fmt(total,c.moneda)}</span></div>`;
  },
  save(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    const monto = parseFloat(document.getElementById('co_monto').value)||0;
    const fecha = Fechas.get('co_fecha');
    const dd = daysBetween(q.mes+"-10", fecha);
    const conMora = dd>0;
    const ajuste = parseFloat(document.getElementById('co_ajuste').value)||0;
    const ajusteNota = document.getElementById('co_ajusteNota').value.trim();
    if (ajuste && !ajusteNota) { alert("Poné una aclaración para el ajuste del monto."); return; }
    const pct = conMora ? (parseFloat(document.getElementById('co_pct').value)||0) : 0;
    const fija = conMora ? (parseFloat(document.getElementById('co_fija').value)||0) : 0;
    q.monto = monto;
    q.pagado = true; q.fechaPago = fecha; q.moraPct = pct; q.moraFija = fija;
    q.moraTotal = Math.round(monto*pct/100) + fija;
    q.ajuste = ajuste; q.ajusteNota = ajusteNota;
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  },
  reabrir(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    q.pagado = false; q.fechaPago = null; q.moraPct = 0; q.moraFija = 0; q.moraTotal = 0;
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  },
  editCuota(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    Modal.open(`Editar mes — ${q.mes}`, `
      <div class="form-row">
        <div class="field"><label>Mes (AAAA-MM)</label><input id="ec_mes" value="${q.mes}" placeholder="2026-07"></div>
        <div class="field"><label>Valor del alquiler</label><input id="ec_monto" type="number" value="${q.monto}"></div>
      </div>
      <div class="hint">Cambiá el mes al que corresponde o el monto del alquiler de esa cuota. ${q.pagado?'Esta cuota figura cobrada; el estado de pago no se modifica acá (usá "Cobrar/Editar cobro" para eso).':''}</div>
    `, `<button class="btn" onclick="Contract.view(${contractId})">Volver</button><button class="btn btn-primary" onclick="Cobro.saveCuota(${contractId},${idx})">Guardar</button>`);
  },
  saveCuota(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    const mes = document.getElementById('ec_mes').value.trim();
    const monto = parseFloat(document.getElementById('ec_monto').value)||0;
    if (!/^\d{4}-\d{2}$/.test(mes)) { alert("El mes debe tener el formato AAAA-MM (ej: 2026-07)."); return; }
    q.mes = mes; q.monto = monto;
    if (q.pagado) q.moraTotal = Math.round(monto*(q.moraPct||0)/100) + (q.moraFija||0);
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  },
  delCuota(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    if (q.pagado) { if (!confirm(`El mes ${q.mes} figura COBRADO. ¿Seguro que querés eliminarlo? Se perderá el registro de ese cobro.`)) return; }
    else { if (!confirm(`¿Eliminar el mes ${q.mes}?`)) return; }
    c.cuotas.splice(idx,1);
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  }
};

/* ---------- Actualización asistida del alquiler ---------- */
const Actualiz = {
  /* Recalcula la próxima actualización a partir del último valor del historial.
     Sirve cuando el alquiler ya se actualizó pero la fecha quedó vieja. */
  recalcularDesdeHistorial(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    if (!c) return;
    const hist = (c.histValores||[]).slice().sort((a,b)=> a.desde < b.desde ? -1 : 1);
    if (!hist.length) { alert("Este contrato no tiene historial de valores cargado.\nRegistrá la actualización con el botón «Actualizar»."); return; }
    const ultimo = hist[hist.length-1];
    const cada = c.actualizaCada || 3;
    // avanzar de a un período desde el último valor, hasta caer en una fecha futura
    let prox = addMonths(ultimo.desde, cada);
    let vueltas = 0;
    while (daysBetween(today, prox) < 0 && vueltas < 120) { prox = addMonths(prox, cada); vueltas++; }
    const antes = c.proxActualiz;
    if (!confirm(`El último valor del historial es ${fmt(ultimo.valor,c.moneda)} desde el ${fdate(ultimo.desde)}.\n\nLa próxima actualización pasaría del ${fdate(antes)} al ${fdate(prox)}.\n\n¿Confirmás?`)) return;
    c.proxActualiz = prox;
    // el valor vigente también se alinea con el historial
    const vigentes = hist.filter(h=>h.desde <= today);
    if (vigentes.length) {
      c.valor = vigentes[vigentes.length-1].valor;
      const p = prop(c.propId);
      if (p) { p.valorAlquiler = c.valor; persist('properties', p); }
    }
    persist('contracts', c);
    App.go(STATE.page);
    setTimeout(()=>alert(`Listo.\nValor vigente: ${fmt(c.valor,c.moneda)}\nPróxima actualización: ${fdate(c.proxActualiz)}`),100);
  },

  form(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    const atraso = c.proxActualiz ? daysBetween(today, c.proxActualiz) : null;
    const vencida = atraso != null && atraso < 0;
    Modal.open(`Actualizar alquiler — ${esc(c.inquilino)}`, `
      ${vencida?`<div class="notice" style="background:#fdf0ee;border-color:#f0c4bc">${I.warn}<div><b>Esta actualización está vencida hace ${-atraso} días</b> (correspondía el ${fdate(c.proxActualiz)}).<br>Si ya se la aplicaste al inquilino, registrala acá con el valor y la fecha en que empezó a regir, así el sistema queda al día y deja de avisarte.</div></div>`:""}
      <div class="notice">${I.info}<div>Ingresá el coeficiente del índice (${esc(c.indice)}) o directamente el nuevo valor. El sistema calcula, aplica el nuevo alquiler y guarda el historial. El valor anterior queda registrado.</div></div>
      <div class="form-row">
        <div class="field"><label>Valor actual</label><input value="${fmt(c.valor,c.moneda)}" disabled></div>
        <div class="field"><label>Índice</label><input value="${esc(c.indice)}" disabled></div>
      </div>
      <div class="form-section">
        <h4>${I.money} Cálculo por coeficiente</h4>
        <div class="form-row">
          <div class="field"><label>Coeficiente (ej. 1.2350)</label><input id="ac_coef" type="number" step="0.0001" placeholder="1.0000" oninput="Actualiz.recalc(${contractId})"></div>
          <div class="field"><label>Nuevo valor (calculado o manual)</label><input id="ac_nuevo" type="number" oninput="document.getElementById('ac_coef').value=''"></div>
        </div>
        <div class="hint">Si cargás coeficiente, se calcula solo. Si preferís, escribí el nuevo valor a mano.</div>
      </div>
      <div class="form-row one">
        <div class="field"><label>Rige desde</label>${dateInput('ac_desde', c.proxActualiz||today)}
          <div class="hint">${vencida?"Es la fecha en que el nuevo valor empezó a regir. Si la actualización ya se aplicó, dejá la fecha real.":"Fecha desde la que rige el nuevo valor."}</div></div>
      </div>
      <div class="breakdown" id="ac_break"></div>
    `, `<button class="btn" onclick="Contract.view(${contractId})">Volver</button><button class="btn btn-primary" onclick="Actualiz.save(${contractId})">Aplicar actualización</button>`);
    Actualiz.recalc(contractId);
  },
  recalc(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    const coef = parseFloat(document.getElementById('ac_coef').value);
    const out = document.getElementById('ac_nuevo');
    let nuevo = parseFloat(out.value)||0;
    if (!isNaN(coef) && coef>0) { nuevo = Math.round(c.valor*coef); out.value = nuevo; }
    const dif = nuevo - c.valor;
    document.getElementById('ac_break').innerHTML = nuevo ? `
      <div class="line"><span>Valor anterior</span><span>${fmt(c.valor,c.moneda)}</span></div>
      <div class="line"><span>Nuevo valor</span><span>${fmt(nuevo,c.moneda)}</span></div>
      <div class="line total"><span>Variación</span><span>${dif>=0?'+':''}${fmt(dif,c.moneda)} (${c.valor?((dif/c.valor)*100).toFixed(1):0}%)</span></div>` : "";
  },
  save(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    const nuevo = parseFloat(document.getElementById('ac_nuevo').value)||0;
    const desde = Fechas.get('ac_desde') || today;
    if (!nuevo || nuevo<=0) { alert("Ingresá un coeficiente o un nuevo valor válido."); return; }
    c.histValores = c.histValores || [];
    c.histValores.push({ desde, valor:nuevo });
    c.valor = nuevo;

    // Calcular la PRÓXIMA actualización a futuro.
    // Si la que se registra estaba atrasada, avanzamos de a un período
    // hasta caer en una fecha que todavía no pasó (si no, la alarma reaparece al instante).
    const cada = c.actualizaCada || 3;
    let prox = addMonths(desde, cada);
    let vueltas = 0;
    while (daysBetween(today, prox) < 0 && vueltas < 60) {   // tope de seguridad
      prox = addMonths(prox, cada);
      vueltas++;
    }
    c.proxActualiz = prox;
    // reflejar el nuevo valor también en la propiedad
    const p = prop(c.propId);
    if (p) { p.valorAlquiler = nuevo; persist('properties', p); }

    persist('contracts', c);
    Contract.view(contractId);
    setTimeout(()=>alert(`Alquiler actualizado a ${fmt(nuevo,c.moneda)} desde ${fdate(desde)}.\nPróxima actualización: ${fdate(c.proxActualiz)}.`),100);
  }
};

/* ============================================================
   DOCUMENTOS (Firebase Storage)
   Los archivos se guardan de verdad en la nube y se pueden
   abrir desde cualquier computadora.
   ============================================================ */
const Docs = {
  // Si Storage está apagado, el módulo no se usa (los documentos van a Drive)
  disponible(){
    if (!USAR_STORAGE || !fbStorage) {
      alert("Los documentos de esta propiedad se guardan en su carpeta de Drive, junto con las fotos.");
      return false;
    }
    return true;
  },

  // Documentos de una PROPIEDAD
  list(propId){
    if (!Docs.disponible()) return;
    const p = prop(propId);
    const docs = p.docs || [];
    const puedeEditar = can();
    const body = `
      ${docs.length ? docs.map((d,i)=>`
        <div class="card" style="padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div style="display:flex;align-items:center;gap:10px;min-width:0">
            ${I.file}

              <div class="t-strong" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.nombre)}</div>
              <div class="t-muted">${esc(d.tipo||"Documento")} · ${fdate(d.fecha)}${d.tam?` · ${Docs.tam(d.tam)}`:""}</div>
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <a class="btn btn-sm" href="${esc(d.url)}" target="_blank">${I.down} Abrir</a>
            ${puedeEditar?`<button class="icon-btn" title="Eliminar" onclick="Docs.eliminar(${propId},${i})">${I.trash}</button>`:""}
          </div>
        </div>`).join("")
      : `<div class="empty" style="padding:30px"><h4>Sin documentos</h4><p>Todavía no se adjuntaron documentos a esta propiedad.</p></div>`}
      ${puedeEditar?`
        <div class="form-section" style="margin-top:14px">
          <h4>${I.plus} Adjuntar documento</h4>
          <div class="form-row">
            <div class="field"><label>Tipo de documento</label>
              <select id="doc_tipo">
                ${["Escritura","Plano","Boleto de compraventa","Reserva","Ficha técnica","Autorización de venta","Impuestos / servicios","Tasación","Otro"].map(o=>`<option>${o}</option>`).join("")}
              </select></div>
            <div class="field"><label>Archivo</label>
              <input type="file" id="doc_file" style="padding:7px;font-size:13px">
              <div class="hint">PDF, imagen o documento. Máximo 10 MB.</div></div>
          </div>

            <div style="background:var(--line);border-radius:6px;height:8px;overflow:hidden">

            </div>
            <div class="hint" id="doc_pct" style="margin-top:5px">Subiendo… 0%</div>
          </div>
        </div>`:""}
    `;
    Modal.open(`Documentos — ${p?.titulo||""}`, body,
      `<button class="btn" onclick="Modal.close()">Cerrar</button>${puedeEditar?`<button class="btn btn-primary" onclick="Docs.subir(${propId})">Subir documento</button>`:""}`);
  },

  tam(bytes){
    if (bytes < 1024) return bytes+" B";
    if (bytes < 1048576) return Math.round(bytes/1024)+" KB";
    return (bytes/1048576).toFixed(1)+" MB";
  },

  async subir(propId){
    const fileInput = document.getElementById('doc_file');
    const tipo = document.getElementById('doc_tipo').value;
    const f = fileInput?.files[0];
    if (!f) { alert("Elegí un archivo para subir."); return; }
    if (f.size > 10*1024*1024) { alert("El archivo es muy grande (máximo 10 MB)."); return; }
    const p = prop(propId);
    const prog = document.getElementById('doc_progress');
    const bar = document.getElementById('doc_bar');
    const pct = document.getElementById('doc_pct');
    prog.style.display = "block";
    try {
      // ruta: propiedades/PROP-0001/1699999999-escritura.pdf
      const limpio = f.name.replace(/[^\w.\-]/g,"_");
      const ruta = `propiedades/${p.codigo||p.id}/${Date.now()}-${limpio}`;
      const ref = fbStorage.ref(ruta);
      const tarea = ref.put(f);
      await new Promise((resolve, reject)=>{
        tarea.on('state_changed',
          snap => {
            const porc = Math.round((snap.bytesTransferred/snap.totalBytes)*100);
            bar.style.width = porc+"%";
            pct.textContent = `Subiendo… ${porc}%`;
          },
          err => reject(err),
          () => resolve()
        );
      });
      const url = await ref.getDownloadURL();
      p.docs = p.docs || [];
      p.docs.push({ nombre:f.name, tipo, url, ruta, fecha:today, tam:f.size });
      await persist('properties', p);
      Docs.list(propId);
      App.go(STATE.page);
    } catch(e) {
      console.error(e);
      prog.style.display = "none";
      alert("No se pudo subir el documento. Revisá tu conexión y que Storage esté habilitado en Firebase.");
    }
  },

  async eliminar(propId, idx){
    const p = prop(propId);
    const d = (p.docs||[])[idx];
    if (!d) return;
    if (!confirm(`¿Eliminar el documento "${d.nombre}"? Esta acción no se puede deshacer.`)) return;
    try {
      if (d.ruta) await fbStorage.ref(d.ruta).delete().catch(()=>{}); // si ya no existe, seguimos igual

      alert("No se pudo eliminar el documento.");

  },

const Agenda = {
