<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestión Inmobiliaria</title>
<style>
  :root {
    --ink: #1a2332;
    --ink-soft: #4a5568;
    --paper: #f4f5f7;
    --surface: #ffffff;
    --line: #e2e6ec;
    --line-strong: #cbd3df;
    --brand: #1f4e6b;
    --brand-deep: #163a50;
    --brand-soft: #e8f0f5;
    --accent: #c9821e;
    --accent-soft: #fbf0dd;
    --green: #2e7d4f;
    --green-soft: #e3f1e8;
    --red: #c0392b;
    --red-soft: #fbe9e7;
    --amber: #b8860b;
    --amber-soft: #fdf3d8;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(22,58,80,.08), 0 1px 2px rgba(22,58,80,.04);
    --shadow-lg: 0 8px 28px rgba(22,58,80,.16);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.5; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  /* Layout */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 230px; background: var(--brand-deep); color: #dfe8ee; flex-shrink: 0;
    display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 30;
  }
  .brand { padding: 18px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.1); text-align: center; }
  .brand-logo { background: #f4f1ea; border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
  .brand-logo img { width: 100%; max-width: 150px; height: auto; display: block; border-radius: 6px; }
  .brand h1 { font-size: 13.5px; font-weight: 600; color: #cddae3; letter-spacing: .3px; line-height: 1.3; }
  .brand span { font-size: 11px; color: #8fb0c4; text-transform: uppercase; letter-spacing: 1px; }
  .nav { padding: 12px 0; flex: 1; overflow-y: auto; }
  .nav-sep { padding: 14px 20px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: #7d9cb0; font-weight: 700; }
  .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: #6f93a8; padding: 14px 20px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 9px 20px; color: #c4d4de;
    border: none; background: none; width: 100%; text-align: left; font-size: 13.5px; transition: all .15s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,.09); color: #fff; border-left-color: var(--accent); font-weight: 600; }
  /* Tamaño base de los íconos: evita que se estiren si no hay una regla específica */
  .ic { width: 16px; height: 16px; flex-shrink: 0; vertical-align: middle; }
  .nav-item .ic { width: 17px; height: 17px; flex-shrink: 0; opacity: .85; }
  .nav-foot { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.1); font-size: 12px; color: #8fb0c4; }
  .user-badge { display: flex; align-items: center; gap: 9px; }
  .user-badge .av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }

  .main { flex: 1; margin-left: 230px; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 28px;
    height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20;
  }
  .topbar .crumb { font-size: 13px; color: var(--ink-soft); }
  .topbar .crumb b { color: var(--ink); font-weight: 600; }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .content { padding: 26px 28px 60px; max-width: 1280px; width: 100%; }

  /* Role switch */
  .role-switch { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .role-switch select { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); }

  /* Page head */
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
  .page-head h2 { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -.3px; }
  .page-head p { color: var(--ink-soft); margin-top: 3px; font-size: 13.5px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; transition: all .15s; }
  .btn:hover { background: #f8f9fb; border-color: var(--brand); }
  .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn-primary:hover { background: var(--brand-deep); color: #fff; }
  .btn-sm { padding: 6px 11px; font-size: 12px; }
  .btn .ic { width: 15px; height: 15px; }

  /* Cards & grid */
  .grid { display: grid; gap: 16px; }
  .stat-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  /* Grilla de tarjetas de indicadores (panel principal y tablero) */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stats > .stat, .stats > .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .stat { padding: 18px 20px; }
  .stat .lbl { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
  .stat .val { font-size: 28px; font-weight: 700; color: var(--ink); margin-top: 6px; letter-spacing: -.5px; }
  .stat .sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .stat .val.brand { color: var(--brand); }

  /* Section */
  .section { margin-top: 26px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
  .section-head h3 { font-size: 16px; font-weight: 700; color: var(--ink); }

  /* Table */
  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; box-shadow: var(--shadow); }
  /* Barra de filtros */
  .filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .filters-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .filters-head h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--brand); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .filters-grid .fg { display: flex; flex-direction: column; gap: 4px; }
  .filters-grid label { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
  .filters-grid input, .filters-grid select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--surface); }
  .filters-grid input:focus, .filters-grid select:focus { outline: none; border-color: var(--brand); }
  .filter-range { display: flex; gap: 6px; align-items: center; }
  .filter-range input { width: 100%; }
  .filter-count { font-size: 12.5px; color: var(--ink-soft); }
  .filter-count b { color: var(--brand); }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: #f7f9fb; text-align: left; padding: 11px 16px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-soft); font-weight: 700; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody td { padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  tbody tr.sold { background: #fdecea; }
  tbody tr.sold:hover { background: #fbe0dc; }
  tbody tr.sold td:first-child { box-shadow: inset 3px 0 0 var(--red); }
  .code-tag { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
  .t-strong { font-weight: 600; color: var(--ink); }
  .t-muted { color: var(--ink-soft); font-size: 12.5px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .badge.green { background: var(--green-soft); color: var(--green); }
  .badge.red { background: var(--red-soft); color: var(--red); }
  .badge.amber { background: var(--amber-soft); color: var(--amber); }
  .badge.blue { background: var(--brand-soft); color: var(--brand); }
  .badge.gray { background: #eef1f4; color: var(--ink-soft); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill { display: inline-flex; padding: 2px 9px; border-radius: 5px; font-size: 11px; font-weight: 600; background: #eef1f4; color: var(--ink-soft); }
  .pill.sale { background: var(--brand-soft); color: var(--brand); }
  .pill.rent { background: var(--accent-soft); color: var(--accent); }

  /* Empty state */
  .empty { text-align: center; padding: 54px 20px; color: var(--ink-soft); }
  .empty .ic { width: 44px; height: 44px; margin: 0 auto 14px; opacity: .4; }
  .empty h4 { font-size: 16px; color: var(--ink); margin-bottom: 6px; font-weight: 600; }
  .empty p { font-size: 13.5px; max-width: 380px; margin: 0 auto 16px; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .tab { padding: 10px 18px; border: none; background: none; font-size: 14px; color: var(--ink-soft); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(22,40,55,.45); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 16px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 620px; box-shadow: var(--shadow-lg); animation: pop .18s ease; }
  .modal.wide { max-width: 920px; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { font-size: 17px; font-weight: 700; }
  .modal-body { padding: 22px 24px; max-height: 60vh; overflow-y: auto; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
  .x-btn { background: none; border: none; font-size: 22px; color: var(--ink-soft); line-height: 1; padding: 0 4px; }

  /* Forms */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-row.one { grid-template-columns: 1fr; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  .field .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  /* Campo de fecha dd/mm/aaaa con almanaque */
  .date-field { position: relative; display: flex; align-items: center; }
  .date-field .date-text { width: 100%; padding-right: 40px !important; }
  .date-field .date-text.date-err { border-color: var(--red); box-shadow: 0 0 0 3px rgba(192,57,43,.12); }
  .date-field .date-cal { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; right: 10px; }
  .date-field .date-cal-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--ink-soft); padding: 4px; display: flex; align-items: center; border-radius: 5px; }
  .date-field .date-cal-btn:hover { background: var(--brand-soft); color: var(--brand); }
  .date-field .date-cal-btn .ic { width: 17px; height: 17px; }

  /* Drive link */
  .drive-link { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); font-weight: 600; font-size: 13px; text-decoration: none; }
  .drive-link:hover { text-decoration: underline; }

  /* Alarm list */
  .alarm { display: flex; gap: 13px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .alarm:last-child { border-bottom: none; }
  .alarm-ic { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .alarm-ic.red { background: var(--red-soft); color: var(--red); }
  .alarm-ic.amber { background: var(--amber-soft); color: var(--amber); }
  .alarm-ic.blue { background: var(--brand-soft); color: var(--brand); }
  .alarm-body { flex: 1; }
  .alarm-body .t { font-weight: 600; font-size: 13.5px; }
  .alarm-body .d { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .alarm-time { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

  /* Detail */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; }
  .detail-item .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-soft); font-weight: 600; }
  .detail-item .v { font-size: 14.5px; color: var(--ink); margin-top: 3px; }

  .hidden { display: none !important; }
  .row-actions { display: flex; gap: 6px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-soft); }
  .icon-btn:hover { border-color: var(--brand); color: var(--brand); }
  .icon-btn .ic { width: 15px; height: 15px; }

  .notice { background: var(--accent-soft); border: 1px solid #f0d8a8; border-radius: 8px; padding: 13px 16px; font-size: 13px; color: #7a5610; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 20px; }
  .notice .ic { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

  @media (max-width: 860px) {
    .sidebar { transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-toggle { display: inline-flex !important; }
    .form-row { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
  }
  .menu-toggle { display: none; }

  /* --- Agregados v2 --- */
  .checkbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .checkbox-grid label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--ink); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .checkbox-grid label:hover { border-color: var(--brand); background: #f8f9fb; }
  .checkbox-grid input { width: auto; margin: 0; }
  .form-section { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; background: #fafbfc; }
  .form-section > h4 { font-size: 13px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 13px; display: flex; align-items: center; gap: 7px; }
  .form-section > h4 .ic { width: 15px; height: 15px; }
  .breakdown { background: var(--brand-soft); border-radius: 8px; padding: 14px 16px; margin-top: 6px; }
  .breakdown .line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13.5px; }
  .breakdown .line.total { border-top: 1px solid var(--line-strong); margin-top: 6px; padding-top: 9px; font-weight: 700; font-size: 16px; color: var(--brand); }
  .file-drop { border: 1.5px dashed var(--line-strong); border-radius: 8px; padding: 16px; text-align: center; color: var(--ink-soft); font-size: 13px; cursor: pointer; transition: all .15s; }
  .file-drop:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .file-drop.has-file { border-style: solid; border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 600; }
  .file-row { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .timeline { list-style: none; }
  .timeline li { padding: 7px 0 7px 18px; border-left: 2px solid var(--line-strong); position: relative; font-size: 13px; }
  .timeline li::before { content: ''; position: absolute; left: -5px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
  .seg button { padding: 8px 14px; border: none; background: var(--surface); font-size: 13px; color: var(--ink-soft); }
  .seg button.active { background: var(--brand); color: #fff; font-weight: 600; }
</style>

<body>
<!-- ============================================================
     PANTALLA DE LOGIN (Firebase Authentication)
     ============================================================ -->
<div id="loginScreen" style="position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#163a50,#1f4e6b);display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:380px;padding:34px 30px">

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const fmt = (n, cur="ARS") => {
  if (n == null || isNaN(n)) return "—";
  const s = new Intl.NumberFormat("es-AR",{maximumFractionDigits:0}).format(n);
  return (cur==="USD"?"US$ ":"$ ") + s;
};
const fdate = d => { if(!d) return "—"; const [y,m,day]=d.split("-"); return `${day}/${m}/${y}`; };
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const addMonths = (d, n) => { const dt = new Date(d+"T12:00:00"); dt.setMonth(dt.getMonth()+n); return isoDate(dt); };
// Fecha en formato AAAA-MM-DD a partir de un objeto Date (sin desfases de zona horaria)
function isoDate(dt){
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,"0");
  const d = String(dt.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

/* ════════════════════════════════════════════════════════════
   CAMPOS DE FECHA EN dd/mm/aaaa
   El usuario escribe a mano en dd/mm/aaaa O elige del almanaque.
   No depende del idioma del navegador: siempre se ve dd/mm/aaaa.
   Internamente todo se guarda como aaaa-mm-dd (formato universal).
   ════════════════════════════════════════════════════════════ */
// aaaa-mm-dd  ->  dd/mm/aaaa (para mostrar en el campo de texto)
function isoADmy(iso){
  if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return "";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
// dd/mm/aaaa (lo que escribe la persona)  ->  aaaa-mm-dd  (null si es inválida)
function dmyAIso(dmy){
  if (!dmy) return null;
  const s = dmy.trim().replace(/-/g,"/").replace(/\./g,"/");
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  let [_, d, mo, y] = m;
  d = parseInt(d); mo = parseInt(mo); y = parseInt(y);
  if (mo<1 || mo>12 || d<1 || d>31) return null;
  const iso = `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  // validar que la fecha exista de verdad (ej: 31/02 no vale)
  const dt = new Date(iso+"T12:00:00");
  if (dt.getFullYear()!==y || dt.getMonth()+1!==mo || dt.getDate()!==d) return null;
  return iso;
}

/* Genera un campo de fecha dd/mm/aaaa con botón de almanaque.
   id: identificador base. value: fecha en aaaa-mm-dd. onchange: código JS opcional. */
function dateInput(id, value, opts={}){
  const dmy = isoADmy(value||"");
  const cb = opts.onchange ? ` data-onchange="${esc(opts.onchange).replace(/"/g,'&quot;')}"` : "";
  return `<span class="date-field">
    <input type="text" id="${id}" class="date-text" value="${dmy}" placeholder="dd/mm/aaaa"
           inputmode="numeric" maxlength="10" autocomplete="off"
           oninput="Fechas.mask(this)" onchange="Fechas.onText('${id}')"${cb}>
    <input type="date" id="${id}__cal" class="date-cal" value="${value||""}" min="${MIN_FECHA}" max="${MAX_FECHA}"
           onchange="Fechas.onCal('${id}')" tabindex="-1" aria-label="Elegir del calendario">
    <button type="button" class="date-cal-btn" onclick="Fechas.abrir('${id}')" tabindex="-1" title="Elegir del calendario">${I.cal}</button>
  </span>`;
}

const Fechas = {
  // formatea mientras se escribe: mete las barras solas
  mask(el){
    let v = el.value.replace(/[^\d]/g,"").slice(0,8);
    if (v.length>=5) v = v.slice(0,2)+"/"+v.slice(2,4)+"/"+v.slice(4);
    else if (v.length>=3) v = v.slice(0,2)+"/"+v.slice(2);
    el.value = v;
  },
  // cuando se termina de escribir a mano: valida y sincroniza el almanaque
  onText(id){
    const txt = document.getElementById(id);
    const cal = document.getElementById(id+"__cal");
    const iso = dmyAIso(txt.value);
    if (iso) { txt.classList.remove("date-err"); if (cal) cal.value = iso; }
    else if (txt.value.trim()!=="") { txt.classList.add("date-err"); }
    else { txt.classList.remove("date-err"); if (cal) cal.value=""; }
    Fechas._fireChange(id);
  },
  // cuando se elige del almanaque: refleja en el texto
  onCal(id){
    const txt = document.getElementById(id);
    const cal = document.getElementById(id+"__cal");
    txt.value = isoADmy(cal.value);
    txt.classList.remove("date-err");
    Fechas._fireChange(id);
  },
  // abre el almanaque nativo
  abrir(id){
    const cal = document.getElementById(id+"__cal");
    if (cal && cal.showPicker) { try { cal.showPicker(); return; } catch(e){} }
    if (cal) cal.click();
  },
  // dispara el onchange que haya pedido el campo (para recálculos)
  _fireChange(id){
    const txt = document.getElementById(id);
    const code = txt?.getAttribute('data-onchange');
    if (code) { try { new Function(code)(); } catch(e){ console.error(e); } }
  },
  // lee el valor de un campo de fecha como aaaa-mm-dd (o "" si está vacío/inválido)
  get(id){
    const txt = document.getElementById(id);
    if (!txt) return "";
    return dmyAIso(txt.value) || "";
  }
};

/* ════════════════════════════════════════════════════════════
   ADJUNTAR DOCUMENTOS EN EL SISTEMA (Firebase Storage)
   ────────────────────────────────────────────────────────────
   false = los documentos van a la carpeta de Drive (SIN COSTO).
   true  = se adjuntan dentro del sistema.
           OJO: requiere activar Storage en Firebase, que exige
           el plan Blaze (pago por uso, pide tarjeta).
           Si lo ponés en true sin activarlo, los botones fallan.
   ════════════════════════════════════════════════════════════ */
const USAR_STORAGE = false;
// FECHA REAL DEL DÍA: se calcula cada vez que se abre el sistema.
const today = isoDate(new Date());
// Límites para los campos de fecha (evita que se cargue un año inválido como 12026)
const MIN_FECHA = "2000-01-01";
const MAX_FECHA = "2099-12-31";
const prop = id => DB.properties.find(p=>p.id===id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isVivienda = t => t==="Casa" || t==="Departamento";
const esVendida = p => p.enVenta && p.estadoOp === "Vendida";

/* Estado REAL del contrato, calculado según las fechas y la fecha de hoy.
   - Si el inicio todavía no llegó  → "A comenzar"
   - Si ya terminó                  → "Finalizado"
   - Si está en curso               → "Vigente"
   Los estados cargados a mano que son definitivos (Finalizado, Rescindido)
   tienen prioridad: si alguien lo marcó así, se respeta. */
function estadoContrato(c){
  if (!c) return "—";
  if (c.estado === "Rescindido" || c.estado === "Finalizado") return c.estado;
  if (c.inicio && daysBetween(today, c.inicio) > 0) return "A comenzar";
  if (c.fin && daysBetween(c.fin, today) > 0) return "Finalizado";
  return "Vigente";
}
// ¿El contrato está activo hoy? (ocupa la propiedad)
function contratoActivo(c){
  const e = estadoContrato(c);
  return e === "Vigente" || e === "A comenzar";
}
const can = () => ROLES[STATE.role].edit;

/* ---------- Motor de alarmas ---------- */
function computeAlarms() {
  const out = [];
  DB.contracts.forEach(c => {
    const p = prop(c.propId);
    // Los contratos finalizados o rescindidos ya no generan alarmas
    const est = estadoContrato(c);
    if (est === "Finalizado" || est === "Rescindido") return;
    if (c.proxActualiz) {
      const dd = daysBetween(today, c.proxActualiz);
      // Se avisa desde 10 días antes y hasta 60 días después de vencida.
      // Pasado ese plazo el dato quedó desactualizado (la actualización se hizo
      // pero no se registró), y la alarma dejaría de ser útil: se avisa aparte.
      if (dd <= 10 && dd >= -60) out.push({ level: dd<0?"red":"amber", icon:I.money,
        title:`Actualización de alquiler — ${p?.titulo||"Propiedad"}`,
        desc:`Ajuste por ${c.indice} ${dd<0?"vencido":"a aplicar"} el ${fdate(c.proxActualiz)}. Valor actual: ${fmt(c.valor,c.moneda)}.`,
        when: dd<0?`Hace ${-dd} días`:`En ${dd} días`, cat:"rentals",
        action:`Actualiz.form(${c.id})`, actionLabel:"Actualizar" });
      // Muy vencida: probablemente la fecha quedó desfasada respecto del historial
      else if (dd < -60) out.push({ level:"amber", icon:I.warn,
        title:`Revisar fecha de actualización — ${p?.titulo||"Propiedad"}`,
        desc:`La próxima actualización figura el ${fdate(c.proxActualiz)}, hace más de 60 días. Si el alquiler ya se actualizó, recalculá la fecha desde el historial de valores.`,
        when:`Desfasada ${-dd} días`, cat:"rentals",
        action:`Actualiz.recalcularDesdeHistorial(${c.id})`, actionLabel:"Recalcular" });
    }
    if (c.fin) {
      const dd = daysBetween(today, c.fin);
      if (dd <= 60 && dd >= 0) out.push({ level: dd<20?"red":"amber", icon:I.cal,
        title:`Vencimiento de contrato — ${p?.titulo||"Propiedad"}`,
        desc:`El contrato de ${c.inquilino} finaliza el ${fdate(c.fin)}`,
        when:`En ${dd} días`, cat:"rentals" });
    }
    (c.cuotas||[]).forEach((q,qi) => {
      if (!q.pagado) {
        const dd = daysBetween(q.mes+"-10", today);
        if (dd > 0) out.push({ level:"red", icon:I.warn,
          title:`Cuota impaga — ${p?.titulo||"Propiedad"}`,
          desc:`${c.inquilino}: cuota ${q.mes} vencida hace ${dd} días.`,
          when:`Venció hace ${dd} días`, cat:"rentals",
          action:`Cobro.form(${c.id},${qi})`, actionLabel:"Cobrar" });
      }
    });
  });
  // Termotanque: solo en propiedades en alquiler (para recordarle al inquilino)
  DB.properties.forEach(p => {
    if (p.enAlquiler && p.aguaCaliente === "Termotanque" && p.ultCambioVarilla) {
      const prox = addMonths(p.ultCambioVarilla, 8);
      const dd = daysBetween(today, prox);
      // Se avisa desde 15 días antes; si pasaron más de 120 días vencido,
      // el dato quedó viejo (el cambio se hizo sin registrarse) y se avisa distinto.
      if (dd <= 15 && dd >= -120) out.push({ level: dd<0?"red":"amber", icon:I.flame,
        title:`Cambio de varilla (termotanque) — ${p.titulo}`,
        desc:`Mantenimiento cada 8 meses. ${dd<0?"Vencido el":"A realizar el"} ${fdate(prox)}. Último cambio: ${fdate(p.ultCambioVarilla)}.`,
        when: dd<0?`Hace ${-dd} días`:`En ${dd} días`, cat:"rentals",
        action:`Mant.registrarVarilla(${p.id})` });
      else if (dd < -120) out.push({ level:"amber", icon:I.warn,
        title:`Revisar mantenimiento — ${p.titulo}`,
        desc:`El último cambio de varilla figura el ${fdate(p.ultCambioVarilla)}, hace más de 8 meses y medio. Si ya se hizo, registralo para reiniciar el ciclo.`,
        when:`Sin registrar`, cat:"rentals",
        action:`Mant.registrarVarilla(${p.id})` });
    }
    // Reparaciones pendientes: aparecen apenas se cargan y hasta que se resuelven
    if (p.enAlquiler && (p.reparaciones||[]).length) {
      p.reparaciones.forEach((r,i) => {
        if (r.fechaRep) return;                      // ya está reparada
        const dd = r.fechaRot ? daysBetween(r.fechaRot, today) : 0;
        out.push({ level: dd>15?"red":"amber", icon:I.tool,
          title:`Reparación pendiente — ${p.titulo}`,
          desc:`${esc(r.detalle||"Reparación")}. Rotura del ${fdate(r.fechaRot)}${r.contratado?` · ${esc(r.contratado)}`:""}.`,
          when: dd>0?`Hace ${dd} ${dd===1?'día':'días'}`:"Hoy", cat:"rentals",
          action:`Repar.form(${p.id},${i})`, actionLabel:"Registrar arreglo" });
      });
    }
  });
  DB.leads.forEach(l => {
    // AGENDA: la próxima acción queda pendiente hasta que se marque como ejecutada.
    // No desaparece sola: si la fecha pasó, se muestra atrasada.
    if (l.proxima && !l.accionHecha && l.estado !== "Descartado") {
      const dd = daysBetween(today, l.proxima);
      if (dd <= 7) { const p = prop(l.propId);
        out.push({ level: dd<0?"red":(dd===0?"amber":"blue"), icon:I.users,
          title:`Acción pendiente — ${l.nombre}`,
          desc:`${p?.titulo||""} · ${l.estado}${l.proxNota?` · ${l.proxNota}`:""}. Agendada para el ${fdate(l.proxima)}.`,
          when: dd<0?`Atrasada ${-dd} ${-dd===1?'día':'días'}`:(dd===0?"Hoy":`En ${dd} ${dd===1?'día':'días'}`), cat:"sales",
          action:`Agenda.ejecutar(${l.id})`, actionLabel:"Marcar como hecha" });
      }
    }
  });
  const order = {red:0,amber:1,blue:2};
  return out.sort((a,b)=>order[a.level]-order[b.level]);
}

const Filtros = {
  // Devuelve las localidades y tipos existentes (para armar los desplegables)
  opciones(props){
    const tipos = [...new Set(props.map(p=>p.tipo).filter(Boolean))].sort();
    const locs  = [...new Set(props.map(p=>p.localidad).filter(Boolean))].sort();
    return { tipos, locs };
  },

  /* ---------- Barra de filtros de VENTAS ---------- */
  barraVentas(props, isViewer){
    const f = STATE.fSales;
    const { tipos, locs } = Filtros.opciones(props);
    const opt = (arr, cur) => `<option value="">Todos</option>` + arr.map(o=>`<option ${cur===o?'selected':''}>${esc(o)}</option>`).join("");
    return `
      <div class="filters">
        <div class="filters-head">
          <h4>${I.search} Filtros de búsqueda</h4>
          <button class="btn btn-sm" onclick="Filtros.limpiar('sales')">Limpiar filtros</button>
        </div>
        <div class="filters-grid">
          <div class="fg"><label>Buscar</label>
            <input id="fs_texto" value="${esc(f.texto)}" placeholder="Título, código, dirección…" oninput="Filtros.aplicar('sales')"></div>
          <div class="fg"><label>Tipo</label>
            <select id="fs_tipo" onchange="Filtros.aplicar('sales')">${opt(tipos, f.tipo)}</select></div>
          <div class="fg"><label>Localidad</label>
            <select id="fs_localidad" onchange="Filtros.aplicar('sales')">${opt(locs, f.localidad)}</select></div>
          ${isViewer ? "" : `
          <div class="fg"><label>Estado</label>
            <select id="fs_estadoOp" onchange="Filtros.aplicar('sales')">
              <option value="">Todos</option>
              <option value="__disp" ${f.estadoOp==="__disp"?'selected':''}>Disponibles (sin vender)</option>
              ${["Disponible","Reservada","Con seña","Vendida"].map(o=>`<option ${f.estadoOp===o?'selected':''}>${o}</option>`).join("")}
            </select></div>`}
          <div class="fg"><label>Moneda</label>
            <select id="fs_moneda" onchange="Filtros.aplicar('sales')">
              <option value="">Todas</option>
              <option ${f.moneda==="USD"?'selected':''}>USD</option>
              <option ${f.moneda==="ARS"?'selected':''}>ARS</option>
            </select></div>
          <div class="fg"><label>Precio desde</label>
            <input id="fs_precioMin" type="number" value="${esc(f.precioMin)}" placeholder="Mín." oninput="Filtros.aplicar('sales')"></div>
          <div class="fg"><label>Precio hasta</label>
            <input id="fs_precioMax" type="number" value="${esc(f.precioMax)}" placeholder="Máx." oninput="Filtros.aplicar('sales')"></div>
          <div class="fg"><label>Financiación</label>
            <select id="fs_credito" onchange="Filtros.aplicar('sales')">
              <option value="">Todas</option>
              <option value="credito" ${f.credito==="credito"?'selected':''}>Apta crédito</option>
              <option value="financia" ${f.credito==="financia"?'selected':''}>Acepta financiación</option>
            </select></div>
        </div>
        ${isViewer ? `<div class="hint" style="margin-top:10px">Podés filtrar por rango de precio aunque el valor no se muestre.</div>` : ""}
      </div>`;
  },

  /* ---------- Barra de filtros de ALQUILERES ---------- */
  barraAlquileres(props){
    const f = STATE.fRentals;
    const { tipos, locs } = Filtros.opciones(props);
    const opt = (arr, cur) => `<option value="">Todos</option>` + arr.map(o=>`<option ${cur===o?'selected':''}>${esc(o)}</option>`).join("");
    return `
      <div class="filters">
        <div class="filters-head">
          <h4>${I.search} Filtros de búsqueda</h4>
          <button class="btn btn-sm" onclick="Filtros.limpiar('rentals')">Limpiar filtros</button>
        </div>
        <div class="filters-grid">
          <div class="fg"><label>Buscar</label>
            <input id="fr_texto" value="${esc(f.texto)}" placeholder="Título, código, inquilino…" oninput="Filtros.aplicar('rentals')"></div>
          <div class="fg"><label>Tipo</label>
            <select id="fr_tipo" onchange="Filtros.aplicar('rentals')">${opt(tipos, f.tipo)}</select></div>
          <div class="fg"><label>Localidad</label>
            <select id="fr_localidad" onchange="Filtros.aplicar('rentals')">${opt(locs, f.localidad)}</select></div>
          <div class="fg"><label>Situación</label>
            <select id="fr_contrato" onchange="Filtros.aplicar('rentals')">
              <option value="">Todas</option>
              <option value="libre" ${f.contrato==="libre"?'selected':''}>Libres (sin contrato)</option>
              <option value="ocupada" ${f.contrato==="ocupada"?'selected':''}>Ocupadas (contrato vigente)</option>
              <option value="acomenzar" ${f.contrato==="acomenzar"?'selected':''}>Contrato a comenzar</option>
              <option value="porvencer" ${f.contrato==="porvencer"?'selected':''}>Contrato por vencer (60 días)</option>
              <option value="reparacion" ${f.contrato==="reparacion"?'selected':''}>Con reparación pendiente</option>
            </select></div>
          <div class="fg"><label>Alquiler desde</label>
            <input id="fr_precioMin" type="number" value="${esc(f.precioMin)}" placeholder="Mín." oninput="Filtros.aplicar('rentals')"></div>
          <div class="fg"><label>Alquiler hasta</label>
            <input id="fr_precioMax" type="number" value="${esc(f.precioMax)}" placeholder="Máx." oninput="Filtros.aplicar('rentals')"></div>
        </div>
      </div>`;
  },

  /* ---------- Leer los valores y volver a dibujar la tabla ---------- */
  aplicar(cual){
    const g = id => document.getElementById(id)?.value ?? "";
    if (cual==="master") {
      STATE.fMaster = { texto:g('fm_texto') };
      const cont = document.getElementById('tablaFiltrada');
      if (cont) cont.innerHTML = App.tablaMaestro();
      return;
    }
    if (cual==="sales") {
      STATE.fSales = {
        texto:g('fs_texto'), tipo:g('fs_tipo'), localidad:g('fs_localidad'),
        estadoOp:g('fs_estadoOp'), precioMin:g('fs_precioMin'), precioMax:g('fs_precioMax'),
        moneda:g('fs_moneda'), credito:g('fs_credito'),
      };
    } else {
      STATE.fRentals = {
        texto:g('fr_texto'), tipo:g('fr_tipo'), localidad:g('fr_localidad'),
        contrato:g('fr_contrato'), precioMin:g('fr_precioMin'), precioMax:g('fr_precioMax'),
      };
    }
    const cont = document.getElementById('tablaFiltrada');
    if (cont) cont.innerHTML = (cual==="sales") ? App.tablaVentas() : App.tablaAlquileres();
  },

  limpiar(cual){
    if (cual==="master") { STATE.fMaster = { texto:"" }; App.go(STATE.page); return; }
    if (cual==="sales") STATE.fSales = { texto:"", tipo:"", localidad:"", estadoOp:"", precioMin:"", precioMax:"", moneda:"", credito:"" };
    else STATE.fRentals = { texto:"", tipo:"", localidad:"", contrato:"", precioMin:"", precioMax:"" };
    App.go(STATE.page);
  },

  /* ---------- Aplicar los filtros a las listas ---------- */
  /* ---------- MAESTRO: búsqueda por texto ---------- */
  filtrarMaestro(props){
    const txt = (STATE.fMaster.texto||"").toLowerCase().trim();
    if (!txt) return props;
    return props.filter(p=>{
      const campos = [p.codigo, p.titulo, p.direccion, p.localidad, p.tipo, p.propietario, p.propietarioAlq]
        .map(x=>String(x||"").toLowerCase()).join(" ");
      return campos.includes(txt);
    });
  },

  filtrarVentas(props){
    const f = STATE.fSales;
    const txt = (f.texto||"").toLowerCase().trim();
    return props.filter(p=>{
      if (txt) {
        const campos = [p.titulo, p.codigo, p.direccion, p.localidad, p.tipo].map(x=>String(x||"").toLowerCase()).join(" ");
        if (!campos.includes(txt)) return false;
      }
      if (f.tipo && p.tipo !== f.tipo) return false;
      if (f.localidad && p.localidad !== f.localidad) return false;
      if (f.estadoOp) {
        if (f.estadoOp === "__disp") { if (esVendida(p)) return false; }
        else if ((p.estadoOp||"") !== f.estadoOp) return false;
      }
      if (f.moneda && (p.monedaVenta||"") !== f.moneda) return false;
      const precio = parseFloat(p.valorVenta)||0;
      if (f.precioMin && precio < parseFloat(f.precioMin)) return false;
      if (f.precioMax && precio > parseFloat(f.precioMax)) return false;
      if (f.credito === "credito" && !p.aptaCredito) return false;
      if (f.credito === "financia" && !p.aceptaFinanciacion) return false;
      return true;
    });
  },

  filtrarAlquileres(props){
    const f = STATE.fRentals;
    const txt = (f.texto||"").toLowerCase().trim();
    return props.filter(p=>{
      const c = DB.contracts.find(c=>c.propId===p.id && contratoActivo(c));
      if (txt) {
        const campos = [p.titulo, p.codigo, p.direccion, p.localidad, p.tipo, c?.inquilino].map(x=>String(x||"").toLowerCase()).join(" ");
        if (!campos.includes(txt)) return false;
      }
      if (f.tipo && p.tipo !== f.tipo) return false;
      if (f.localidad && p.localidad !== f.localidad) return false;
      if (f.contrato) {
        const est = c ? estadoContrato(c) : null;
        if (f.contrato === "libre"      && c) return false;
        if (f.contrato === "ocupada"    && est !== "Vigente") return false;
        if (f.contrato === "acomenzar"  && est !== "A comenzar") return false;
        if (f.contrato === "porvencer") {
          if (!c || !c.fin) return false;
          const dd = daysBetween(today, c.fin);
          if (!(dd >= 0 && dd <= 60)) return false;
        }
        if (f.contrato === "reparacion") {
          const pend = (p.reparaciones||[]).some(x=>!x.fechaRep);
          if (!pend) return false;
        }
      }
      const precio = parseFloat(p.valorAlquiler)||0;
      if (f.precioMin && precio < parseFloat(f.precioMin)) return false;
      if (f.precioMax && precio > parseFloat(f.precioMax)) return false;
      return true;
    });
  },
};

const App = {
  // En la versión Firebase el rol lo fija el usuario logueado (no hay selector).
  initFirebase(rol){
    STATE.role = rol;
    const cfg = ROLES[rol] || ROLES.viewer;
    const tn = document.getElementById('topUserName');
    const tr = document.getElementById('topUserRole');
    if (tn) tn.textContent = STATE.usuario?.nombre || "";
    if (tr) tr.textContent = cfg.name;
    $("#userAv").textContent = (STATE.usuario?.nombre || cfg.name).charAt(0).toUpperCase();
    $("#userName").textContent = STATE.usuario?.nombre || cfg.name;
    $("#userRole").textContent = cfg.name;
    this.go(cfg.pages[0]);
  },

  setRole(r){
    STATE.role = r;
    const cfg = ROLES[r];
    const allowed = cfg.pages;
    this.go(allowed.includes(STATE.page) ? STATE.page : allowed[0]);
  },

  go(page){
    const cfg = ROLES[STATE.role];
    if (!cfg.pages.includes(page)) page = cfg.pages[0];
    STATE.page = page;
    this.renderNav();
    const item = NAV.find(n=>n.id===page);
    $("#crumb").innerHTML = `<b>${item?item.label:""}</b>`;
    const fn = this["render_"+page];
    $("#content").innerHTML = fn ? fn.call(this) : "";
    document.getElementById('sidebar')?.classList.remove('open');
  },

  renderNav(){
    const cfg = ROLES[STATE.role];
    let html = "";
    NAV.forEach((n, i) => {
      if (n.sep) {
        // mostrar el separador solo si hay alguna página visible debajo (antes del próximo separador)
        let hay = false;
        for (let j=i+1; j<NAV.length && !NAV[j].sep; j++) {
          if (NAV[j].id && cfg.pages.includes(NAV[j].id)) { hay = true; break; }
        }
        if (hay) html += `<div class="nav-sep">${n.sep}</div>`;
        return;
      }
      if (!cfg.pages.includes(n.id)) return;
      html += `<button class="nav-item ${STATE.page===n.id?'active':''}" onclick="App.go('${n.id}')">${n.icon}<span>${n.label}</span></button>`;
    });
    $("#nav").innerHTML = html;
  },

  /* ---------- ALQUILERES ---------- */
  render_rentals(){
    const alquileres = DB.properties.filter(p=>p.enAlquiler);
    const head = `
      <div class="page-head">
        <div><h2>Alquileres</h2><p>Propiedades en alquiler, contratos y vigencias.</p></div>

    if (!alquileres.length) return head + App.emptyState("Sin propiedades en alquiler","Marcá una propiedad como 'en alquiler'.","Nueva propiedad","Prop.form(null,'alquiler')");
    return head
      + Filtros.barraAlquileres(alquileres)
      + `<div id="tablaFiltrada">${App.tablaAlquileres()}</div>`;
  },

  // Tabla de alquileres (se vuelve a dibujar sola al filtrar)
  tablaAlquileres(){
    let alquileres = DB.properties.filter(p=>p.enAlquiler);
    const total = alquileres.length;
    alquileres = Filtros.filtrarAlquileres(alquileres);
    const contador = `<div class="filter-count" style="margin-bottom:10px">Mostrando <b>${alquileres.length}</b> de ${total} propiedades</div>`;
    if (!alquileres.length) return contador + App.emptyState("Sin resultados","Ninguna propiedad coincide con los filtros. Probá ampliarlos.",null,null);
    return contador + `
      <div class="table-wrap"><table>
        <thead><tr><th>Código</th><th>Propiedad</th><th>Valor alquiler</th><th>Contrato</th><th>Vigencia</th><th>Actualización</th><th>Agua cal.</th><th>Reparac.</th><th>Drive</th><th></th></tr></thead>
        <tbody>
          ${alquileres.map(p=>{
            const c = DB.contracts.find(c=>c.propId===p.id && contratoActivo(c))
                   || DB.contracts.find(c=>c.propId===p.id);
            const est = c ? estadoContrato(c) : null;
            const diasFin = (c && c.fin) ? daysBetween(today, c.fin) : null;
            return `<tr>
              <td><span class="code-tag">${esc(p.codigo||"—")}</span></td>
              <td><div class="t-strong">${esc(p.titulo)}</div><div class="t-muted">${esc(p.direccion)}</div>
                  ${c?`<div class="t-muted">Inquilino: ${esc(c.inquilino||"—")}</div>`:""}</td>
              <td class="t-strong">${fmt(p.valorAlquiler,p.monedaAlquiler)}<div class="t-muted">por mes</div></td>
              <td>${c?App.contractBadge(est):'<span class="badge gray">Sin contrato</span>'}</td>
              <td>${c && c.inicio
                    ? `<div>${fdate(c.inicio)}</div><div class="t-muted">al ${fdate(c.fin)}</div>
                       ${(diasFin!=null && diasFin>=0 && diasFin<=90 && est==="Vigente")?`<div class="t-muted" style="color:var(--amber)">vence en ${diasFin} días</div>`:""}`
                    : '<span class="t-muted">—</span>'}</td>
              <td>cada ${(c&&c.actualizaCada)||p.actualizaCada||"—"} meses<div class="t-muted">índice ${esc((c&&c.indice)||p.indice||"—")}</div></td>
              <td>${p.aguaCaliente?`${p.aguaCaliente==="Termotanque"?I.flame:""} ${esc(p.aguaCaliente)}`:"—"}</td>
              <td>${(()=>{ const rs=p.reparaciones||[]; const pe=rs.filter(x=>!x.fechaRep).length;
                    if (!rs.length) return '<span class="t-muted">—</span>';
                    return pe?`<span class="badge red"><span class="dot"></span>${pe} pend.</span>`:`<span class="badge green"><span class="dot"></span>${rs.length}</span>`; })()}</td>
              <td><a class="drive-link" href="${esc(p.drive)}" target="_blank">${I.drive} Abrir</a></td>
              <td><div class="row-actions">
                <button class="icon-btn" title="Ver" onclick="Prop.view(${p.id})">${I.eye}</button>
                ${can()?`<button class="icon-btn" title="Reparaciones" onclick="Repar.list(${p.id})">${I.tool}</button>`:""}
                ${c?`<button class="icon-btn" title="Contrato" onclick="Contract.view(${c.id})">${I.contract}</button>`:`<button class="icon-btn" title="Cargar contrato" onclick="Contract.form(null,${p.id})">${I.plus}</button>`}
              </div></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>`;
  },

  /* ---------- Helpers UI ---------- */
  alarmRow(a){
    const colores = { red:"var(--red)", amber:"var(--amber)", blue:"var(--brand)", green:"var(--green)" };
    const col = colores[a.level] || "var(--ink-soft)";
    return `
      <div style="display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)">
        <div style="color:${col};flex-shrink:0;margin-top:2px">${a.icon||I.bell}</div>
        <div style="flex:1;min-width:0">
          <div class="t-strong">${a.title}</div>
          <div class="t-muted" style="margin-top:2px">${a.desc||""}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
          <span class="badge ${a.level==='red'?'red':(a.level==='amber'?'amber':'blue')}"><span class="dot"></span>${a.when||""}</span>
          ${a.action?`<button class="btn btn-sm btn-primary" onclick="${a.action}">${a.actionLabel||"Registrar"}</button>`:""}
        </div>
      </div>`;
  },

  emptyState(title,desc,btnLabel,btnAction){
    return `<div class="card"><div class="empty">
      <div class="ic">${I.empty}</div><h4>${title}</h4><p>${desc}</p>
      ${btnLabel?`<button class="btn btn-primary" onclick="${btnAction}">${I.plus} ${btnLabel}</button>`:""}
    </div></div>`;
  },
  opBadge(s){ const m={"Disponible":"green","Reservada":"amber","Con seña":"amber","Vendida":"gray"}; return `<span class="badge ${m[s]||'gray'}"><span class="dot"></span>${s||"—"}</span>`; },
  visorVe(p,k){ const vc=p.visorCampos; return vc==null ? true : !!vc[k]; },
  contractBadge(s){ const m={"Vigente":"green","A comenzar":"blue","Por vencer":"amber","Finalizado":"gray","Rescindido":"red"}; return `<span class="badge ${m[s]||'gray'}"><span class="dot"></span>${s||"—"}</span>`; },
};
