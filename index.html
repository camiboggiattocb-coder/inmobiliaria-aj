  guardar(leadId){
    const l = DB.leads.find(x=>x.id===leadId);
    const g = k => document.getElementById('ag_'+k)?.value || "";
    const gf = k => Fechas.get('ag_'+k);   // fechas como aaaa-mm-dd
    const obs = g('obs').trim();
    const nuevoEstado = g('estado');
    const fecha = gf('fecha') || today;
    const proxima = gf('proxima');
    const proxNota = g('proxNota').trim();

    // guardar en el historial de contactos
    l.historial = l.historial || [];
    l.historial.unshift({
      fecha,
      accion: l.proxNota || "Contacto",
      resultado: obs,
      estadoDesde: l.estado,
      estadoHasta: nuevoEstado,
    });

    l.estado = nuevoEstado;
    l.fecha = fecha;                       // último contacto
    if (obs) l.nota = obs;                 // la nota visible pasa a ser lo último que se registró
    l.proxima = proxima || null;           // nueva acción agendada (o ninguna)
    l.proxNota = proxima ? proxNota : "";
    l.accionHecha = !proxima;              // si no hay próxima acción, no queda nada pendiente

    persist('leads', l);
    App.go(STATE.page);
    setTimeout(()=>{
      if (proxima) alert(`Acción registrada.\nPróxima acción agendada para el ${fdate(proxima)}.`);
      else alert("Acción registrada. No quedó ninguna acción pendiente para este interesado.");
    },100);
  },
};

/* ============================================================
   TABLERO DE RESUMEN — indicadores para tomar decisiones
   ============================================================ */
const Reportes = {
  periodo: "mes",   // mes | trimestre | semestre | anio
  offset: 0,        // 0 = período actual, -1 = anterior, etc.

  // Devuelve {desde, hasta, label} del período elegido
  rango(){
    const hoy = new Date(today+"T12:00:00");
    let desde, hasta, label;
    const anio = hoy.getFullYear();
    const mes = hoy.getMonth(); // 0-11
    const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

    if (Reportes.periodo === "mes") {
      const d = new Date(anio, mes + Reportes.offset, 1);
      desde = new Date(d.getFullYear(), d.getMonth(), 1);
      hasta = new Date(d.getFullYear(), d.getMonth()+1, 0);
      label = `${meses[d.getMonth()]} ${d.getFullYear()}`;
    } else if (Reportes.periodo === "trimestre") {
      const trimActual = Math.floor(mes/3);
      const d = new Date(anio, (trimActual + Reportes.offset)*3, 1);
      desde = new Date(d.getFullYear(), d.getMonth(), 1);
      hasta = new Date(d.getFullYear(), d.getMonth()+3, 0);
      label = `${Math.floor(d.getMonth()/3)+1}° trimestre ${d.getFullYear()}`;
    } else if (Reportes.periodo === "semestre") {
      const semActual = Math.floor(mes/6);
      const d = new Date(anio, (semActual + Reportes.offset)*6, 1);
      desde = new Date(d.getFullYear(), d.getMonth(), 1);
      hasta = new Date(d.getFullYear(), d.getMonth()+6, 0);
      label = `${Math.floor(d.getMonth()/6)+1}° semestre ${d.getFullYear()}`;
    } else { // año
      const a = anio + Reportes.offset;
      desde = new Date(a, 0, 1);
      hasta = new Date(a, 11, 31);
      label = `Año ${a}`;
    }
    return { desde: isoDate(desde), hasta: isoDate(hasta), label };
  },

  enRango(fecha, r){
    if (!fecha) return false;
    return fecha >= r.desde && fecha <= r.hasta;
  },

  /* ---------- CÁLCULO DE TODOS LOS INDICADORES ---------- */
  calcular(){
    const r = Reportes.rango();
    const props = DB.properties;
    const leads = DB.leads;
    const contratos = DB.contracts;

    // --- VENTAS ---
    const vendidasPeriodo = props.filter(p => esVendida(p) && Reportes.enRango(p.fechaVenta || p.fechaPub, r));
    const vendidasTotal = props.filter(p => esVendida(p));
    // comisión de venta = precio * %
    // comisión sobre el valor REAL de cierre (si existe); si no, sobre el publicado
    const monedaVta = p => p.monedaCierre || p.monedaVenta;
    const valorVta = p => (p.valorCierre!=null ? p.valorCierre : p.valorVenta) || 0;
    const comisionDe = p => {
      if (p.comisionCierre!=null) return p.comisionCierre;
      return (valorVta(p) && p.comision) ? Math.round(valorVta(p) * p.comision/100) : 0;
    };
    const comVentasUSD = vendidasPeriodo.filter(p=>monedaVta(p)==="USD").reduce((s,p)=>s+comisionDe(p),0);
    const comVentasARS = vendidasPeriodo.filter(p=>monedaVta(p)!=="USD").reduce((s,p)=>s+comisionDe(p),0);
    // publicado vs cerrado (de las ventas del período que tienen valor de cierre)
    const conCierre = vendidasPeriodo.filter(p=>p.valorCierre!=null);
    const totalPublicadoUSD = conCierre.filter(p=>p.monedaVenta==="USD").reduce((s,p)=>s+(p.valorVenta||0),0);
    const totalCerradoUSD   = conCierre.filter(p=>monedaVta(p)==="USD").reduce((s,p)=>s+(p.valorCierre||0),0);
    const totalPublicadoARS = conCierre.filter(p=>p.monedaVenta!=="USD").reduce((s,p)=>s+(p.valorVenta||0),0);
    const totalCerradoARS   = conCierre.filter(p=>monedaVta(p)!=="USD").reduce((s,p)=>s+(p.valorCierre||0),0);

    // cartera activa (en venta, sin vender)
    const enVenta = props.filter(p=>p.enVenta && !esVendida(p));
    const carteraUSD = enVenta.filter(p=>p.monedaVenta==="USD").reduce((s,p)=>s+(p.valorVenta||0),0);
    const carteraARS = enVenta.filter(p=>p.monedaVenta!=="USD").reduce((s,p)=>s+(p.valorVenta||0),0);
    // comisiones potenciales si se vendiera toda la cartera
    const potUSD = enVenta.filter(p=>p.monedaVenta==="USD").reduce((s,p)=>s+comisionDe(p),0);
    const potARS = enVenta.filter(p=>p.monedaVenta!=="USD").reduce((s,p)=>s+comisionDe(p),0);

    // días promedio de publicación (de las que siguen en venta)
    const conFecha = enVenta.filter(p=>p.fechaPub);
    const diasProm = conFecha.length
      ? Math.round(conFecha.reduce((s,p)=>s+daysBetween(p.fechaPub, today),0)/conFecha.length)
      : 0;

    // --- ALQUILERES ---
    const contratosNuevos = contratos.filter(c => Reportes.enRango(c.inicio, r));
    // comisión de alquiler = el monto de comisión cobrado (un mes)
    const comAlqCobrada = contratos.reduce((s,c)=>{
      const pagos = (c.depositoPagos||[]).filter(x=>Reportes.enRango(x.fecha, r));
      return s + pagos.reduce((ss,x)=>ss+(x.monto||0),0);
    },0);

    const activos = contratos.filter(c=>estadoContrato(c)==="Vigente");
    const aComenzar = contratos.filter(c=>estadoContrato(c)==="A comenzar");
    const porVencer = contratos.filter(c=>{
      if (estadoContrato(c)!=="Vigente" || !c.fin) return false;
      const dd = daysBetween(today, c.fin);
      return dd>=0 && dd<=90;
    });

    // --- COBRANZA Y MOROSIDAD (del período) ---
    let esperado=0, cobrado=0, moraCobrada=0;
    let cuotasImpagas=0, montoImpago=0;
    contratos.forEach(c=>{
      (c.cuotas||[]).forEach(q=>{
        const fechaMes = q.mes+"-01";
        const dentro = Reportes.enRango(fechaMes, r);
        if (dentro) {
          esperado += (q.monto||0);
          if (q.pagado) {
            cobrado += (q.monto||0) + (q.ajuste||0) + (q.moraTotal||0);
            moraCobrada += (q.moraTotal||0);
          } else {
            // ¿está vencida?
            if (daysBetween(q.mes+"-10", today) > 0) { cuotasImpagas++; montoImpago += (q.monto||0); }
          }
        }
      });
    });
    const pctCobrado = esperado>0 ? Math.round((cobrado/esperado)*100) : 0;

    // morosidad general (todas las cuotas vencidas impagas, sin importar período)
    let morososTotal=0, montoMorosoTotal=0;
    contratos.forEach(c=>{
      (c.cuotas||[]).forEach(q=>{
        if (!q.pagado && daysBetween(q.mes+"-10", today) > 0) { morososTotal++; montoMorosoTotal += (q.monto||0); }
      });
    });

    // --- REPARACIONES ---
    // se cuentan las reparadas dentro del período (por fecha de reparación)
    let repCosto=0, repProp=0, repInq=0, repCant=0, repPendientes=0;
    props.forEach(p=>{
      (p.reparaciones||[]).forEach(rp=>{
        if (!rp.fechaRep) { if (p.enAlquiler) repPendientes++; return; }
        if (!Reportes.enRango(rp.fechaRep, r)) return;
        repCant++;
        const c = rp.costo||0;
        repCosto += c;
        if (rp.pagaQuien==="Propietario") repProp += c;
        else if (rp.pagaQuien==="Inquilino") repInq += c;
      });
    });

    // --- INTERESADOS ---
    const leadsPeriodo = leads.filter(l=>Reportes.enRango(l.creado || l.fecha, r));
    const porEstado = est => leads.filter(l=>l.estado===est).length;
    const activosLeads = leads.filter(l=>l.estado!=="Descartado").length;
    const accionesPendientes = leads.filter(l=>l.proxima && !l.accionHecha && l.estado!=="Descartado").length;
    const accionesAtrasadas = leads.filter(l=>l.proxima && !l.accionHecha && l.estado!=="Descartado" && daysBetween(today,l.proxima)<0).length;
    // conversión: interesados que terminaron en propiedad vendida
    const leadsDeVendidas = leads.filter(l=>{ const p=prop(l.propId); return p && esVendida(p); }).length;
    const conversion = leads.length ? Math.round((leadsDeVendidas/leads.length)*100) : 0;

    return {
      r,
      // ventas
      vendidasPeriodo: vendidasPeriodo.length, vendidasTotal: vendidasTotal.length,
      comVentasUSD, comVentasARS, enVenta: enVenta.length,
      totalPublicadoUSD, totalCerradoUSD, totalPublicadoARS, totalCerradoARS, conCierre: conCierre.length,
      carteraUSD, carteraARS, potUSD, potARS, diasProm,
      // alquileres
      contratosNuevos: contratosNuevos.length, comAlqCobrada,
      activos: activos.length, aComenzar: aComenzar.length, porVencer: porVencer.length,
      porVencerLista: porVencer,
      // cobranza
      esperado, cobrado, pctCobrado, moraCobrada,
      cuotasImpagas, montoImpago, morososTotal, montoMorosoTotal,
      repCosto, repProp, repInq, repCant, repPendientes,
      // interesados
      leadsNuevos: leadsPeriodo.length, activosLeads,
      nuevos: porEstado("Nuevo"), contactados: porEstado("Contactado"),
      visitas: porEstado("Visita agendada"), negociando: porEstado("Negociando"),
      descartados: porEstado("Descartado"),
      accionesPendientes, accionesAtrasadas, conversion,
    };
  },

            const p = prop(c.propId);

                   <div class="t-muted">${esc(c.inquilino)} · vence el ${fdate(c.fin)}</div></div>
              <div style="display:flex;gap:8px;align-items:center">

      <!-- REPARACIONES -->

          const max = Math.max(d.nuevos,d.contactados,d.visitas,d.negociando,d.descartados,1);
          const pct = Math.round((n/max)*100);
          return `<div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px">
              <span>${lbl}</span><b>${n}</b>
            </div>
            <div style="background:var(--line);border-radius:5px;height:7px;overflow:hidden">
              <div style="background:${col};height:100%;width:${pct}%"></div>
            </div>
          </div>`;
        }).join("")}
      </div>
    `;
  },

  setPeriodo(p){ Reportes.periodo = p; Reportes.offset = 0; App.go('reports'); },
  mover(n){ if (Reportes.offset + n > 0) return; Reportes.offset += n; App.go('reports'); },
  hoy(){ Reportes.offset = 0; App.go('reports'); },
};

/* ============================================================
   HISTORIAL DE VALORES DEL ALQUILER
   Permite corregir, agregar o borrar registros del historial.
   Útil para arreglar datos cargados con errores.
   ============================================================ */
const HistVal = {
  form(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const editando = idx != null;
    const h = editando ? c.histValores[idx] : { desde: today, valor: c.valor };
    Modal.open(editando?"Editar registro del historial":"Agregar registro al historial", `
      <div class="notice">${I.info}<div>${editando
        ? "Corregí la fecha o el monto de este registro. Sirve para arreglar datos que se cargaron mal."
        : "Agregá una actualización que no había quedado registrada en el sistema."}</div></div>
      <div class="form-row">
        <div class="field"><label>Rige desde</label>
          ${dateInput('hv_desde', h.desde||today)}
          <div class="hint">Fecha en que este valor empezó a regir.</div></div>
        <div class="field"><label>Valor del alquiler (${esc(c.moneda)})</label>
          <input id="hv_valor" type="number" value="${h.valor||""}"></div>
      </div>
      ${editando?`<div class="hint">Guardado hoy en la base como: <b>${esc(h.desde)}</b> (formato interno año-mes-día).</div>`:""}
    `, `<button class="btn" onclick="Contract.view(${contractId})">Cancelar</button>
        <button class="btn btn-primary" onclick="HistVal.guardar(${contractId},${editando?idx:'null'})">${editando?'Guardar cambios':'Agregar'}</button>`);
  },

  guardar(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const desde = Fechas.get('hv_desde');
    const valor = parseFloat(document.getElementById('hv_valor').value)||0;
    if (!desde) { alert("Poné la fecha desde la que rige."); return; }
    if (valor<=0) { alert("Poné un valor válido."); return; }

    c.histValores = c.histValores || [];
    if (idx != null) c.histValores[idx] = { desde, valor };
    else c.histValores.push({ desde, valor });

    // ordenar por fecha (del más viejo al más nuevo)
    c.histValores.sort((a,b)=> a.desde < b.desde ? -1 : (a.desde > b.desde ? 1 : 0));

    // el valor vigente del contrato es el del último registro que ya empezó a regir
    HistVal.sincronizarValor(c);

    persist('contracts', c);
    const p = prop(c.propId);
    if (p) { p.valorAlquiler = c.valor; persist('properties', p); }
    Contract.view(contractId);
  },

  eliminar(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const h = c.histValores[idx];
    if (!confirm(`¿Eliminar el registro de ${fmt(h.valor,c.moneda)} desde el ${fdate(h.desde)}?`)) return;
    c.histValores.splice(idx,1);
    HistVal.sincronizarValor(c);
    persist('contracts', c);
    const p = prop(c.propId);
    if (p) { p.valorAlquiler = c.valor; persist('properties', p); }
    Contract.view(contractId);
  },

  // El valor vigente = el del registro más reciente que YA empezó a regir.
  // Además se recalcula la próxima actualización a partir del último registro,
  // para que la fecha no quede desfasada respecto del historial.
  sincronizarValor(c){
    const hist = (c.histValores||[]).slice().sort((a,b)=> a.desde < b.desde ? -1 : 1);
    const vigentes = hist.filter(h=>h.desde <= today);
    if (vigentes.length) c.valor = vigentes[vigentes.length-1].valor;
    if (hist.length) {
      const cada = c.actualizaCada || 3;
      let prox = addMonths(hist[hist.length-1].desde, cada);
      let vueltas = 0;
      while (daysBetween(today, prox) < 0 && vueltas < 120) { prox = addMonths(prox, cada); vueltas++; }
      c.proxActualiz = prox;
    }
  },
};

/* ============================================================
   CAPA FIREBASE — autenticación, carga y persistencia
   ============================================================ */

// Mapa de colecciones de Firestore <-> arrays locales de DB
const COLECCIONES = {
  properties: "propiedades",
  leads: "interesados",
  contracts: "contratos",
};

const Auth = {
  // Dominio interno: el usuario NO lo ve ni lo escribe. Se agrega solo.
  DOMINIO: "@aj.com",
  async login(){
    let usuario = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errBox = document.getElementById('loginError');
    errBox.textContent = "";
    if (!usuario || !pass) { errBox.textContent = "Completá usuario y contraseña."; return; }
    // Si la persona escribió solo el usuario, le agregamos el dominio interno.
    // (Si por costumbre escribiera el correo completo, lo respetamos.)
    const email = usuario.includes("@") ? usuario : usuario + Auth.DOMINIO;
    try {
      await fbAuth.signInWithEmailAndPassword(email, pass);
      // el onAuthStateChanged se encarga del resto
    } catch(e) {
      const msg = {
        'auth/invalid-email':'El usuario no es válido.',
        'auth/user-not-found':'No existe ese usuario.',
        'auth/wrong-password':'Contraseña incorrecta.',
        'auth/invalid-credential':'Usuario o contraseña incorrectos.',
        'auth/too-many-requests':'Demasiados intentos. Esperá unos minutos.',
      }[e.code] || 'No se pudo iniciar sesión. Revisá los datos.';
      errBox.textContent = msg;
    }
  },
  async logout(){
    await fbAuth.signOut();
    location.reload();
  }
};

// Guardar (crear o actualizar) un item en Firestore.
// arrayName: 'properties' | 'leads' | 'contracts'
async function persist(arrayName, item){
  try {
    const col = COLECCIONES[arrayName];
    if (!col || !item) return;
    await fbDB.collection(col).doc(String(item.id)).set(JSON.parse(JSON.stringify(item)));
  } catch(e){
    console.error("Error al guardar en Firebase:", e);
    alert("No se pudo guardar el cambio en la nube. Revisá tu conexión.");
  }
}

// Eliminar un item de Firestore
async function persistDelete(arrayName, id){
  try {
    const col = COLECCIONES[arrayName];
    if (!col) return;
    await fbDB.collection(col).doc(String(id)).delete();
  } catch(e){
    console.error("Error al eliminar en Firebase:", e);
  }
}

// Guardar los contadores (nextId / nextCodigo) para que no se repitan
async function persistMeta(){
  try {
    await fbDB.collection("meta").doc("contadores").set({
      nextId: DB.nextId, nextCodigo: DB.nextCodigo
    });
  } catch(e){ console.error("Error guardando contadores:", e); }
}

// Cargar todos los datos desde Firestore al objeto DB local
async function cargarDatos(){
  // Propiedades
  const propsSnap = await fbDB.collection("propiedades").get();
  DB.properties = propsSnap.docs.map(d=>d.data());
  // Interesados
  const leadsSnap = await fbDB.collection("interesados").get();
  DB.leads = leadsSnap.docs.map(d=>d.data());
  // Contratos
  const contractsSnap = await fbDB.collection("contratos").get();
  DB.contracts = contractsSnap.docs.map(d=>d.data());
  // Contadores
  const metaDoc = await fbDB.collection("meta").doc("contadores").get();
  if (metaDoc.exists) {
    const m = metaDoc.data();
    DB.nextId = m.nextId || DB.nextId;
    DB.nextCodigo = m.nextCodigo || DB.nextCodigo;
  } else {
    // primera vez: calcular contadores a partir de lo que haya
    const maxId = arr => arr.reduce((mx,x)=>Math.max(mx,x.id||0),0);
    DB.nextId = {
      properties: maxId(DB.properties)+1,
      leads: maxId(DB.leads)+1,
      contracts: maxId(DB.contracts)+1,
    };
    DB.nextCodigo = DB.properties.reduce((mx,p)=>{
      const n = p.codigo ? parseInt(String(p.codigo).replace(/\D/g,''))||0 : 0;
      return Math.max(mx,n);
    },0) + 1;
  }
}

// Leer el rol del usuario logueado desde la colección "usuarios"
async function cargarRolUsuario(uid){
  const doc = await fbDB.collection("usuarios").doc(uid).get();
  if (!doc.exists) return null;
  return doc.data(); // { rol: 'admin'|'sales'|'rentals'|'viewer', nombre: '...' }
}

// Punto de entrada: reacciona al login/logout
fbAuth.onAuthStateChanged(async (user)=>{
  const loginScreen = document.getElementById('loginScreen');
  const bootLoader = document.getElementById('bootLoader');
  if (!user) {
    // no logueado: mostrar login
    loginScreen.style.display = "flex";
    bootLoader.style.display = "none";
    return;
  }
  // logueado: ocultar login, mostrar loader, cargar todo
  loginScreen.style.display = "none";
  bootLoader.style.display = "flex";
  try {
    const perfil = await cargarRolUsuario(user.uid);
    if (!perfil || !perfil.rol) {
      bootLoader.style.display = "none";
      await fbAuth.signOut();
      loginScreen.style.display = "flex";
      document.getElementById('loginError').textContent =
        "Tu cuenta no tiene un rol asignado. Pedile al administrador que lo configure.";
      return;
    }
    STATE.usuario = { uid:user.uid, email:user.email, nombre:perfil.nombre||user.email, rol:perfil.rol };
    await cargarDatos();
    bootLoader.style.display = "none";
    // arrancar la app con el rol real del usuario
    App.initFirebase(perfil.rol);
  } catch(e){
    console.error(e);
    bootLoader.style.display = "none";
    alert("Hubo un problema al cargar el sistema. Revisá tu conexión e intentá de nuevo.");
  }
});
</script>
