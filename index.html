      <div class="form-row"><div class="field"><label>Inquilino</label><input id="c_inquilino" value="${esc(v('inquilino'))}"></div>
        <div class="field"><label>Garante 1</label><input id="c_garante" value="${esc(v('garante'))}"></div></div>
      <div class="form-row one"><div class="field"><label>Garante 2 (opcional)</label><input id="c_garante2" value="${esc(v('garante2'))}"></div></div>
      <div class="form-row"><div class="field"><label>Inicio</label><input id="c_inicio" type="date" value="${esc(v('inicio'))}"></div>
        <div class="field"><label>Fin</label><input id="c_fin" type="date" value="${esc(v('fin'))}"></div></div>
      <div class="form-row"><div class="field"><label>Valor mensual</label><input id="c_valor" type="number" value="${esc(v('valor'))}"></div>
        <div class="field"><label>Moneda</label><select id="c_moneda"><option ${optSel(v('moneda','ARS'),'ARS')}>ARS</option><option ${optSel(v('moneda'),'USD')}>USD</option></select></div></div>
      <div class="form-row"><div class="field"><label>Actualiza cada (meses)</label><input id="c_cada" type="number" value="${esc(v('actualizaCada',3))}"></div>
        <div class="field"><label>Índice</label><select id="c_indice">${["ICL","IPC","Otro"].map(o=>`<option ${optSel(v('indice'),o)}>${o}</option>`).join("")}</select></div></div>
      <div class="form-row"><div class="field"><label>Comisión (monto total)</label><input id="c_deposito" type="number" value="${esc(v('deposito'))}">
          <div class="hint">Equivale a un mes de alquiler. El cobro (en una o varias cuotas) se registra dentro del contrato.</div></div>
        <div class="field"><label>Tipo de garantía</label><select id="c_garantia">${["Recibo de sueldo","Garantía propietaria","Seguro de caución"].map(o=>`<option ${optSel(v('garantia'),o)}>${o}</option>`).join("")}</select></div></div>
      ${id?`<div class="form-row"><div class="field"><label>Próxima actualización</label><input id="c_prox" type="date" value="${esc(v('proxActualiz'))}"></div>
        <div class="field"><label>Estado del contrato</label><select id="c_estado">${["Vigente","Por vencer","Finalizado","Rescindido"].map(o=>`<option ${optSel(v('estado'),o)}>${o}</option>`).join("")}</select></div></div>`:''}
      <div class="form-section" style="margin-top:4px">
        <h4>${I.pdf} Contrato firmado</h4>
        <div class="file-drop ${v('pdfNombre')?'has-file':''}" id="c_drop" onclick="document.getElementById('c_pdf').click()">
          <div class="file-row">${I.pdf} <span id="c_pdfLabel">${v('pdfNombre')?'✓ '+esc(v('pdfNombre')):'Subir contrato escaneado (PDF)'}</span></div>
        </div>
        <input type="file" id="c_pdf" accept="application/pdf" style="display:none" onchange="Contract.onPdf()">
        <div class="hint" style="margin-top:8px">${v('pdfNombre')?'Ya hay un PDF adjunto. Podés reemplazarlo subiendo otro.':'Adjuntá el contrato firmado escaneado.'} En el prototipo el archivo no se almacena; se muestra el nombre como demostración.</div>
      </div>
    `, `<button class="btn" onclick="${id?`Contract.view(${id})`:'Modal.close()'}">Cancelar</button><button class="btn btn-primary" onclick="Contract.save(${id||'null'})">${id?'Guardar cambios':'Crear contrato'}</button>`);
    // preservar nombre de PDF existente si no se cambia
    if (id && c.pdfNombre) document.getElementById('c_drop')._name = c.pdfNombre;
  },
  onPdf(){
    const f = document.getElementById('c_pdf').files[0];
    if (f) { const d=document.getElementById('c_drop'); d.classList.add('has-file');
      document.getElementById('c_pdfLabel').textContent = "✓ "+f.name; d._name=f.name; }
  },
  save(id){
    const g = k=>{ const el=document.getElementById('c_'+k); return el?el.value:""; };
    if (!g('inquilino')) { alert("Poné el nombre del inquilino."); return; }
    const pdfName = document.getElementById('c_drop')._name || null;
    if (id) {
      const c = DB.contracts.find(c=>c.id===id);
      Object.assign(c, {
        inquilino:g('inquilino'), garante:g('garante'), garante2:g('garante2'), inicio:g('inicio'), fin:g('fin'),
        valor:parseFloat(g('valor'))||0, moneda:g('moneda'), actualizaCada:parseInt(g('cada'))||3,
        indice:g('indice'), deposito:parseFloat(g('deposito'))||0, garantia:g('garantia'),
        proxActualiz:g('prox')||c.proxActualiz, estado:g('estado')||c.estado, pdfNombre:pdfName
      });
      persist('contracts', c);
      Contract.view(id);
    } else {
      const propId = parseInt(g('prop'));
      const nuevo = {
        id:DB.nextId.contracts++, propId, inquilino:g('inquilino'), garante:g('garante'), garante2:g('garante2'),
        inicio:g('inicio'), fin:g('fin'), valor:parseFloat(g('valor'))||0, moneda:g('moneda'),
        actualizaCada:parseInt(g('cada'))||3, indice:g('indice'), deposito:parseFloat(g('deposito'))||0,
        garantia:g('garantia'), proxActualiz: g('inicio')?addMonths(g('inicio'),parseInt(g('cada'))||3):null,
        estado:"Vigente", pdfNombre:pdfName, cuotas:[],
        depositoPagos:[], adelanto:null, histValores: g('inicio')?[{desde:g('inicio'), valor:parseFloat(g('valor'))||0}]:[]
      };
      DB.contracts.push(nuevo);
      persist('contracts', nuevo);
      persistMeta();
      Modal.close(); App.go('contracts');
    }
  },

  view(id){
    const c = DB.contracts.find(c=>c.id===id);
    const p = prop(c.propId);
    const item = (k,v)=>`<div class="detail-item"><div class="k">${k}</div><div class="v">${v}</div></div>`;
    const depPagado = (c.depositoPagos||[]).reduce((s,x)=>s+x.monto,0);
    const depFalta = (c.deposito||0) - depPagado;
    const body = `
      ${can()?`<div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn btn-sm" onclick="Contract.form(${c.id})">${I.edit} Editar contrato</button></div>`:""}
      <div class="detail-grid">
        ${item("Propiedad",esc(p?.titulo||"—"))}${item("Inquilino",esc(c.inquilino))}
        ${item("Garante 1",esc(c.garante||"—"))}${item("Garante 2",esc(c.garante2||"—"))}
        ${item("Vigencia",`${fdate(c.inicio)} al ${fdate(c.fin)}`)}
        ${item("Valor actual",`${fmt(c.valor,c.moneda)} ${can()?`<button class="btn btn-sm" style="margin-left:8px;padding:3px 9px" onclick="Actualiz.form(${c.id})">${I.money} Actualizar</button>`:""}`)}
        ${item("Actualización",`cada ${c.actualizaCada}m · ${esc(c.indice)} · próx. ${fdate(c.proxActualiz)}`)}
        ${item("Garantía",esc(c.garantia||"—"))}
        ${item("Estado",App.contractBadge(c.estado))}
        ${item("Contrato firmado", c.pdfNombre?`<span class="badge green"><span class="dot"></span>${esc(c.pdfNombre)}</span>`:'<span class="t-muted">No adjuntado</span>')}
      </div>
      ${(c.histValores&&c.histValores.length>1)?`<div class="section"><div class="k" style="font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:8px">Historial de valores del alquiler</div><ul class="timeline">${c.histValores.slice().reverse().map(h=>`<li>Desde ${fdate(h.desde)} — ${fmt(h.valor,c.moneda)}</li>`).join("")}</ul></div>`:""}

      <div class="section"><div class="section-head"><h3>Comisión</h3>
        ${can()?`<button class="btn btn-sm" onclick="Deposito.form(${c.id})">${I.plus} Registrar pago</button>`:""}</div>
        <div class="card" style="padding:16px">
          <div class="detail-grid">
            ${item("Monto total", fmt(c.deposito,c.moneda))}
            ${item("Pagado", `${fmt(depPagado,c.moneda)} ${depFalta<=0?'<span class="badge green"><span class="dot"></span>Completo</span>':`<span class="badge amber"><span class="dot"></span>Falta ${fmt(depFalta,c.moneda)}</span>`}`)}
          </div>
          ${(c.depositoPagos&&c.depositoPagos.length)?`<div style="margin-top:14px"><div class="k" style="font-size:11.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:8px">Pagos registrados</div><ul class="timeline">${c.depositoPagos.map(x=>`<li>${fdate(x.fecha)} — ${fmt(x.monto,c.moneda)}</li>`).join("")}</ul></div>`:'<div class="hint" style="margin-top:10px">Sin pagos de la comisión registrados.</div>'}
        </div>
      </div>

      <div class="section"><div class="section-head"><h3>Alquiler adelantado</h3>
        ${(can()&&!c.adelanto)?`<button class="btn btn-sm" onclick="Adelanto.form(${c.id})">${I.plus} Registrar adelanto</button>`:""}</div>
        <div class="card" style="padding:16px">
          ${c.adelanto?`<div class="detail-grid">
            ${item("Monto", fmt(c.adelanto.monto,c.moneda))}
            ${item("Fecha de cobro", fdate(c.adelanto.fecha))}
            ${item("Concepto", esc(c.adelanto.nota||"Alquiler adelantado"))}
          </div>${can()?`<button class="btn btn-sm" style="margin-top:12px" onclick="Adelanto.quitar(${c.id})">Quitar adelanto</button>`:""}`
          :'<div class="hint">No se registró alquiler adelantado en este contrato (es opcional).</div>'}
        </div>
      </div>

      <div class="section"><div class="section-head"><h3>Cobros y cuotas</h3>
        ${can()?`<div class="row-actions"><button class="btn btn-sm" onclick="Cobro.addCuota(${c.id})">${I.plus} Mes actual</button><button class="btn btn-sm" onclick="Cobro.addCuota(${c.id},true)">${I.cal} Mes futuro</button></div>`:""}</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Mes</th><th>Alquiler</th><th>Estado</th><th>Pago</th><th>Ajuste</th><th>Mora</th><th>Total</th><th></th></tr></thead>
          <tbody>
            ${(c.cuotas||[]).map((q,i)=>{
              let estadoCuota, moraCalc=q.moraTotal||0, ajuste=q.ajuste||0, total=q.monto+ajuste+(q.moraTotal||0);
              if (q.pagado) {
                const anticipado = daysBetween(today, q.mes+"-01") > 0;
                estadoCuota = (q.moraTotal>0)?'<span class="badge amber"><span class="dot"></span>Pagada c/mora</span>':(anticipado?'<span class="badge blue"><span class="dot"></span>Anticipado</span>':'<span class="badge green"><span class="dot"></span>Pagada</span>');
              } else {
                const dd = daysBetween(q.mes+"-10", today);
                estadoCuota = dd>0?`<span class="badge red"><span class="dot"></span>Vencida (${dd}d)</span>`:'<span class="badge gray">Pendiente</span>';
                total = q.monto;
              }
              return `<tr><td class="t-strong">${q.mes}</td><td>${fmt(q.monto,c.moneda)}</td><td>${estadoCuota}</td>
                <td>${q.pagado?fdate(q.fechaPago):"—"}</td>
                <td>${(q.pagado&&ajuste)?`<span title="${esc(q.ajusteNota||'')}" style="cursor:help;border-bottom:1px dotted var(--ink-soft)">${ajuste>0?'+':''}${fmt(ajuste,c.moneda)}</span>`:"—"}</td>
                <td>${moraCalc>0?fmt(moraCalc,c.moneda):"—"}</td>
                <td class="t-strong">${fmt(total,c.moneda)}</td>
                <td><div class="row-actions">
                  ${(!q.pagado&&can())?`<button class="btn btn-sm btn-primary" onclick="Cobro.form(${c.id},${i})">Cobrar</button>`:""}
                  ${can()?`<button class="icon-btn" title="Editar mes" onclick="Cobro.editCuota(${c.id},${i})">${I.edit}</button>`:""}
                  ${can()?`<button class="icon-btn" title="Eliminar mes" onclick="Cobro.delCuota(${c.id},${i})">${I.trash}</button>`:""}
                </div></td></tr>`;
            }).join("")||`<tr><td colspan="8" class="t-muted" style="text-align:center;padding:20px">Sin cuotas. Agregá el primer mes.</td></tr>`}
          </tbody>
        </table></div>
        <div class="hint" style="margin-top:8px">La mora se habilita cuando la fecha de pago supera el día 10. El ajuste (positivo o negativo, con aclaración) no modifica el alquiler base. Pasá el cursor sobre un ajuste para ver el motivo.</div>
      </div>`;
    Modal.open(`Contrato — ${esc(c.inquilino)}`, body,
      `${can()?`<button class="btn" onclick="Contract.form(${c.id})">${I.edit} Editar contrato</button>`:""}<button class="btn" onclick="Modal.close()">Cerrar</button>`, true);
  }
};

/* ---------- Cobro de cuota ---------- */
const Cobro = {
  addCuota(contractId, futuro){
    const c = DB.contracts.find(c=>c.id===contractId);
    const last = (c.cuotas||[]).slice(-1)[0];
    let mes;
    if (futuro) {
      // siguiente mes posterior a la última cuota (o al mes actual)
      const base = last ? last.mes+"-01" : today.slice(0,7)+"-01";
      mes = addMonths(base,1).slice(0,7);
    } else if (last) {
      mes = addMonths(last.mes+"-01",1).slice(0,7);
    } else {
      mes = today.slice(0,7);
    }
    c.cuotas.push({ mes, monto:c.valor, pagado:false, fechaPago:null, moraPct:0, moraFija:0, moraTotal:0, ajuste:0, ajusteNota:"" });
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  },
  form(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    const esFuturo = daysBetween(today, q.mes+"-01") > 0;
    const yaPagado = q.pagado;
    Modal.open(`${yaPagado?'Editar cobro':'Registrar cobro'} — ${q.mes}`, `
      ${yaPagado?`<div class="notice">${I.info}<div>Este mes ya figura <b>cobrado</b>. Podés corregir el monto, la fecha, el ajuste o la mora; o reabrirlo con el botón "Marcar como impago".</div></div>`:""}
      ${(esFuturo&&!yaPagado)?`<div class="notice">${I.info}<div>Estás registrando un <b>cobro anticipado</b>: este mes todavía no comenzó. No se aplicará mora salvo que la fecha lo amerite.</div></div>`:""}
      <div class="form-row">
        <div class="field"><label>Mes</label><input value="${q.mes}" disabled></div>
        <div class="field"><label>Valor del alquiler de este mes</label><input id="co_monto" type="number" value="${q.monto}" oninput="Cobro.recalc(${contractId},${idx})">
          <div class="hint">Podés ajustar el alquiler de este mes puntual si hace falta.</div></div>
      </div>
      <div class="form-row one">
        <div class="field"><label>Fecha real de pago</label><input id="co_fecha" type="date" value="${yaPagado&&q.fechaPago?q.fechaPago:today}" onchange="Cobro.recalc(${contractId},${idx})">
          <div class="hint" id="co_aviso"></div></div>
      </div>
      <div class="form-section">
        <h4>${I.money} Ajuste del mes (opcional)</h4>
        <div class="form-row">
          <div class="field"><label>Monto del ajuste (${c.moneda})</label><input id="co_ajuste" type="number" value="${q.ajuste||0}" oninput="Cobro.recalc(${contractId},${idx})">
            <div class="hint">Negativo para descontar (ej. –15000), positivo para sumar.</div></div>
          <div class="field"><label>Aclaración del ajuste</label><input id="co_ajusteNota" value="${esc(q.ajusteNota||'')}" placeholder="Ej: compensación arreglo luz garage"></div>
        </div>
      </div>
      <div class="form-section" id="co_moraSec">
        <h4>${I.warn} Interés por mora</h4>
        <div class="form-row">
          <div class="field"><label>Porcentaje sobre alquiler (%)</label><input id="co_pct" type="number" step="0.1" value="${q.moraPct||0}" oninput="Cobro.recalc(${contractId},${idx})"></div>
          <div class="field"><label>Monto fijo (${c.moneda})</label><input id="co_fija" type="number" value="${q.moraFija||0}" oninput="Cobro.recalc(${contractId},${idx})"></div>
        </div>
        <div class="hint">Se pueden usar ambos a la vez: el % se calcula sobre el alquiler y se suma al monto fijo.</div>
      </div>
      <div class="breakdown" id="co_break"></div>
    `, `<button class="btn" onclick="Contract.view(${contractId})">Volver</button>
        ${yaPagado?`<button class="btn" onclick="Cobro.reabrir(${contractId},${idx})">Marcar como impago</button>`:""}
        <button class="btn btn-primary" onclick="Cobro.save(${contractId},${idx})">${yaPagado?'Guardar cambios':'Confirmar cobro'}</button>`);
    Cobro.recalc(contractId, idx);
  },
  recalc(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    const monto = parseFloat(document.getElementById('co_monto').value)||0;
    const fecha = document.getElementById('co_fecha').value;
    const dd = daysBetween(q.mes+"-10", fecha);
    const conMora = dd>0;
    document.getElementById('co_moraSec').style.display = conMora ? "" : "none";
    const aviso = document.getElementById('co_aviso');
    if (conMora) aviso.innerHTML = `<span style="color:var(--red)">Pago ${dd} días después del día 10 → corresponde mora.</span>`;
    else aviso.innerHTML = `<span style="color:var(--green)">Pago en término o anticipado (hasta el día 10). Sin mora.</span>`;
    const ajuste = parseFloat(document.getElementById('co_ajuste').value)||0;
    const pct = conMora ? (parseFloat(document.getElementById('co_pct').value)||0) : 0;
    const fija = conMora ? (parseFloat(document.getElementById('co_fija').value)||0) : 0;
    const moraPct = Math.round(monto * pct/100);
    const moraTotal = moraPct + fija;
    const total = monto + ajuste + moraTotal;
    document.getElementById('co_break').innerHTML = `
      <div class="line"><span>Alquiler ${q.mes}</span><span>${fmt(monto,c.moneda)}</span></div>
      ${ajuste?`<div class="line"><span>Ajuste${document.getElementById('co_ajusteNota').value?' ('+esc(document.getElementById('co_ajusteNota').value)+')':''}</span><span>${ajuste>0?'+':''}${fmt(ajuste,c.moneda)}</span></div>`:""}
      ${conMora?`<div class="line"><span>Mora ${pct}% s/alquiler</span><span>${fmt(moraPct,c.moneda)}</span></div>
      <div class="line"><span>Mora monto fijo</span><span>${fmt(fija,c.moneda)}</span></div>`:""}
      <div class="line total"><span>Total a cobrar</span><span>${fmt(total,c.moneda)}</span></div>`;
  },
  save(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    const monto = parseFloat(document.getElementById('co_monto').value)||0;
    const fecha = document.getElementById('co_fecha').value;
    const dd = daysBetween(q.mes+"-10", fecha);
    const conMora = dd>0;
    const ajuste = parseFloat(document.getElementById('co_ajuste').value)||0;
    const ajusteNota = document.getElementById('co_ajusteNota').value.trim();
    if (ajuste && !ajusteNota) { alert("Poné una aclaración para el ajuste del monto."); return; }
    const pct = conMora ? (parseFloat(document.getElementById('co_pct').value)||0) : 0;
    const fija = conMora ? (parseFloat(document.getElementById('co_fija').value)||0) : 0;
    q.monto = monto;
    q.pagado = true; q.fechaPago = fecha; q.moraPct = pct; q.moraFija = fija;
    q.moraTotal = Math.round(monto*pct/100) + fija;
    q.ajuste = ajuste; q.ajusteNota = ajusteNota;
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  },
  reabrir(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    q.pagado = false; q.fechaPago = null; q.moraPct = 0; q.moraFija = 0; q.moraTotal = 0;
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  },
  editCuota(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    Modal.open(`Editar mes — ${q.mes}`, `
      <div class="form-row">
        <div class="field"><label>Mes (AAAA-MM)</label><input id="ec_mes" value="${q.mes}" placeholder="2026-07"></div>
        <div class="field"><label>Valor del alquiler</label><input id="ec_monto" type="number" value="${q.monto}"></div>
      </div>
      <div class="hint">Cambiá el mes al que corresponde o el monto del alquiler de esa cuota. ${q.pagado?'Esta cuota figura cobrada; el estado de pago no se modifica acá (usá "Cobrar/Editar cobro" para eso).':''}</div>
    `, `<button class="btn" onclick="Contract.view(${contractId})">Volver</button><button class="btn btn-primary" onclick="Cobro.saveCuota(${contractId},${idx})">Guardar</button>`);
  },
  saveCuota(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    const mes = document.getElementById('ec_mes').value.trim();
    const monto = parseFloat(document.getElementById('ec_monto').value)||0;
    if (!/^\d{4}-\d{2}$/.test(mes)) { alert("El mes debe tener el formato AAAA-MM (ej: 2026-07)."); return; }
    q.mes = mes; q.monto = monto;
    if (q.pagado) q.moraTotal = Math.round(monto*(q.moraPct||0)/100) + (q.moraFija||0);
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  },
  delCuota(contractId, idx){
    const c = DB.contracts.find(c=>c.id===contractId);
    const q = c.cuotas[idx];
    if (q.pagado) { if (!confirm(`El mes ${q.mes} figura COBRADO. ¿Seguro que querés eliminarlo? Se perderá el registro de ese cobro.`)) return; }
    else { if (!confirm(`¿Eliminar el mes ${q.mes}?`)) return; }
    c.cuotas.splice(idx,1);
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  }
};

/* ---------- Actualización asistida del alquiler ---------- */
const Actualiz = {
  form(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    Modal.open(`Actualizar alquiler — ${esc(c.inquilino)}`, `
      <div class="notice">${I.info}<div>Ingresá el coeficiente del índice (${esc(c.indice)}) o directamente el nuevo valor. El sistema calcula, aplica el nuevo alquiler y guarda el historial. El valor anterior queda registrado.</div></div>
      <div class="form-row">
        <div class="field"><label>Valor actual</label><input value="${fmt(c.valor,c.moneda)}" disabled></div>
        <div class="field"><label>Índice</label><input value="${esc(c.indice)}" disabled></div>
      </div>
      <div class="form-section">
        <h4>${I.money} Cálculo por coeficiente</h4>
        <div class="form-row">
          <div class="field"><label>Coeficiente (ej. 1.2350)</label><input id="ac_coef" type="number" step="0.0001" placeholder="1.0000" oninput="Actualiz.recalc(${contractId})"></div>
          <div class="field"><label>Nuevo valor (calculado o manual)</label><input id="ac_nuevo" type="number" oninput="document.getElementById('ac_coef').value=''"></div>
        </div>
        <div class="hint">Si cargás coeficiente, se calcula solo. Si preferís, escribí el nuevo valor a mano.</div>
      </div>
      <div class="form-row one">
        <div class="field"><label>Rige desde</label><input id="ac_desde" type="date" value="${c.proxActualiz||today}"></div>
      </div>
      <div class="breakdown" id="ac_break"></div>
    `, `<button class="btn" onclick="Contract.view(${contractId})">Volver</button><button class="btn btn-primary" onclick="Actualiz.save(${contractId})">Aplicar actualización</button>`);
    Actualiz.recalc(contractId);
  },
  recalc(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    const coef = parseFloat(document.getElementById('ac_coef').value);
    const out = document.getElementById('ac_nuevo');
    let nuevo = parseFloat(out.value)||0;
    if (!isNaN(coef) && coef>0) { nuevo = Math.round(c.valor*coef); out.value = nuevo; }
    const dif = nuevo - c.valor;
    document.getElementById('ac_break').innerHTML = nuevo ? `
      <div class="line"><span>Valor anterior</span><span>${fmt(c.valor,c.moneda)}</span></div>
      <div class="line"><span>Nuevo valor</span><span>${fmt(nuevo,c.moneda)}</span></div>
      <div class="line total"><span>Variación</span><span>${dif>=0?'+':''}${fmt(dif,c.moneda)} (${c.valor?((dif/c.valor)*100).toFixed(1):0}%)</span></div>` : "";
  },
  save(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    const nuevo = parseFloat(document.getElementById('ac_nuevo').value)||0;
    const desde = document.getElementById('ac_desde').value || today;
    if (!nuevo || nuevo<=0) { alert("Ingresá un coeficiente o un nuevo valor válido."); return; }
    c.histValores = c.histValores || [];
    c.histValores.push({ desde, valor:nuevo });
    c.valor = nuevo;
    c.proxActualiz = addMonths(desde, c.actualizaCada||3);
    // reflejar el nuevo valor también en la propiedad
    const p = prop(c.propId); if (p) p.valorAlquiler = nuevo;
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
    setTimeout(()=>alert(`Alquiler actualizado a ${fmt(nuevo,c.moneda)} desde ${fdate(desde)}.\nPróxima actualización: ${fdate(c.proxActualiz)}.`),100);
  }
};

/* ---------- Comisión: pagos parciales ---------- */
const Deposito = {
  form(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    const pagado = (c.depositoPagos||[]).reduce((s,x)=>s+x.monto,0);
    const falta = (c.deposito||0) - pagado;
    Modal.open("Registrar pago de comisión", `
      <div class="form-row">
        <div class="field"><label>Total de la comisión</label><input value="${fmt(c.deposito,c.moneda)}" disabled></div>
        <div class="field"><label>Falta cobrar</label><input value="${fmt(falta>0?falta:0,c.moneda)}" disabled></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Monto del pago (${c.moneda})</label><input id="dp_monto" type="number" value="${falta>0?falta:0}"></div>
        <div class="field"><label>Fecha</label><input id="dp_fecha" type="date" value="${today}"></div>
      </div>
    `, `<button class="btn" onclick="Contract.view(${contractId})">Volver</button><button class="btn btn-primary" onclick="Deposito.save(${contractId})">Registrar pago</button>`);
  },
  save(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    const monto = parseFloat(document.getElementById('dp_monto').value)||0;
    const fecha = document.getElementById('dp_fecha').value || today;
    if (monto<=0) { alert("Ingresá un monto válido."); return; }
    c.depositoPagos = c.depositoPagos || [];
    c.depositoPagos.push({ fecha, monto });
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  }
};

/* ---------- Alquiler adelantado (opcional) ---------- */
const Adelanto = {
  form(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    Modal.open("Registrar alquiler adelantado", `
      <div class="notice">${I.info}<div>El alquiler adelantado es opcional y se registra como un cobro independiente, separado de la comisión y de las cuotas mensuales.</div></div>
      <div class="form-row">
        <div class="field"><label>Monto (${c.moneda})</label><input id="ad_monto" type="number" value="${c.valor}"></div>
        <div class="field"><label>Fecha de cobro</label><input id="ad_fecha" type="date" value="${today}"></div>
      </div>
      <div class="form-row one">
        <div class="field"><label>Concepto / aclaración</label><input id="ad_nota" placeholder="Ej: un mes de alquiler adelantado al firmar"></div>
      </div>
    `, `<button class="btn" onclick="Contract.view(${contractId})">Volver</button><button class="btn btn-primary" onclick="Adelanto.save(${contractId})">Registrar adelanto</button>`);
  },
  save(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    const monto = parseFloat(document.getElementById('ad_monto').value)||0;
    const fecha = document.getElementById('ad_fecha').value || today;
    const nota = document.getElementById('ad_nota').value.trim();
    if (monto<=0) { alert("Ingresá un monto válido."); return; }
    c.adelanto = { monto, fecha, nota };
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  },
  quitar(contractId){
    const c = DB.contracts.find(c=>c.id===contractId);
    c.adelanto = null;
    persist('contracts', DB.contracts.find(c=>c.id===contractId));
    Contract.view(contractId);
  }
};

/* ---------- Arranque ---------- */
/* ============================================================
   CAPA FIREBASE — autenticación, carga y persistencia
   ============================================================ */

// Mapa de colecciones de Firestore <-> arrays locales de DB
const COLECCIONES = {
  properties: "propiedades",
  leads: "interesados",
  contracts: "contratos",
};

const Auth = {
  // Dominio interno: el usuario NO lo ve ni lo escribe. Se agrega solo.
  DOMINIO: "@aj.com",
  async login(){
    let usuario = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errBox = document.getElementById('loginError');
    errBox.textContent = "";
    if (!usuario || !pass) { errBox.textContent = "Completá usuario y contraseña."; return; }
    // Si la persona escribió solo el usuario, le agregamos el dominio interno.
    // (Si por costumbre escribiera el correo completo, lo respetamos.)
    const email = usuario.includes("@") ? usuario : usuario + Auth.DOMINIO;
    try {
      await fbAuth.signInWithEmailAndPassword(email, pass);
      // el onAuthStateChanged se encarga del resto
    } catch(e) {
      const msg = {
        'auth/invalid-email':'El usuario no es válido.',
        'auth/user-not-found':'No existe ese usuario.',
        'auth/wrong-password':'Contraseña incorrecta.',
        'auth/invalid-credential':'Usuario o contraseña incorrectos.',
        'auth/too-many-requests':'Demasiados intentos. Esperá unos minutos.',
      }[e.code] || 'No se pudo iniciar sesión. Revisá los datos.';
      errBox.textContent = msg;
    }
  },
  async logout(){
    await fbAuth.signOut();
    location.reload();
  }
};

// Guardar (crear o actualizar) un item en Firestore.
// arrayName: 'properties' | 'leads' | 'contracts'
async function persist(arrayName, item){
  try {
    const col = COLECCIONES[arrayName];
    if (!col || !item) return;
    await fbDB.collection(col).doc(String(item.id)).set(JSON.parse(JSON.stringify(item)));
  } catch(e){
    console.error("Error al guardar en Firebase:", e);
    alert("No se pudo guardar el cambio en la nube. Revisá tu conexión.");
  }
}

// Eliminar un item de Firestore
async function persistDelete(arrayName, id){
  try {
    const col = COLECCIONES[arrayName];
    if (!col) return;
    await fbDB.collection(col).doc(String(id)).delete();
  } catch(e){
    console.error("Error al eliminar en Firebase:", e);
  }
}

// Guardar los contadores (nextId / nextCodigo) para que no se repitan
async function persistMeta(){
  try {
    await fbDB.collection("meta").doc("contadores").set({
      nextId: DB.nextId, nextCodigo: DB.nextCodigo
    });
  } catch(e){ console.error("Error guardando contadores:", e); }
}

// Cargar todos los datos desde Firestore al objeto DB local
async function cargarDatos(){
  // Propiedades
  const propsSnap = await fbDB.collection("propiedades").get();
  DB.properties = propsSnap.docs.map(d=>d.data());
  // Interesados
  const leadsSnap = await fbDB.collection("interesados").get();
  DB.leads = leadsSnap.docs.map(d=>d.data());
  // Contratos
  const contractsSnap = await fbDB.collection("contratos").get();
  DB.contracts = contractsSnap.docs.map(d=>d.data());
  // Contadores
  const metaDoc = await fbDB.collection("meta").doc("contadores").get();
  if (metaDoc.exists) {
    const m = metaDoc.data();
    DB.nextId = m.nextId || DB.nextId;
    DB.nextCodigo = m.nextCodigo || DB.nextCodigo;
  } else {
    // primera vez: calcular contadores a partir de lo que haya
    const maxId = arr => arr.reduce((mx,x)=>Math.max(mx,x.id||0),0);
    DB.nextId = {
      properties: maxId(DB.properties)+1,
      leads: maxId(DB.leads)+1,
      contracts: maxId(DB.contracts)+1,
    };
    DB.nextCodigo = DB.properties.reduce((mx,p)=>{
      const n = p.codigo ? parseInt(String(p.codigo).replace(/\D/g,''))||0 : 0;
      return Math.max(mx,n);
    },0) + 1;
  }
}

// Leer el rol del usuario logueado desde la colección "usuarios"
async function cargarRolUsuario(uid){
  const doc = await fbDB.collection("usuarios").doc(uid).get();
  if (!doc.exists) return null;
  return doc.data(); // { rol: 'admin'|'sales'|'rentals'|'viewer', nombre: '...' }
}

// Punto de entrada: reacciona al login/logout
fbAuth.onAuthStateChanged(async (user)=>{
  const loginScreen = document.getElementById('loginScreen');
  const bootLoader = document.getElementById('bootLoader');
  if (!user) {
    // no logueado: mostrar login
    loginScreen.style.display = "flex";
    bootLoader.style.display = "none";
    return;
  }
  // logueado: ocultar login, mostrar loader, cargar todo
  loginScreen.style.display = "none";
  bootLoader.style.display = "flex";
  try {
    const perfil = await cargarRolUsuario(user.uid);
    if (!perfil || !perfil.rol) {
      bootLoader.style.display = "none";
      await fbAuth.signOut();
      loginScreen.style.display = "flex";
      document.getElementById('loginError').textContent =
        "Tu cuenta no tiene un rol asignado. Pedile al administrador que lo configure.";
      return;
    }
    STATE.usuario = { uid:user.uid, email:user.email, nombre:perfil.nombre||user.email, rol:perfil.rol };
    await cargarDatos();
    bootLoader.style.display = "none";
    // arrancar la app con el rol real del usuario
    App.initFirebase(perfil.rol);
  } catch(e){
    console.error(e);
    bootLoader.style.display = "none";
    alert("Hubo un problema al cargar el sistema. Revisá tu conexión e intentá de nuevo.");
  }
});
</script>
